name: sirlocked-v3-local

services:
  mongo-v3:
    image: mongo:8.0
    container_name: sirlocked-v3-mongo
    restart: "no"
    ports:
      - "127.0.0.1:27018:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
