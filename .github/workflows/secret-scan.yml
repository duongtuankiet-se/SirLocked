name: Secret scanning

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Gitleaks release and verify checksum
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tool_dir="${RUNNER_TEMP}/sirlocked-gitleaks"
          mkdir -p "$tool_dir"
          cd "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$release/$archive" -o "$archive"
          # SHA-256 verified against the official v8.30.1 release checksums.
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check
          tar -xzf "$archive" gitleaks
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Scan complete reachable history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --log-opts="--all" --redact=100 --no-banner
