<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pct: 0 };
    this._timer = null;
  }

  componentDidMount() {
    clearInterval(this._timer);
    this._timer = setInterval(() => {
      const p = (this.state && this.state.pct) || 0;
      if (p >= 100) {
        clearInterval(this._timer);
        return;
      }
      const step = p < 70 ? 1.6 : p < 92 ? 0.8 : 1.5;
      this.setState({ pct: Math.min(100, p + step) });
    }, 70);
  }

  componentWillUnmount() {
    clearInterval(this._timer);
  }

  renderVals() {
    const p = Math.round((this.state && this.state.pct) || 0);
    const ready = p >= 100;
    let status = 'ĐANG MỞ HỒ SƠ VỤ ÁN';
    if (ready) status = 'HỒ SƠ ĐÃ SẴN SÀNG';
    else if (p < 30) status = 'ĐANG THU THẬP MANH MỐI';
    else if (p < 60) status = 'ĐANG ĐỐI CHIẾU DẤU VÂN TAY';
    else if (p < 88) status = 'ĐANG DỰNG LẠI DÒNG THỜI GIAN';
    return { pct: p, ready: ready, status: status };
  }
}
</script>
