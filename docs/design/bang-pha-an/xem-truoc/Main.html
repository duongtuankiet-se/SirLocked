<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Đăng nhập</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#050a12}
a{color:#07111f}a:hover{color:#8a6e2e}
.sl-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.sl-lang{min-width:48px;min-height:44px;padding:0 12px;border:0;border-radius:2px;background:transparent;color:#a99d8d;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:color .12s,background-color .12s}
.sl-lang:hover{color:#efd486}
.sl-lang[aria-pressed="true"]{background:#c7a24b;color:#07111f}
.sl-lang:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.sl-tab{position:relative;min-width:156px;min-height:44px;padding:12px 24px 10px;border:0;background:#c9b78f;color:#3b3226;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:13px;letter-spacing:.18em;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 100%,0 100%);transition:background-color .12s,color .12s,min-height .2s,padding .2s}
.sl-tab:hover{background:#d8c9a6;color:#07111f}
.sl-tab.is-active{min-height:50px;padding-top:16px;background:#eee4d2;color:#07111f;cursor:default}
.sl-tab:focus-visible{outline:2px solid #8a6e2e;outline-offset:-7px}
.sl-input{display:block;width:100%;box-sizing:border-box;min-height:46px;padding:10px 4px 8px;border:0;border-bottom:1.5px solid rgba(90,74,50,.55);border-radius:0;background:transparent;color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:16px;letter-spacing:.02em;outline:none;transition:border-color .12s,background-color .12s,box-shadow .12s}
.sl-input::placeholder{color:#6e5f48;opacity:1}
.sl-input:hover{border-bottom-color:#5a4a32}
.sl-input:focus{border-bottom-color:#07111f;box-shadow:0 1.5px 0 #07111f;background-color:rgba(239,212,134,.32)}
.sl-input.has-tool{padding-right:48px}
.sl-reveal{position:absolute;right:0;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:2px;background:transparent;color:#5a4a32;cursor:pointer;transition:color .12s,background-color .12s}
.sl-reveal:hover{color:#07111f}
.sl-reveal[aria-pressed="true"]{color:#07111f;background:rgba(239,212,134,.5)}
.sl-reveal:focus-visible{outline:2px solid #8a6e2e;outline-offset:-2px}
.sl-link{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0;padding:0;border:0;background:none;color:#5a4a32;font-family:'Crimson Text',Georgia,serif;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(90,74,50,.45);text-underline-offset:3px;cursor:pointer}
.sl-link:hover{color:#07111f;text-decoration-color:#07111f}
.sl-link:focus-visible{outline:2px solid #8a6e2e;outline-offset:2px}
.sl-link.is-strong{font-style:normal;font-weight:600;color:#07111f}
.sl-primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:54px;padding:0 24px;border:0;background:#07111f;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.22em;cursor:pointer;clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 10px,100% calc(100% - 10px),calc(100% - 10px) 100%,10px 100%,0 calc(100% - 10px),0 10px);box-shadow:inset 0 0 0 4px #07111f,inset 0 0 0 5px rgba(239,212,134,.4);transition:background-color .12s,color .12s,transform .12s}
.sl-primary:hover:not(:disabled){background:#142235;color:#fbf6ed}
.sl-primary:active:not(:disabled){transform:translateY(1px)}
.sl-primary:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #efd486,inset 0 0 0 5px #07111f,inset 0 0 0 6px rgba(239,212,134,.7)}
.sl-primary:disabled{cursor:progress;background:#142235;color:#c7a24b}
.sl-google{display:flex;align-items:center;justify-content:center;gap:12px;min-height:48px;padding:0 16px;border:1px solid #bfb39a;background:#ffffff;color:#1f1f1f;font-family:'Crimson Text',Georgia,serif;font-weight:600;font-size:17px;text-decoration:none;transition:background-color .12s,border-color .12s}
.sl-google:hover{background:#f7f3ea;border-color:#8a7d63;color:#1f1f1f}
.sl-google:focus-visible{outline:2px solid #8a6e2e;outline-offset:2px}
.sl-inked{filter:url(#sl-ink)}
@keyframes slRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slStamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-16deg) scale(2.3)}60%{opacity:1;transform:translate(-50%,-50%) rotate(-8deg) scale(.95)}80%{transform:translate(-50%,-50%) rotate(-9deg) scale(1.02)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}}
@keyframes slThud{0%,100%{transform:none}35%{transform:translateY(3px)}65%{transform:translateY(-1px)}}
@keyframes slFog{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
@keyframes slFlicker{0%,100%{opacity:1}9%{opacity:.8}11%{opacity:.97}47%{opacity:.88}50%{opacity:1}73%{opacity:.93}}
.sl-rise{animation:slRise .7s cubic-bezier(.2,.8,.2,1) both}
.sl-rise-late{animation:slRise .75s .16s cubic-bezier(.2,.8,.2,1) both}
.sl-stamp-in{animation:slStamp .45s cubic-bezier(.2,.8,.2,1) both}
.sl-thud{animation:slThud .28s .26s ease-out both}
.sl-fog{animation:slFog 16s ease-in-out infinite alternate}
.sl-flicker{animation:slFlicker 6.5s linear infinite}
@media (max-width:1020px){
  .sl-hero{align-items:center !important;align-self:center !important;text-align:center}
  .sl-hero-rule{display:none !important}
  .sl-pool{display:none !important}
  .sl-shade-x{background:linear-gradient(180deg,rgba(5,10,18,.5) 0%,rgba(5,10,18,.6) 32%,rgba(5,10,18,.86) 100%) !important}
}
@media (max-width:640px){
  .sl-roles{display:none !important}
  .sl-lens{width:40px !important;height:40px !important}
  header{padding-top:12px !important}
  .sl-sheet{padding:24px 20px 26px !important}
  .sl-tabs{padding:0 8px !important}
  .sl-tab{flex:1 1 0;min-width:0;padding-left:12px;padding-right:12px}
  .sl-filehead{font-size:10px !important;letter-spacing:.14em !important}
  .sl-title{font-size:30px !important}
}
@media (prefers-reduced-motion:reduce){
  .sl-rise,.sl-rise-late,.sl-stamp-in,.sl-thud,.sl-fog,.sl-flicker{animation:none !important}
}
</style>
