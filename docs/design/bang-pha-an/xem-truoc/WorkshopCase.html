<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Đêm khóa sổ · Workshop</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:#fbf6ed;text-decoration:none}
.s-brand:hover{color:#fbf6ed}
.s-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.s-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-decoration:none;transition:color .15s}
.s-nav a:hover{color:#efd486}
.s-nav a[aria-current="page"]{color:#efd486}
.s-nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#bf3b2c;box-shadow:0 2px 2px rgba(0,0,0,.6)}
.s-nav a[aria-current="page"]::before{content:"";position:absolute;right:8px;bottom:3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-nav a:focus-visible,.s-brand:focus-visible,.s-topbtn:focus-visible{outline:2px solid #efd486;outline-offset:-3px}
.s-topbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid rgba(239,212,134,.28);border-radius:2px;background:rgba(255,255,255,.02);color:#eee4d2;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s}
.s-topbtn:hover{border-color:#efd486;color:#efd486}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-link{display:inline-flex;align-items:center;min-height:44px;color:#5b5248;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.s-link:hover{color:#9e3f2a}
.s-link-gold{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#efd486;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(239,212,134,.4);text-underline-offset:4px}
.s-link-gold:hover{color:#fbf6ed;text-decoration-color:#fbf6ed}
.s-link:focus-visible,.s-link-gold:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
@keyframes sFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:6;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
.s-lamp{animation:sFlicker 7s linear infinite}
/* ---- Workshop · trang vụ án (wc-) ---- */
[hidden]{display:none !important}
.wc-up{text-transform:uppercase}
.wc-num{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1;font-variant-numeric:lining-nums proportional-nums}
.wc-kick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248;text-transform:uppercase}
.wc-kick.gold{color:#efd486}
.wc-kick.kraft{color:#4f4536}
.wc-h3{margin:2px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;line-height:1.12;color:#07111f}
.wc-h3.light{color:#fbf6ed}
.wc-mini{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#5b5248;text-transform:uppercase;white-space:nowrap}
.wc-mini.kraft{color:#4f4536}
.wc-card{position:relative;box-sizing:border-box;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55)}
.wc-margin{position:absolute;top:0;bottom:0;left:24px;width:1.5px;background:rgba(182,64,48,.5)}
.wc-tape{position:absolute;z-index:3;width:86px;height:24px;background:rgba(233,220,192,.72);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.wc-back svg{flex:none;transition:transform .15s}
.wc-back:hover svg{transform:translateX(-3px)}
/* stars */
.wc-stars{display:inline-flex;align-items:center;gap:2px}
.wc-stars svg{display:block;width:16px;height:16px}
.wc-stars .f{fill:#b5841f;stroke:#6b4c12;stroke-width:1.1;stroke-linejoin:round}
.wc-stars .e{fill:none;stroke:#8f8676;stroke-width:1.5;stroke-linejoin:round}
.wc-stars.sm svg{width:14px;height:14px}
.wc-stars.gold svg{width:18px;height:18px}
.wc-stars.gold .f{fill:#efd486;stroke:#c7a24b}
.wc-stars.gold .e{stroke:rgba(239,212,134,.5)}
.wc-pstar{position:relative;display:block}
.wc-pfill{position:absolute;top:0;left:0;bottom:0;overflow:hidden}
/* case header */
.wc-head{display:grid;grid-template-columns:minmax(0,1fr) 452px;gap:20px 40px;align-items:center;padding:0 32px 28px 30px;background:#e3dbc9;color:#15120e;transform:rotate(-.3deg)}
.wc-headmain{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.wc-title{position:relative;margin:-24px 0 0 -16px;padding:12px 30px 15px 26px;background:#0d1014;box-shadow:0 14px 30px rgba(0,0,0,.55);transform:rotate(-1.3deg)}
.wc-title h1{margin:3px 0 0 10px;font-family:'Playfair Display',Georgia,serif;font-size:46px;font-weight:700;line-height:1.04;color:#fbf6ed}
.wc-tdot{position:absolute;top:9px;left:11px;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.wc-byline{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 20px;align-self:stretch;margin-top:16px;padding-bottom:6px;border-bottom:3px double rgba(58,52,43,.6)}
.wc-rating{display:inline-flex;align-items:center;gap:10px}
.wc-ratenum{font-family:'Source Code Pro',ui-monospace,monospace;font-size:16px;font-weight:700;color:#07111f}
.wc-ratelink{display:inline-flex;align-items:center;min-height:44px;padding:0 2px;border:0;background:transparent;color:#5b5248;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px;cursor:pointer}
.wc-ratelink:hover{color:#9e3f2a}
.wc-ratelink:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.wc-lede{margin:14px 0 0;font-size:19px;line-height:1.45;color:#2a2318}
.wc-chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.wc-chips .s-chip{min-height:28px;padding:0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.wc-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
.wc-actions .s-btn{padding:0 22px}
.wc-photo{position:relative;margin:26px 0 0;padding:8px 8px 10px;background:#f1ece0;box-shadow:0 2px 0 rgba(0,0,0,.12),0 16px 28px rgba(0,0,0,.42);transform:rotate(1.4deg)}
.wc-photo svg{display:block;width:100%;height:auto}
/* folder + tabs */
.wc-file{position:relative}
.wc-tabs{position:relative;z-index:2;display:flex;align-items:flex-end;gap:4px;padding:0 0 0 22px}
.wc-tab{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:8px 22px 6px;box-sizing:border-box;border:0;background:#b9a072;color:#3b3226;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;clip-path:polygon(16px 0,calc(100% - 16px) 0,100% 100%,0 100%);box-shadow:inset 0 -9px 10px -8px rgba(0,0,0,.42);transition:background-color .15s,min-height .2s}
.wc-tab:hover{background:#c8b083;color:#07111f}
.wc-tab[aria-selected="true"]{min-height:58px;background:#d9c49a;color:#07111f;box-shadow:none;cursor:default}
.wc-tab:focus-visible{outline:none}
.wc-tab:focus-visible .wc-tabl{outline:2px solid #07111f;outline-offset:3px}
.wc-tabl{display:inline-flex;align-items:center;gap:9px;padding:6px 12px;background:#e7dcc3;box-shadow:inset 0 0 0 1px rgba(79,69,54,.28)}
.wc-tab[aria-selected="true"] .wc-tabl{background:#fbf6ed;box-shadow:inset 0 0 0 1px rgba(79,69,54,.35),0 1px 2px rgba(0,0,0,.18)}
.wc-tabl svg{flex:none;color:#5b5248}
.wc-tab[aria-selected="true"] .wc-tabl svg{color:#9e3f2a}
.wc-count{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 5px;box-sizing:border-box;background:#0d1014;color:#efd486;font-size:10px;letter-spacing:.06em}
.wc-folder{position:relative;background:#d9c49a;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 rgba(0,0,0,.2),0 26px 50px rgba(0,0,0,.55)}
.wc-folder::before{content:"";position:absolute;z-index:-1;left:12px;right:-9px;top:12px;bottom:-11px;background:#ad9465;transform:rotate(.45deg);box-shadow:0 20px 34px rgba(0,0,0,.45)}
.wc-pane{--d0:.3s;position:relative;padding:26px 28px 34px}
.wc-pane.wc-first{--d0:1.2s}
.wc-panel:focus-visible{outline:2px solid #07111f;outline-offset:8px}
.wc-lensbox{position:absolute;inset:0;z-index:6;overflow:hidden;pointer-events:none}
.wc-lens{position:absolute;left:var(--wx);top:0;width:0;height:0;box-sizing:border-box;border-radius:50%;border:7px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.16),rgba(255,255,255,0) 40%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 10px 26px rgba(0,0,0,.4);transform:translate(-50%,-50%);opacity:0}
.wc-o1{--wx:106px}.wc-o2{--wx:294px}.wc-o3{--wx:506px}
.wc-lede,.wc-rvtext,.wc-ann,.wc-gapnote,.wc-hint,.wc-tagsub,.wc-vcap,.wc-vnote{text-wrap:pretty}
/* stats */
.wc-panhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin:0 0 24px}
.wc-safe{display:inline-flex;align-items:center;gap:9px;min-height:30px;padding:0 12px;background:#0d1014;color:#efd486;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;box-shadow:0 8px 16px rgba(0,0,0,.3);transform:rotate(.7deg)}
.wc-row1{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:30px;align-items:stretch}
.wc-verdict{display:flex;flex-direction:column;padding:20px 26px 22px 48px;background:#fbf6ed;transform:rotate(-.6deg)}
.wc-vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto auto auto;gap:0 24px;margin:20px 0 0}
.wc-vgrid > div{display:grid;grid-row:span 3;grid-template-rows:subgrid;min-width:0}
.wc-vgrid dt{align-self:end}
.wc-vgrid dd{margin:0}
.wc-stampl{display:inline-flex;align-items:center;gap:6px;padding:4px 9px 4px 7px;border:3px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;line-height:1.3;text-transform:uppercase;transform:rotate(-2deg);mix-blend-mode:multiply}
.wc-stampl{text-wrap:balance}
.wc-stampl svg{flex:none}
.wc-stampl.ok{color:#2f6363}
.wc-stampl.bad{color:#9e3f2a;transform:rotate(1.5deg)}
.wc-vbig{margin:14px 0 0 !important;font-size:66px}
.wc-vbig.ok{color:#2f6363}
.wc-vbig.bad{color:#9e3f2a}
.wc-vcap{margin:6px 0 0 !important;font-size:16px;font-style:italic;line-height:1.3;color:#3b3328}
.wc-splitbox{padding-top:26px}
.wc-vfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:auto;padding-top:16px}
.wc-vnote{margin:0 0 6px;font-size:16px;font-style:italic;line-height:1.3;color:#3b3328}
.wc-rstamp{flex:none;width:86px;height:86px;margin:-8px -8px -10px 0;color:#9e3f2a;opacity:.82;transform:rotate(-14deg);mix-blend-mode:multiply}
.wc-split{position:relative;display:flex;gap:2px;height:14px}
.wc-sseg{display:block;height:100%}
.wc-sseg.ok{width:calc(59% - 1px);background:#20706b;border-radius:3px 0 0 3px;transform-origin:0 50%}
.wc-sseg.bad{width:calc(41% - 1px);background:#9e3f2a;border-radius:0 3px 3px 0;transform-origin:100% 50%}
.wc-splitpin{position:absolute;z-index:2;top:-5px;left:59%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 3px 4px rgba(0,0,0,.45)}
.wc-scale{position:relative;height:14px;margin-top:7px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.08em;color:#5b5248;font-variant-numeric:tabular-nums}
.wc-scale span{position:absolute;top:0}
.wc-timecard{display:flex;flex-direction:column;padding:22px 24px 20px;background:#f4efe3;transform:rotate(.35deg)}
.wc-chead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.wc-legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0;padding:0;list-style:none}
.wc-legend li{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:#2a2318}
.wc-legend i{display:inline-block;flex:none;width:10px;height:13px}
.wc-legend i.ok{background:#20706b;border-radius:3px 3px 0 0}
.wc-legend i.bad{background:#9e3f2a;border-radius:0 0 3px 3px}
.wc-legend i.mean{width:2px;height:16px;background:#bf3b2c}
.wc-plot{position:relative;margin-top:30px}
.wc-vlines span{position:absolute;top:0;bottom:0;width:1px;background:rgba(91,82,72,.13)}
.wc-hist{position:relative;z-index:1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));margin:0;padding:0;list-style:none}
.wc-col{position:relative;display:grid;grid-template-rows:130px 26px 82px;outline:none;transition:background-color .12s}
.wc-col:hover,.wc-col:focus-visible{background:rgba(239,212,134,.42)}
.wc-col:focus-visible{box-shadow:inset 0 0 0 2px #07111f}
.wc-cup{grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.wc-cdn{grid-row:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.wc-bar{display:block;flex:none;width:min(24px,calc(100% - 6px))}
.wc-bar.ok{background:#20706b;border-radius:4px 4px 0 0;transform-origin:50% 100%}
.wc-bar.bad{background:#9e3f2a;border-radius:0 0 4px 4px;transform-origin:50% 0}
.wc-peak{padding:2px 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;color:#2a2318;font-variant-numeric:tabular-nums}
.wc-axis{position:absolute;z-index:1;left:0;right:0;top:130px;height:26px;box-sizing:border-box;border-top:1px solid rgba(58,52,43,.55);border-bottom:1px solid rgba(58,52,43,.55);pointer-events:none}
.wc-axis span{position:absolute;top:0;bottom:0;display:flex;align-items:center;transform:translateX(-50%);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;color:#5b5248;font-variant-numeric:tabular-nums}
.wc-meanline{position:absolute;z-index:2;left:48.03%;width:2px;margin-left:-1px;background:#bf3b2c;box-shadow:2px 3px 0 rgba(0,0,0,.16);pointer-events:none}
.wc-meanline.up{top:0;height:130px}
.wc-meanline.dn{top:156px;bottom:0}
.wc-meanpin{position:absolute;z-index:4;top:-9px;left:48.03%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);box-shadow:0 3px 4px rgba(0,0,0,.4);pointer-events:none}
.wc-meanlbl{position:absolute;z-index:3;top:-11px;right:51.97%;margin-right:14px;padding:3px 8px;background:#0d1014;color:#efd486;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;white-space:nowrap;pointer-events:none}
.wc-ann{position:absolute;z-index:2;left:0;bottom:calc(100% - 94px);width:min(42%,300px);margin:0;font-size:15px;font-style:italic;line-height:1.3;color:#3b3328;pointer-events:none}
.wc-ann strong{font-style:normal;font-weight:600;color:#07111f}
.wc-brk{position:absolute;z-index:2;left:2px;top:100px;width:calc(27.273% - 4px);height:7px;box-sizing:border-box;border:1.5px solid #3b3328;border-bottom:0;pointer-events:none}
.wc-tip{position:absolute;z-index:8;left:50%;top:-10px;display:flex;flex-direction:column;gap:3px;padding:8px 11px 9px;background:#0d1014;color:#cfc4b1;font-size:15px;line-height:1.25;white-space:nowrap;box-shadow:0 10px 22px rgba(0,0,0,.35);transform:translate(-50%,-100%);opacity:0;visibility:hidden;transition:opacity .12s,visibility .12s;pointer-events:none}
.wc-col:hover .wc-tip,.wc-col:focus-visible .wc-tip{opacity:1;visibility:visible}

.wc-col:nth-last-child(-n+2) .wc-tip{left:auto;right:0;transform:translate(0,-100%)}
.wc-tip b{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#b3a794;text-transform:uppercase}
.wc-tip span{display:flex;align-items:center;gap:8px}

.wc-tip i.bad{background:#d0533e}
/* evidence tags */
.wc-tags{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px;margin:34px 0 0;padding:26px 0 0}
.wc-tag{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding:34px 14px 18px;box-sizing:border-box;text-align:center;background:linear-gradient(135deg,transparent 13px,#efe6d1 13.5px) left top/51% 100% no-repeat,linear-gradient(225deg,transparent 13px,#efe6d1 13.5px) right top/51% 100% no-repeat;filter:drop-shadow(0 1px 0 rgba(0,0,0,.22)) drop-shadow(0 12px 12px rgba(0,0,0,.36));color:#07111f}
.wc-tag:nth-child(even){background:linear-gradient(135deg,transparent 13px,#e6d7b6 13.5px) left top/51% 100% no-repeat,linear-gradient(225deg,transparent 13px,#e6d7b6 13.5px) right top/51% 100% no-repeat}
.wc-tag dd{margin:0}
.wc-hole{position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#b39c6c;box-shadow:0 0 0 3px #c7a24b,0 0 0 4px #5e4a1c,inset 0 2px 3px rgba(0,0,0,.5)}
.wc-twine{position:absolute;z-index:2;top:-26px;left:50%;width:30px;height:44px;margin-left:-15px;overflow:visible}
.wc-tag dt{display:flex;align-items:center;justify-content:center;gap:7px;min-height:30px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.13em;line-height:1.3;color:#4f4536;text-transform:uppercase}
.wc-tag dt{text-wrap:balance}
.wc-tag dt svg{flex:none;color:#9e3f2a}
.wc-gauge{position:relative;width:100%;max-width:176px;margin-top:10px !important}
.wc-gauge svg{display:block;width:100%;height:auto;overflow:visible}
.wc-gnum{position:absolute;left:0;right:0;bottom:12%;font-size:38px;color:#07111f;text-align:center}
.wc-gnum.w{bottom:auto;top:58%;font-size:26px;transform:translateY(-46%)}
.wc-tagsub{margin-top:10px !important;font-size:15px;font-style:italic;line-height:1.25;color:#3b3328}
.wc-track{fill:none;stroke:rgba(26,44,66,.13);stroke-width:10}
.wc-arc{fill:none;stroke:#1a2c42;stroke-width:10}
.wc-band{fill:none;stroke-width:10}
.wc-ticks{fill:none;stroke:rgba(58,52,43,.5);stroke-width:1.3;stroke-linecap:round}
.wc-glbl{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;fill:#5b5248;text-anchor:middle;dominant-baseline:central}

.wc-pinm{transform-box:view-box;transform-origin:88px 88px}
.wc-pinm.w{transform-origin:88px 58px}
/* reviews */

.wc-sum{padding:20px 24px 22px;background:#0d1014;color:#eee4d2;box-shadow:inset 0 0 0 1px rgba(239,212,134,.16),0 22px 44px rgba(0,0,0,.5);transform:rotate(-.5deg)}
.wc-sumtop{display:flex;align-items:center;gap:18px;margin-top:10px}
.wc-sumbig{margin:0;font-size:72px;color:#efd486}
.wc-sumsub{margin:6px 0 0;font-size:16px;font-style:italic;color:#cfc4b1}
.wc-dist{display:flex;flex-direction:column;gap:5px;margin:16px 0 0;padding:0;list-style:none}
.wc-dist li{display:grid;grid-template-columns:30px minmax(0,1fr) 24px;align-items:center;gap:10px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;color:#b3a794;font-variant-numeric:tabular-nums}

.wc-dist li > span:last-child{text-align:right}
.wc-dbar{display:block;height:8px;background:rgba(239,212,134,.13)}

.wc-crit{display:flex;flex-direction:column;gap:9px;margin:16px 0 0;padding:14px 0 0;border-top:1px dashed rgba(179,167,148,.45)}
.wc-crit div{display:grid;grid-template-columns:104px minmax(0,1fr) 34px;align-items:center;gap:12px}
.wc-crit dt{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#b3a794;text-transform:uppercase}
.wc-crit dd{margin:0}
.wc-cm{display:block;height:6px;background:rgba(239,212,134,.15)}
.wc-cm span{display:block;height:100%;background:#efd486;border-radius:0 3px 3px 0;transform-origin:0 50%}
.wc-cv{font-size:21px;color:#fbf6ed;text-align:right}
.wc-form{padding:20px 22px 24px 44px;background:#fbf6ed;transform:rotate(.4deg)}
.wc-fstamp{position:absolute;z-index:4;top:22px;right:20px;display:inline-block;padding:5px 10px;border:4px double #2f6363;color:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;white-space:nowrap;transform:rotate(-8deg);mix-blend-mode:multiply;pointer-events:none}

.wc-ovtop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-right:4px}

.wc-req{color:#9e3f2a}
.wc-rval{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.12em;color:#5b5248;text-transform:uppercase}
.wc-crits{display:flex;flex-direction:column;margin-top:8px}
.wc-crits .wc-frow{border-bottom:1px solid rgba(79,154,154,.35)}
.wc-rate{display:inline-flex;flex-direction:row-reverse;justify-content:flex-end}
.wc-rate input{position:absolute;width:1px;height:1px;margin:0;opacity:0;pointer-events:none}
.wc-rate label{display:grid;place-items:center;width:44px;height:44px;cursor:pointer}
.wc-rate label svg{display:block;width:24px;height:24px;fill:transparent;stroke:#8f8676;stroke-width:1.6;stroke-linejoin:round;transition:transform .12s,fill .12s,stroke .12s}
.wc-rate.big label svg{width:31px;height:31px}
.wc-rate input:focus-visible + label{outline:2px solid #07111f;outline-offset:-4px}
.wc-v1 label:nth-of-type(n+5) svg,.wc-v2 label:nth-of-type(n+4) svg,.wc-v3 label:nth-of-type(n+3) svg,.wc-v4 label:nth-of-type(n+2) svg,.wc-v5 label svg{fill:#c99a2e;stroke:#6b4c12}
.wc-rate:hover label svg{fill:transparent;stroke:#8f8676}
.wc-rate label:hover svg,.wc-rate label:hover ~ label svg{fill:#e2b84f;stroke:#6b4c12}
.wc-rate label:hover svg{transform:scale(1.14)}
.wc-field{margin-top:14px}
.wc-note{display:block;width:100%;box-sizing:border-box;min-height:88px;margin-top:4px;padding:2px 4px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);border-radius:0;background-color:transparent;background-image:linear-gradient(transparent 27px,rgba(79,154,154,.35) 27px);background-size:100% 28px;color:#07111f;font-family:'Crimson Text',Georgia,serif;font-size:17px;line-height:28px;resize:vertical;outline:none;transition:background-color .15s}

.wc-check{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:6px;font-size:16px;color:#2a2318;cursor:pointer}

.wc-hint{display:flex;gap:8px;margin:0;padding:8px 10px;background:rgba(122,63,39,.1);box-shadow:inset 3px 0 0 #7a3f27;font-size:15px;line-height:1.3;color:#3b2418}
.wc-hint svg{flex:none;margin-top:2px}
.wc-submit{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;margin-top:16px}
.wc-toastbox{min-width:0}
.wc-toast{display:inline-flex;align-items:center;gap:10px;margin:0;padding:9px 14px 9px 12px;background:#0d1014;color:#fbf6ed;font-size:16px;line-height:1.25;box-shadow:inset 3px 0 0 #d0533e,0 10px 20px rgba(0,0,0,.3);transform:rotate(-.8deg)}

.wc-revlist{min-width:0}
.wc-listhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.wc-list{display:flex;flex-direction:column;gap:16px;margin:14px 0 0;padding:0;list-style:none}
.wc-rv{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;padding:16px 22px 16px 42px;background:#fbf6ed;box-shadow:0 1px 0 rgba(0,0,0,.18),0 12px 24px rgba(40,26,10,.32)}
.wc-ava{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.02em}

.wc-rvmeta{display:flex;align-items:center;gap:12px}
.wc-res{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border:1.5px solid currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;line-height:1.5;text-transform:uppercase;white-space:nowrap}
.wc-res.ok{color:#2f6363;background:rgba(79,154,154,.12)}
.wc-res.bad{color:#9e3f2a;background:rgba(158,63,42,.07)}

.wc-rvtext{margin:8px 0 0;font-size:17px;line-height:1.42;color:#2a2318}
.wc-rvcrit{display:flex;flex-wrap:wrap;gap:4px 16px;margin:8px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.12em;color:#5b5248;text-transform:uppercase}
.wc-rvcrit b{color:#07111f;font-weight:700}

.wc-morebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:20px}

.wc-lb{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:32px;align-items:start}

.wc-seg{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#3b3328;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:background-color .12s,color .12s}

.wc-table{width:100%;margin-top:10px;border-collapse:collapse}

.wc-medal.bronze{color:#c98d57;--md:#5a3416}

.wc-team{display:flex;align-items:center;gap:12px;min-width:0}
.wc-pair{display:inline-flex;flex:none}
.wc-mono{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 2px #f4efe3;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:11px;font-weight:700;font-style:normal;letter-spacing:0}

.wc-tname{min-width:0;overflow-wrap:break-word}

.wc-grade{display:inline-grid;place-items:center;width:24px;height:24px;margin-left:8px;border-radius:50%;font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700;box-shadow:inset 0 0 0 1.5px currentColor;vertical-align:middle}

.wc-gap td{height:auto;padding:7px 12px;border-bottom:1px dashed rgba(79,154,154,.6);text-align:center;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.24em;color:#5b5248;text-transform:uppercase}

.wc-youtag{flex:none;padding:2px 6px;background:#9e3f2a;color:#fbf6ed;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.wc-lbfoot{display:flex;justify-content:space-between;gap:12px;margin:12px 0 0}

.wc-lbside{display:flex;flex-direction:column;gap:30px;min-width:0}
.wc-scard{padding:20px 22px 18px 44px;background:#fbf6ed;transform:rotate(.5deg)}
.wc-scrole{margin:4px 0 0;font-size:16px;font-style:italic;line-height:1.3;color:#3b3328}
.wc-sclist{display:flex;flex-direction:column;gap:9px;margin:14px 0 0}

.wc-scm{display:block;height:8px;background:rgba(26,44,66,.13)}
