<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Đặt lại mật khẩu</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
a{color:#07111f}a:hover{color:#9e3f2a}
.rp-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.rp-mono{font-family:'Source Code Pro',ui-monospace,monospace}
.rp-serif{font-family:'Playfair Display',Georgia,serif}
.rp-body{font-family:'Crimson Text',Georgia,serif}
.rp-lang{min-width:48px;min-height:44px;padding:0 12px;border:0;border-radius:2px;background:transparent;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:color .12s,background-color .12s}
.rp-lang:hover{color:#efd486}
.rp-lang[aria-pressed="true"]{background:#c7a24b;color:#07111f}
.rp-lang:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.rp-title{margin:16px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;line-height:1.1;color:#07111f;text-wrap:balance}
.rp-title:focus{outline:none}
.rp-sub{margin:6px 0 0;font-size:18px;font-style:italic;line-height:1.35;color:#5b5248;text-wrap:pretty}
.rp-text{margin:10px 0 0;font-size:17px;line-height:1.42;color:#2a2318;text-wrap:pretty}
.rp-aside{margin:8px 0 0;font-size:16px;font-style:italic;line-height:1.4;color:#5b5248;text-wrap:pretty}
.rp-label{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:#5b5248}
.rp-hint{display:block;margin-top:2px;font-family:'Crimson Text',Georgia,serif;font-size:15px;font-style:italic;font-weight:400;letter-spacing:0;color:#5b5248}
.rp-input{display:block;width:100%;box-sizing:border-box;min-height:46px;padding:10px 52px 8px 4px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);border-radius:0;background:transparent;color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:16px;letter-spacing:.04em;outline:none;transition:border-color .12s,background-color .12s,box-shadow .12s}
.rp-input::placeholder{color:#6b6257;opacity:1}
.rp-input:hover{border-bottom-color:#2f6363}
.rp-input:focus{border-bottom-color:#07111f;box-shadow:0 1.5px 0 #07111f;background-color:rgba(239,212,134,.35)}
.rp-input[aria-invalid="true"]{border-bottom-color:#9e3f2a;background-color:rgba(158,63,42,.07)}
.rp-input[aria-invalid="true"]:focus{box-shadow:0 1.5px 0 #9e3f2a}
.rp-reveal{position:absolute;right:0;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:2px;background:transparent;color:#5b5248;cursor:pointer;transition:color .12s,background-color .12s}
.rp-reveal:hover{color:#07111f}
.rp-reveal[aria-pressed="true"]{color:#07111f;background:rgba(239,212,134,.5)}
.rp-reveal:focus-visible{outline:2px solid #9e3f2a;outline-offset:-2px}
.rp-rules{display:flex;flex-wrap:wrap;gap:2px 18px;margin:7px 0 0;padding:0;list-style:none}
.rp-rule{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:15px;line-height:1.3;color:#5b5248;transition:color .2s}
.rp-rule svg{flex:none}
.rp-rule .ic-ok,.rp-rule .ic-bad{display:none}
.rp-rule.is-ok{color:#2f6363}
.rp-rule.is-ok .ic-ok{display:inline}
.rp-rule.is-ok .ic-no{display:none}
.rp-rule.is-bad{color:#9e3f2a}
.rp-rule.is-bad .ic-bad{display:inline}
.rp-rule.is-bad .ic-no{display:none}
.rp-msg{display:flex;align-items:flex-start;gap:8px;margin:8px 0 0;padding:8px 10px;background:rgba(158,63,42,.1);box-shadow:inset 3px 0 0 #9e3f2a;font-size:15.5px;line-height:1.35;color:#6b2a1c;animation:rpReveal .3s cubic-bezier(.2,.8,.2,1) both}
.rp-msg[hidden]{display:none}
.rp-msg svg{flex:none;margin-top:1px}
.rp-link{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin:-12px 0;color:#5b5248;font-family:'Crimson Text',Georgia,serif;font-size:16px;font-style:italic;text-decoration:none}
.rp-link .u{text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.rp-link:hover{color:#9e3f2a}
.rp-link:hover .u{text-decoration-color:#9e3f2a}
.rp-link:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.rp-primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;box-sizing:border-box;min-height:54px;padding:8px 20px;border:0;border-radius:2px;background:#9e3f2a;color:#fbf6ed;font-family:'Source Code Pro',ui-monospace,monospace;font-weight:700;font-size:14px;letter-spacing:.2em;line-height:1.3;text-align:center;cursor:pointer;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3);transition:background-color .12s,transform .12s,box-shadow .12s}
.rp-primary svg{flex:none}
.rp-primary span{text-wrap:balance}
.rp-primary:hover:not(:disabled){background:#b2472f}
a.rp-primary,a.rp-primary:hover{color:#fbf6ed;text-decoration:none}
.rp-primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #6b2a1c,0 4px 10px rgba(158,63,42,.3)}
.rp-primary:focus-visible{outline:2px solid #07111f;outline-offset:3px}
.rp-primary:disabled{cursor:progress;background:#7d3122;color:#efd486}
.rp-herobox{position:relative;margin-top:12px;aspect-ratio:360 / 132}
.rp-herobox > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.rp-stampbox{position:absolute;z-index:2;right:-4px;top:24%;pointer-events:none}
.rp-stamp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 14px 7px;border:5px double currentColor;white-space:nowrap;transform:rotate(-8deg);mix-blend-mode:multiply;filter:url(#rp-ink)}
.rp-stamp b{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;letter-spacing:.06em;line-height:1}
.rp-stamp small{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.2em}
.rp-stamp-in{animation:rpStamp .45s 1.4s cubic-bezier(.2,.8,.2,1) both}
.rp-stamp-quick{animation:rpStamp .45s .95s cubic-bezier(.2,.8,.2,1) both}
.rp-shackle{animation:rpShackle .42s 1.05s cubic-bezier(.3,1.6,.5,1) both}
.rp-key{transform:scaleY(.3);animation:rpTurn .42s .6s cubic-bezier(.5,0,.3,1) both}
.rp-click{opacity:0;animation:rpClick .5s 1.3s ease-out both}
.anim-a{animation:rpWipeA .55s cubic-bezier(.4,0,.2,1) both}
.anim-b{animation:rpWipeB .55s cubic-bezier(.4,0,.2,1) both}
.rp-shake-a{animation:rpShakeA .4s ease-out both}
.rp-shake-b{animation:rpShakeB .4s ease-out both}
.rp-lockbody{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.rp-lockbody.is-open{transform:translateY(22px)}
.rp-lockbody.is-busy{animation:rpJiggle .5s ease-in-out infinite}
.rp-threads .thread{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:rpDraw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.rp-threads .shadow{stroke:rgba(0,0,0,.42);stroke-width:2.8}
.rp-threads .red{stroke:#bf3b2c;stroke-width:2.1;transition:stroke .4s,opacity .4s}
.rp-threads .d1{animation-delay:.2s}
.rp-threads .d2{animation-delay:.32s}
.rp-threads .d3{animation-delay:.44s}
.rp-threads .d4{animation-delay:.56s}
.rp-threads .d5{animation-delay:.8s}
.rp-threads .d6{animation-delay:.9s}
.rp-threads .d7{animation-delay:1s}
.rp-threads.is-solving .red{stroke:#efd486;stroke-width:2.4;stroke-dasharray:.07 .015;stroke-dashoffset:0;filter:url(#rp-glow);animation:rpRunT .7s linear infinite}
.rp-threads.is-solving .shadow{opacity:.35}
.rp-threads.is-solved .red{stroke:#efd486;stroke-width:2.3;filter:url(#rp-glow)}
.rp-threads.is-cold .red{stroke:#8a4436;opacity:.62}
.rp-threads.is-cold .shadow{opacity:.5}
.rp-threads.is-solving .red.d1,.rp-threads.is-solving .red.d2,.rp-threads.is-solving .red.d3,.rp-threads.is-solving .red.d4,.rp-threads.is-solving .red.d5,.rp-threads.is-solving .red.d6,.rp-threads.is-solving .red.d7{animation-delay:0s}
.rp-pin{transition:box-shadow .4s}
.rp-pin.is-lit{box-shadow:0 0 0 4px rgba(239,212,134,.35),0 0 24px 8px rgba(239,212,134,.45),0 6px 8px rgba(0,0,0,.45) !important}
@keyframes rpDraw{to{stroke-dashoffset:0}}
@keyframes rpRunT{to{stroke-dashoffset:-.085}}
@keyframes rpRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes rpFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
@keyframes rpStamp{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes rpShackle{from{transform:translateY(-20px)}to{transform:none}}
@keyframes rpTurn{from{transform:scaleY(1)}to{transform:scaleY(.3)}}
@keyframes rpClick{0%{opacity:0;transform:scale(.6)}40%{opacity:1}100%{opacity:0;transform:scale(1.25)}}
@keyframes rpWipeA{from{clip-path:circle(0% at 50% 22%)}to{clip-path:circle(150% at 50% 22%)}}
@keyframes rpWipeB{from{clip-path:circle(0% at 50% 22%)}to{clip-path:circle(150% at 50% 22%)}}
@keyframes rpShakeA{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes rpShakeB{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes rpJiggle{0%,100%{transform:translateY(22px)}50%{transform:translateY(16px)}}
@keyframes rpReveal{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.rp-rise{animation:rpRise .7s cubic-bezier(.2,.8,.2,1) both}
.rp-rise-late{animation:rpRise .75s .12s cubic-bezier(.2,.8,.2,1) both}
.rp-lamp{animation:rpFlicker 7s linear infinite}
@media (max-width:640px){
  .rp-col{padding-top:88px !important}
  .rp-card{padding:24px 20px 22px 42px !important}
  .rp-margin{left:28px !important}
  .rp-label-dark{padding:14px 26px 12px !important}
  .rp-wordmark{font-size:36px !important}
  .rp-title{font-size:28px}
  .rp-primary{font-size:13px;letter-spacing:.14em;gap:10px}
  .rp-stamp{padding:7px 10px 5px;border-width:4px}
  .rp-stamp b{font-size:17px}
  .rp-stamp small{letter-spacing:.16em}
}
@media (prefers-reduced-motion:reduce){
  .rp-threads .thread{animation:none !important;stroke-dashoffset:0 !important}
  .rp-threads.is-solving .red{animation:none !important}
  .rp-rise,.rp-rise-late,.rp-lamp,.rp-stamp-in,.rp-stamp-quick,.rp-shackle,.rp-key,.rp-click,.anim-a,.anim-b,.rp-shake-a,.rp-shake-b,.rp-lockbody.is-busy,.rp-msg{animation:none !important}
  .rp-lockbody,.rp-threads .red,.rp-pin{transition:none !important}
}
</style>
