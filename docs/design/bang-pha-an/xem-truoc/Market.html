<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Chợ đồ</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.s-brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:#fbf6ed;text-decoration:none}
.s-brand:hover{color:#fbf6ed}
.s-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.s-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-decoration:none;transition:color .15s}
.s-nav a:hover{color:#efd486}
.s-nav a[aria-current="page"]{color:#efd486}
.s-nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#bf3b2c;box-shadow:0 2px 2px rgba(0,0,0,.6)}
.s-nav a[aria-current="page"]::before{content:"";position:absolute;right:8px;bottom:3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-nav a:focus-visible,.s-brand:focus-visible,.s-topbtn:focus-visible{outline:2px solid #efd486;outline-offset:-3px}
.s-topbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid rgba(239,212,134,.28);border-radius:2px;background:rgba(255,255,255,.02);color:#eee4d2;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s}
.s-topbtn:hover{border-color:#efd486;color:#efd486}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 18px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.16em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #07111f;outline-offset:3px}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
@keyframes sFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:6;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
.s-lamp{animation:sFlicker 7s linear infinite}
.mk-tab{position:relative;min-width:150px;min-height:46px;padding:12px 22px 10px;border:0;background:#c9b78f;color:#3b3226;font-family:'Source Code Pro',ui-monospace,monospace;font-weight:700;font-size:12px;letter-spacing:.2em;cursor:pointer;clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 100%,0 100%);transition:background-color .12s,color .12s}
.mk-tab:hover{background:#d8c9a6;color:#07111f}
.mk-tab[aria-pressed="true"]{min-height:52px;padding-top:16px;background:#f4efe3;color:#07111f;cursor:default}
.mk-tab:focus-visible{outline:2px solid #9e3f2a;outline-offset:-7px}
.mk-buy{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:24px}
.mk-side h3{margin:0 0 6px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.18em;color:#5b5248}
.mk-cat{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:36px;padding:0 10px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;color:#2a2318;font-family:'Crimson Text',Georgia,serif;font-size:16px;text-align:left;cursor:pointer}
.mk-cat:hover{background:rgba(7,17,31,.06)}
.mk-cat[aria-pressed="true"]{background:#07111f;color:#fbf6ed}
.mk-cat:focus-visible{outline:2px solid #9e3f2a;outline-offset:1px}
.mk-cat span:last-child{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;opacity:.75}
.mk-check{display:flex;align-items:center;gap:10px;min-height:34px;font-size:16px;color:#2a2318;cursor:pointer}
.mk-check input{width:16px;height:16px;margin:0;accent-color:#07111f}
.mk-search{width:100%;box-sizing:border-box;min-height:40px;padding:8px 10px 8px 34px;border:0;border-radius:2px;background:rgba(255,255,255,.65);box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#07111f;font-family:'Crimson Text',Georgia,serif;font-size:16px;outline:none}
.mk-search::placeholder{color:#6b6257;opacity:1}
.mk-search:focus{box-shadow:inset 0 0 0 1.5px #07111f}
.mk-row{display:grid;grid-template-columns:42px minmax(0,1fr) 88px 70px 92px 88px;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 10px;box-sizing:border-box;border:0;border-bottom:1px solid rgba(79,154,154,.4);background:transparent;color:#2a2318;font-family:'Crimson Text',Georgia,serif;text-align:left;cursor:pointer;transition:background-color .15s}
.mk-row:hover{background:rgba(239,212,134,.3)}
.mk-row[aria-pressed="true"]{background:rgba(7,17,31,.08);box-shadow:inset 3px 0 0 #9e3f2a}
.mk-row:focus-visible{outline:2px solid #9e3f2a;outline-offset:-2px}
.mk-th{display:grid;grid-template-columns:42px minmax(0,1fr) 88px 70px 92px 88px;gap:12px;padding:0 10px 8px;border-bottom:1.5px solid rgba(182,64,48,.6);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#5b5248}
.mk-tile{display:grid;place-items:center;background:#15110e;box-shadow:inset 0 0 0 1px rgba(239,212,134,.18)}
.mk-num{font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.mk-rar{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em}
.r-common{color:#5f574b}.r-rare{color:#2f6363}.r-epic{color:#4b3a7a}.r-legend{color:#8a6420}
.mk-inv{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-height:118px;padding:10px 8px 0;box-sizing:border-box;border:0;border-radius:2px;background:#15110e;color:#e9dfcc;font-family:'Crimson Text',Georgia,serif;font-size:14px;line-height:1.2;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(239,212,134,.18);transition:box-shadow .15s,transform .15s}
.mk-inv:hover{box-shadow:inset 0 0 0 1.5px #efd486;transform:translateY(-2px)}
.mk-inv[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #efd486,0 0 0 3px rgba(239,212,134,.25)}
.mk-inv:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.mk-field{width:100%;box-sizing:border-box;min-height:46px;padding:8px 4px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);border-radius:0;background:transparent;color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:20px;font-weight:700;outline:none}
.mk-field:focus{border-bottom-color:#07111f;background:rgba(239,212,134,.3)}
.mk-text{width:100%;box-sizing:border-box;min-height:44px;padding:8px 4px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);background:transparent;color:#07111f;font-family:'Crimson Text',Georgia,serif;font-size:17px;outline:none;resize:none}
.mk-text:focus{border-bottom-color:#07111f;background:rgba(239,212,134,.3)}
@keyframes mkPopA{from{clip-path:circle(0% at 50% 20%)}to{clip-path:circle(150% at 50% 20%)}}
@keyframes mkPopB{from{clip-path:circle(0% at 50% 20%)}to{clip-path:circle(150% at 50% 20%)}}
@keyframes mkWipeA{from{clip-path:circle(0% at 8% 0%)}to{clip-path:circle(160% at 8% 0%)}}
@keyframes mkWipeB{from{clip-path:circle(0% at 8% 0%)}to{clip-path:circle(160% at 8% 0%)}}
.pop-a{animation:mkPopA .55s cubic-bezier(.4,0,.2,1) both}
.pop-b{animation:mkPopB .55s cubic-bezier(.4,0,.2,1) both}
.wipe-a{animation:mkWipeA .6s cubic-bezier(.4,0,.2,1) both}
.wipe-b{animation:mkWipeB .6s cubic-bezier(.4,0,.2,1) both}
@media (max-width:1180px){
  .mk-buy{grid-template-columns:minmax(0,1fr) 320px}
  .mk-side{grid-column:1 / -1}
}
@media (max-width:820px){
  .mk-buy{grid-template-columns:minmax(0,1fr)}
  .mk-row,.mk-th{grid-template-columns:42px minmax(0,1fr) 80px}
  .mk-hide-sm{display:none !important}
  .s-nav{order:3;width:100%}
}
@media (prefers-reduced-motion:reduce){
  .s-enter,.s-enter-zoom,.s-rim,.s-lamp,.pop-a,.pop-b,.wipe-a,.wipe-b{animation:none !important}
}
</style>
