<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Hồ sơ thám tử</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:#fbf6ed;text-decoration:none}
.s-brand:hover{color:#fbf6ed}
.s-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.s-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-decoration:none;transition:color .15s}
.s-nav a:hover{color:#efd486}
.s-nav a[aria-current="page"]{color:#efd486}
.s-nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#bf3b2c;box-shadow:0 2px 2px rgba(0,0,0,.6)}
.s-nav a[aria-current="page"]::before{content:"";position:absolute;right:8px;bottom:3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-nav a:focus-visible,.s-brand:focus-visible,.s-topbtn:focus-visible{outline:2px solid #efd486;outline-offset:-3px}
.s-topbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid rgba(239,212,134,.28);border-radius:2px;background:rgba(255,255,255,.02);color:#eee4d2;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s}
.s-topbtn:hover{border-color:#efd486;color:#efd486}
.s-topbtn[aria-current="page"]{position:relative;border-color:#efd486;background:rgba(239,212,134,.1);box-shadow:inset 0 0 0 1px rgba(239,212,134,.3),0 0 18px rgba(239,212,134,.12)}
.s-topbtn[aria-current="page"]::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-link{display:inline-flex;align-items:center;min-height:44px;color:#5b5248;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.s-link:hover{color:#9e3f2a}
.s-link-gold{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#efd486;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(239,212,134,.4);text-underline-offset:4px}
.s-link-gold:hover{color:#fbf6ed;text-decoration-color:#fbf6ed}
.s-link:focus-visible,.s-link-gold:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
@keyframes sFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:6;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
.s-lamp{animation:sFlicker 7s linear infinite}
/* ---- Profile (pf-) ---- */
.pf-grid{display:grid;grid-template-columns:404px minmax(0,1fr);gap:30px 40px;align-items:start}
.pf-col{display:flex;flex-direction:column;gap:32px;min-width:0}
.pf-pair{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:30px;align-items:start}
.pf-card{position:relative;box-sizing:border-box;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55)}
.pf-kick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.pf-kick.gold{color:#efd486}
.pf-h2{margin:2px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;line-height:1.1;color:#07111f}
.pf-h2.light{color:#fbf6ed}
.pf-margin{position:absolute;top:0;bottom:0;left:24px;width:1.5px;background:rgba(182,64,48,.5)}
.pf-mini{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#5b5248;white-space:nowrap}
.pf-go{display:inline-flex;align-items:center;gap:10px;min-height:44px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.18em;color:#9e3f2a;text-decoration:none}
.pf-go:hover{color:#07111f}
.pf-go.gold{color:#efd486}
.pf-go.gold:hover{color:#fbf6ed}
.pf-go svg{transition:transform .15s}
.pf-go:hover svg{transform:translateX(3px)}
.pf-go:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.pf-go.gold:focus-visible{outline-color:#efd486}
.pf-sm-only{display:none}
.pf-alert{display:inline-flex;align-items:center;gap:12px;min-height:44px;padding:8px 16px 8px 14px;box-sizing:border-box;background:#0d1014;box-shadow:inset 3px 0 0 #c4623f,inset 0 0 0 1px rgba(232,165,140,.45),0 12px 26px rgba(0,0,0,.5);color:#fbf6ed;text-decoration:none;transform:rotate(.6deg)}
.pf-alert:hover{color:#fbf6ed;box-shadow:inset 3px 0 0 #c4623f,inset 0 0 0 1px #e8a58c,0 12px 26px rgba(0,0,0,.5)}
.pf-alert:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.pf-alert-k{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.18em;color:#e8a58c}
.pf-alert-t{font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(251,246,237,.4);text-underline-offset:3px}
/* ID dossier */
.pf-id{padding:18px 22px 22px 42px;background:#fbf6ed;transform:rotate(-.6deg)}
.pf-idhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1.5px solid rgba(182,64,48,.55)}
.pf-who{display:flex;align-items:center;gap:16px;margin-top:16px}
.pf-seal{position:relative;flex:none;width:132px;height:132px}
.pf-seal svg{position:absolute;inset:0;width:100%;height:100%}
.pf-mono{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 2px #c7a24b,0 0 0 3px #fbf6ed,0 0 0 4px rgba(26,44,66,.45),0 8px 14px rgba(7,17,31,.28);color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:700;letter-spacing:.02em}
.pf-whotxt{flex:1;min-width:0}
.pf-name{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:27px;font-weight:700;line-height:1.1;color:#07111f}
.pf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.pf-chips .s-chip{min-height:26px;font-size:11px;letter-spacing:.14em}
.pf-fields{margin:16px 0 0;padding:0}
.pf-roles{margin-top:14px}
.pf-rolebar{display:flex;gap:2px;height:9px;margin-top:6px;box-shadow:0 0 0 1px rgba(91,82,72,.25)}
.pf-rolebar span{display:block;height:100%}
.pf-rolelegend{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:15px;color:#2a2318}
.pf-rolelegend span{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.pf-rolelegend i{display:inline-block;width:10px;height:10px;border-radius:50%}
.pf-fields div{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;border-bottom:1px solid rgba(79,154,154,.4)}
.pf-fields div:first-child{border-top:1px solid rgba(79,154,154,.4)}
.pf-fields dt{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#5b5248;text-transform:uppercase}
.pf-fields dd{display:flex;align-items:center;gap:8px;margin:0;font-size:17px;color:#2a2318;text-align:right}
.pf-msm{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:12px;font-weight:700;font-style:normal;letter-spacing:.02em}
.pf-rank{margin-top:20px}
.pf-rankrow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pf-ranktxt{margin:0;font-size:18px;line-height:1.3;color:#2a2318}
.pf-ranktxt strong{font-family:'Playfair Display',Georgia,serif;font-weight:700;color:#9e3f2a}
.pf-track{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.pf-ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:end;margin:16px 0 0;padding:14px 0 0;list-style:none;border-top:1px dashed rgba(91,82,72,.45)}
.pf-ladder li{display:flex;flex-direction:column;min-width:0}
.pf-step{position:relative;display:block;border-radius:1px 1px 0 0;background:rgba(59,51,40,.8)}
.pf-ladder .is-now .pf-step{background:#9e3f2a}
.pf-ladder .is-now .pf-step::after{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.pf-ladder .is-next .pf-step{background:repeating-linear-gradient(135deg,rgba(91,82,72,.16) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.5)}
.pf-stepname{margin-top:6px;font-size:15px;line-height:1.15;color:#2a2318;white-space:nowrap}
.pf-ladder .is-now .pf-stepname{font-weight:600;color:#07111f}
.pf-ladder .is-next .pf-stepname{color:#5b5248}
.pf-stepnum{margin-top:1px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.1em;color:#5b5248}
/* stat tags */
.pf-tags{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin:0;padding:26px 0 0}
.pf-tag{position:relative;display:flex;flex-direction:column;min-width:0;padding:32px 16px 16px;box-sizing:border-box;background:linear-gradient(135deg,transparent 13px,#e9dcc0 13.5px) left top/51% 100% no-repeat,linear-gradient(225deg,transparent 13px,#e9dcc0 13.5px) right top/51% 100% no-repeat;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)) drop-shadow(0 14px 14px rgba(0,0,0,.5));color:#07111f}
.pf-tag:nth-child(even){background:linear-gradient(135deg,transparent 13px,#d9c49a 13.5px) left top/51% 100% no-repeat,linear-gradient(225deg,transparent 13px,#d9c49a 13.5px) right top/51% 100% no-repeat}
.pf-hole{position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#1d1510;box-shadow:0 0 0 3px #c7a24b,0 0 0 4px #5e4a1c,inset 0 2px 2px rgba(0,0,0,.7)}
.pf-twine{position:absolute;z-index:2;top:-26px;left:50%;width:30px;height:44px;margin-left:-15px;overflow:visible}
.pf-tag dt{display:flex;align-items:center;gap:8px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#4f4536;text-transform:uppercase}
.pf-tag dt svg{flex:none;color:#9e3f2a}
.pf-tagnum{margin:8px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:42px;font-weight:700;line-height:1;font-variant-numeric:lining-nums tabular-nums;color:#07111f}
.pf-tagsub{margin:6px 0 0;font-size:15px;font-style:italic;line-height:1.25;color:#3b3328}
/* badges cabinet */
.pf-case{padding:20px 24px 24px;background:#0d1014;color:#eee4d2;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(239,212,134,.16),0 24px 48px rgba(0,0,0,.6)}
.pf-casehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px;margin-bottom:22px}
.pf-count{display:flex;align-items:center;gap:10px}
.pf-dots{display:inline-flex;gap:5px}
.pf-dots span{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.pf-dots span.off{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(179,167,148,.6)}
.pf-badges{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:26px 14px;margin:0;padding:0;list-style:none}
.pf-badge{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding-top:6px;border-radius:2px;text-align:center;outline:none;cursor:default}
.pf-badge::before{content:"";position:absolute;z-index:2;top:0;left:-9px;right:-9px;height:7px;border-radius:2px;background:linear-gradient(180deg,#f6e3a6 0%,#c7a24b 45%,#6d5420 100%);box-shadow:0 3px 5px rgba(0,0,0,.55)}
.pf-badge:focus-visible{outline:2px solid #efd486;outline-offset:6px}
.pf-medal{display:block;flex:none;transform-origin:50% 0;filter:drop-shadow(0 8px 7px rgba(0,0,0,.55))}
.pf-badge:hover .pf-medal,.pf-badge:focus-visible .pf-medal{animation:pfSwing 1.3s cubic-bezier(.25,.7,.3,1) forwards;filter:drop-shadow(0 16px 12px rgba(0,0,0,.6)) brightness(1.1)}
.pf-bname{display:flex;align-items:center;justify-content:center;min-height:2.3em;margin:8px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;line-height:1.15;color:#fbf6ed;transition:color .2s}
.pf-badge:hover .pf-bname,.pf-badge:focus-visible .pf-bname{color:#efd486}
.pf-bstate{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#efd486}
.pf-bdesc{margin:4px 0 0;font-size:15px;line-height:1.3;color:#cfc4b1}
.pf-badge.is-locked .pf-bname,.pf-badge.is-locked .pf-bstate{color:#b3a794}
.pf-badge.is-locked .pf-bdesc{font-style:italic;color:#b3a794}
.pf-badge.is-locked:hover .pf-bname,.pf-badge.is-locked:focus-visible .pf-bname{color:#e9dfcc}
/* ledger */
.pf-ledger{padding:20px 24px 14px 48px;background:#f4efe3}
.pf-lhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.pf-seg{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 14px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#3b3328;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer;transition:background-color .12s,color .12s}
.pf-seg:hover{box-shadow:inset 0 0 0 1.5px #07111f;color:#07111f}
.pf-seg[aria-pressed="true"]{background:#07111f;color:#fbf6ed;box-shadow:inset 0 0 0 1px #07111f}
.pf-seg:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.pf-table{width:100%;border-collapse:collapse}
.pf-table th{padding:10px 10px;border-bottom:1.5px solid rgba(182,64,48,.6);text-align:left;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#5b5248;white-space:nowrap}
.pf-table td{padding:10px 10px;border-bottom:1px solid rgba(79,154,154,.4);vertical-align:middle;font-size:16px;color:#2a2318}
.pf-table tbody tr{transition:background-color .15s}
.pf-table tbody tr:hover{background:rgba(239,212,134,.28)}
.pf-cname{display:block;font-size:17px;font-weight:600;line-height:1.2;color:#07111f}
.pf-csub{display:block;margin-top:1px;font-size:15px;line-height:1.2;color:#5b5248}
.pf-res{display:inline-block;padding:3px 8px;border:3px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;line-height:1.3;white-space:nowrap;transform:rotate(-2deg);mix-blend-mode:multiply}
.pf-res.ok{color:#2f6363}
.pf-res.bad{color:#9e3f2a;transform:rotate(1.5deg)}
.pf-score{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.pf-pts{font-family:'Source Code Pro',ui-monospace,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#07111f}
.pf-grade{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:700;box-shadow:inset 0 0 0 1.5px currentColor}
.g-a{color:#2f6363}.g-b{color:#1a2c42}.g-c{color:#7a3f27}.g-s{color:#8a6420}
.pf-num{font-family:'Source Code Pro',ui-monospace,monospace;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pf-rec{display:inline-block;margin-left:6px;padding:2px 5px;background:#0d1014;color:#efd486;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;vertical-align:1px}
/* inventory tray */
.pf-tray{position:relative;box-sizing:border-box;padding:18px 18px 18px;background:linear-gradient(180deg,#17120e,#0d1014);color:#eee4d2;box-shadow:inset 0 0 0 1px rgba(239,212,134,.18),inset 0 2px 0 rgba(255,255,255,.05),0 24px 48px rgba(0,0,0,.6)}
.pf-trayhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;margin-bottom:12px}
.pf-items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:8px;list-style:none;background:#07090b;box-shadow:inset 0 3px 8px rgba(0,0,0,.85),inset 0 0 0 1px rgba(239,212,134,.08)}
.pf-item{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:132px;padding:22px 8px 0;box-sizing:border-box;overflow:hidden;background:radial-gradient(ellipse at 50% 34%,#2a211b 0%,#15110e 68%);box-shadow:inset 0 0 0 1px rgba(239,212,134,.14);text-align:center}
.pf-item.is-on{box-shadow:inset 0 0 0 1.5px #efd486,0 0 0 1px rgba(239,212,134,.2)}
.pf-item svg{flex:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.6))}
.pf-on{position:absolute;top:0;left:0;padding:3px 7px;background:#efd486;color:#0d1014;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em}
.pf-iname{font-size:15px;line-height:1.2;color:#e9dfcc}
.pf-irar{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em}
.pf-ibar{align-self:stretch;height:4px;margin:6px -8px 0}
/* my cases */
.pf-mine{padding:22px 22px 12px;background:#d9c49a;transform:rotate(.9deg)}
.pf-minetiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 0}
.pf-minetiles div{padding:10px 12px;background:rgba(13,16,20,.92)}
.pf-minetiles dt{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.14em;color:#b3a794;text-transform:uppercase}
.pf-minetiles dd{margin:3px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:26px;font-weight:700;line-height:1.1;color:#efd486;font-variant-numeric:tabular-nums}
/* account */
.pf-acct{padding:20px 22px 22px 42px;background:#fbf6ed;transform:rotate(.5deg)}
.pf-stampbox{position:absolute;z-index:2;top:22px;right:18px;pointer-events:none}
.pf-stamp{display:inline-block;padding:5px 10px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;white-space:nowrap;transform:rotate(-8deg);mix-blend-mode:multiply}
.pf-label{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:#5b5248;text-transform:uppercase}
.pf-hint{display:block;margin-top:1px;font-family:'Crimson Text',Georgia,serif;font-size:15px;font-style:italic;font-weight:400;letter-spacing:0;text-transform:none;color:#5b5248}
.pf-emailval{display:block;margin-top:3px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:17px;font-weight:600;letter-spacing:.04em;color:#07111f}
.pf-okline{display:flex;align-items:center;gap:8px;margin:8px 0 0;font-size:17px;color:#2f6363}
.pf-note{display:flex;align-items:flex-start;gap:10px;margin:0;padding:10px 12px;font-size:16px;line-height:1.35}
.pf-note svg{flex:none;margin-top:1px}
.pf-note.warn{background:rgba(182,107,77,.13);box-shadow:inset 3px 0 0 #7a3f27;color:#3b2418}
.pf-note.ok{background:rgba(79,154,154,.16);box-shadow:inset 3px 0 0 #2f6363;color:#1f4545}
.pf-note.bad{background:rgba(158,63,42,.1);box-shadow:inset 3px 0 0 #9e3f2a;color:#6b2a1c}
.pf-note strong{display:block;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;color:#5c2c18}
.pf-input{width:100%;box-sizing:border-box;min-height:46px;padding:8px 4px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);border-radius:0;background:transparent;color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:17px;letter-spacing:.08em;outline:none;transition:background-color .15s,border-color .15s}
.pf-input:focus{border-bottom-color:#07111f;background:rgba(239,212,134,.3)}
.pf-input[aria-invalid="true"]{border-bottom-color:#9e3f2a;background:rgba(158,63,42,.07)}
.pf-code{max-width:170px;letter-spacing:.4em}
.pf-pwhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:14px;border-top:1px dashed rgba(91,82,72,.45)}
.pf-h3{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.15;color:#07111f}
.pf-eye{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 10px;border:0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px rgba(47,99,99,.35);color:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer;transition:background-color .12s,color .12s}
.pf-eye:hover{color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.pf-eye[aria-pressed="true"]{background:#07111f;color:#fbf6ed;box-shadow:none}
.pf-eye:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.pf-field{margin-top:12px}
.pf-rules{display:flex;flex-wrap:wrap;gap:2px 16px;margin:6px 0 0;padding:0;list-style:none}
.pf-rule{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:#5b5248;transition:color .2s}
.pf-rule .ic-ok{display:none}
.pf-rule.is-ok{color:#2f6363}
.pf-rule.is-ok .ic-ok{display:inline}
.pf-rule.is-ok .ic-no{display:none}
.pf-up{text-transform:uppercase}
.pf-okmsg{align-items:center;justify-content:space-between}
/* motion */
@keyframes pfDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes pfPop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
@keyframes pfSwing{0%{transform:none}14%{transform:translateY(-4px) rotate(6deg)}32%{transform:translateY(-4px) rotate(-4.5deg)}52%{transform:translateY(-4px) rotate(2.6deg)}72%{transform:translateY(-4px) rotate(-1.2deg)}100%{transform:translateY(-4px) rotate(0deg)}}
@keyframes pfStampA{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes pfStampB{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes pfWipeA{from{clip-path:circle(0% at 0% 0%)}to{clip-path:circle(150% at 0% 0%)}}
@keyframes pfWipeB{from{clip-path:circle(0% at 0% 0%)}to{clip-path:circle(150% at 0% 0%)}}
@keyframes pfShakeA{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pfShakeB{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.pf-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:pfDraw 1s 1.1s cubic-bezier(.5,0,.3,1) both}
.pf-pop{transform-box:fill-box;transform-origin:50% 50%;animation:pfPop .35s 2s cubic-bezier(.2,.8,.2,1) both}
.pf-st0 .pf-stamp{animation:pfStampA .45s 1.3s cubic-bezier(.2,.8,.2,1) both}
.pf-sta .pf-stamp{animation:pfStampA .45s cubic-bezier(.2,.8,.2,1) both}
.pf-stb .pf-stamp{animation:pfStampB .45s cubic-bezier(.2,.8,.2,1) both}
.pf-wa{animation:pfWipeA .55s cubic-bezier(.4,0,.2,1) both}
.pf-wb{animation:pfWipeB .55s cubic-bezier(.4,0,.2,1) both}
.pf-reveal{animation:pfWipeA .5s cubic-bezier(.4,0,.2,1) both}
.pf-pa .pf-note.bad{animation:pfShakeA .4s ease-out both}
.pf-pb .pf-note.bad{animation:pfShakeB .4s ease-out both}
.pf-pa .pf-stamp{animation:pfStampA .45s .05s cubic-bezier(.2,.8,.2,1) both}
.pf-pb .pf-stamp{animation:pfStampB .45s .05s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:1180px){
  .pf-grid{grid-template-columns:372px minmax(0,1fr);gap:30px 32px}
  .pf-case{padding:20px 18px 22px}
  .pf-badges{gap:24px 10px}
  .pf-medal{width:72px;height:93px}
  .pf-bname{font-size:15px}
  .pf-pair{grid-template-columns:minmax(0,1fr) 270px}
  .pf-hide-md{display:none}
}
@media (max-width:960px){
  .pf-grid{display:flex;flex-direction:column;align-items:stretch;gap:32px}
  .pf-col{display:contents}
  .pf-o1{order:1}.pf-o2{order:2}.pf-o3{order:3}.pf-o4{order:4}.pf-o5{order:5}.pf-o6{order:6}
  .pf-pair{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
@media (max-width:760px){
  .s-nav{order:3;width:100%}
  .pf-tags{grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 14px}
  .pf-badges{grid-template-columns:repeat(2,minmax(0,1fr));gap:30px 18px}
  .pf-medal{width:84px;height:108px}
  .pf-bname{font-size:17px}
  .pf-pair{grid-template-columns:minmax(0,1fr)}
  .pf-items{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pf-hide-sm{display:none}
  .pf-sm-only{display:inline}
  .pf-ressm{display:block;margin-top:7px}
  .pf-name{font-size:23px}
  .pf-who{gap:12px}
  .pf-ledger{padding:18px 14px 12px 40px}
  .pf-table th,.pf-table td{padding:10px 6px}
  .pf-tagnum{font-size:36px}
  .pf-stampbox{top:50px;right:12px}
}
@media (prefers-reduced-motion:reduce){
  .s-enter,.s-enter-zoom,.s-rim,.s-lamp,.pf-draw,.pf-pop,.pf-stamp,.pf-medal,.pf-wa,.pf-wb,.pf-reveal,.pf-note{animation:none !important}
  .pf-badge:hover .pf-medal,.pf-badge:focus-visible .pf-medal{transform:translateY(-4px)}
  .pf-go svg,.pf-bname,.pf-rule,.pf-input,.pf-table tbody tr{transition:none}
}
