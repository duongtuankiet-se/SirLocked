<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Hiện trường</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#0b0806}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
/* ---- in-game frame (g-) ---- */
.g-stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%);transition:transform .55s cubic-bezier(.4,0,.2,1)}
.g-stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.g-glass{background:rgba(10,12,15,.9);box-shadow:inset 0 0 0 1px rgba(239,212,134,.22),0 14px 30px rgba(0,0,0,.55)}
.g-kick{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.2em;color:#efd486}
.g-mute{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.16em;color:#b3a794}
.g-mono{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:999px;background:#1a2c42;box-shadow:inset 0 0 0 1px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700}
.g-mono.rust{background:#3a1d12;box-shadow:inset 0 0 0 1px #c98a63;color:#f2c9a9}
.g-dot{width:8px;height:8px;border-radius:999px;background:#5fb3a8;box-shadow:0 0 0 2px rgba(95,179,168,.25)}
.g-tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:70px;min-height:64px;padding:8px 12px 6px;white-space:nowrap;box-sizing:border-box;border:0;border-radius:2px;background:transparent;color:#e9dfcc;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1.15;text-align:center;text-decoration:none;cursor:pointer;transition:background-color .15s,color .15s}
.g-tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.g-tool:hover:not(:disabled):not([aria-disabled="true"]){background:rgba(239,212,134,.1);color:#efd486}
.g-tool[aria-pressed="true"],.g-tool[aria-expanded="true"]{background:#efd486 !important;color:#07111f !important}
.g-tool:disabled,.g-tool[aria-disabled="true"]{cursor:not-allowed;color:#8f8577}
.g-tool:focus-visible{outline:2px solid #efd486;outline-offset:-2px}
.g-key{position:absolute;top:5px;right:7px;min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:2px;box-shadow:inset 0 0 0 1px currentColor;font-size:10px;line-height:15px;opacity:.75}
.g-sep{width:1px;align-self:stretch;margin:8px 4px;background:rgba(239,212,134,.22)}
.g-spot{position:absolute;z-index:2;display:grid;place-items:center;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
.g-spot::before{content:"";position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 2px #efd486,0 0 12px rgba(239,212,134,.7),inset 0 0 8px rgba(239,212,134,.45)}
.g-spot::after{content:"";position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 2px rgba(239,212,134,.8);animation:gPing 2.2s ease-out infinite}
.g-spot:focus-visible{outline:2px solid #fbf6ed;outline-offset:2px}
.g-tag{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);width:max-content;max-width:282px;padding:6px 10px 7px;white-space:nowrap;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(239,212,134,.4),0 10px 22px rgba(0,0,0,.5);color:#fbf6ed;font-family:'Crimson Text',Georgia,serif;font-size:16px;font-style:normal;font-weight:400;letter-spacing:0;line-height:1.15;text-align:left;pointer-events:none;opacity:0;transition:opacity .15s}
.g-tag b{display:block;margin-bottom:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.18em;color:#efd486}
.g-tag i{display:block;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(239,212,134,.28);white-space:normal;text-wrap:pretty;font-size:15px;line-height:1.25;color:#d9cdb8}
.g-tag i:empty{display:none}
.g-tag.is-start{left:-4px;transform:none}
.g-spot:hover .g-tag,.g-spot:focus-visible .g-tag,.g-spot.is-hot .g-tag{opacity:1}
@keyframes gPing{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(1.9);opacity:0}}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:20;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
/* ---- Hiện trường (ht-) ---- */
.ht-main [hidden]{display:none !important}
.ht-main:focus{outline:none}
.ht-ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ht-up{text-transform:uppercase}
.ht-main .s-btn-sm{min-height:44px}
.ht-main kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:2px;background:rgba(239,212,134,.1);box-shadow:inset 0 0 0 1px rgba(239,212,134,.55),0 2px 0 rgba(0,0,0,.45);color:#fbf6ed;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.04em;line-height:1}
/* hotspot states */
.g-spot.is-done::before{box-shadow:0 0 0 1.5px rgba(239,212,134,.5),inset 0 0 0 1px rgba(13,16,20,.35)}
.g-spot.is-done::after{content:none}
.g-spot.is-partner::before{box-shadow:none;border:1.5px dashed rgba(226,168,128,.85)}
.g-spot.is-partner::after{content:none}
.g-spot.is-hot::before{box-shadow:0 0 0 2px #fbf6ed,0 0 14px rgba(239,212,134,.85),inset 0 0 8px rgba(239,212,134,.45)}
.g-spot.is-done.is-hot::before{box-shadow:0 0 0 2px rgba(251,246,237,.8)}
.g-spot.is-partner.is-hot::before{border-color:#f2c9a9}
.ht-badge{position:absolute;z-index:1;top:3px;right:3px;display:none;place-items:center;width:14px;height:14px;border-radius:999px;background:#0d1014;box-shadow:0 0 0 1px rgba(143,208,196,.75);color:#8fd0c4}
.ht-badge svg{width:9px;height:9px;stroke-width:3}
.g-spot.is-done .ht-badge{display:grid}
/* use-mode: every scene object becomes a target */
.ht-main.is-using .g-spot::before{box-shadow:0 0 0 2px #efd486,0 0 12px rgba(239,212,134,.7);border:0}
.ht-main.is-using .g-spot::after{content:"";animation:gPing 1.6s ease-out infinite}
.ht-main.is-using .ht-wit .ht-bub,.ht-main.is-using .ht-wit .ht-bub::after{border-color:#efd486}
.g-stage.is-using,.g-stage.is-using .g-spot,.g-stage.is-using .ht-wit,.g-stage.is-using .ht-exit{cursor:copy}
/* witness markers */
.ht-wit{position:absolute;z-index:2;width:64px;height:62px;margin:-62px 0 0 -32px;padding:0;border:0;border-radius:12px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.ht-wit:focus-visible{outline:2px solid #fbf6ed;outline-offset:3px}
.ht-bub{position:absolute;left:50%;top:0;display:flex;align-items:center;gap:6px;padding:4px;box-sizing:border-box;border:1.5px solid #efd486;border-radius:14px;background:#0d1014;box-shadow:0 8px 16px rgba(0,0,0,.55);transform:translateX(-50%);transition:border-color .15s,transform .15s}
.ht-bub::after{content:"";position:absolute;left:50%;bottom:-7px;width:11px;height:11px;margin-left:-6px;box-sizing:border-box;border-right:1.5px solid #efd486;border-bottom:1.5px solid #efd486;background:#0d1014;transform:rotate(45deg)}
.ht-bub .g-mono{width:36px;height:36px;font-size:15px}
.ht-stem{position:absolute;left:50%;top:50px;width:0;height:12px;border-left:1.5px dotted rgba(239,212,134,.7)}
.ht-floor{position:absolute;left:50%;top:62px;width:40px;height:13px;margin:-6.5px 0 0 -20px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(239,212,134,.85),0 0 10px rgba(239,212,134,.4)}
.ht-floor::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1.5px rgba(239,212,134,.8);animation:htFloor 2.2s ease-out infinite}
.ht-wname{position:absolute;left:50%;top:calc(100% + 13px);display:flex;flex-direction:column;align-items:center;padding:4px 9px 5px;background:rgba(13,16,20,.88);box-shadow:inset 0 0 0 1px rgba(239,212,134,.28);color:#fbf6ed;font-size:16px;line-height:1.1;white-space:nowrap;transform:translateX(-50%)}
.ht-wname small{margin-top:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#b3a794}
.ht-wname em{display:none;margin-top:3px;font-size:15px;color:#f2c9a9}
.ht-dots{display:none;align-items:center;gap:4px;padding:0 6px 0 0}
.ht-dots i{width:5px;height:5px;border-radius:999px;background:#f2c9a9;animation:htDot 1.2s ease-in-out infinite}
.ht-dots i:nth-child(2){animation-delay:.18s}
.ht-dots i:nth-child(3){animation-delay:.36s}
.ht-wit .g-tag{bottom:calc(100% + 10px)}
.ht-wit:hover .g-tag,.ht-wit:focus-visible .g-tag,.ht-wit.is-hot .g-tag{opacity:1}
.ht-wit:hover .ht-bub,.ht-wit.is-hot .ht-bub{transform:translateX(-50%) translateY(-2px)}
.ht-wit.is-partner .ht-bub,.ht-wit.is-partner .ht-bub::after{border-color:#c98a63}
.ht-wit.is-partner .ht-stem{border-left-color:rgba(226,168,128,.7)}
.ht-wit.is-partner .ht-floor{box-shadow:none;border:1.5px dashed rgba(226,168,128,.8)}
.ht-wit.is-partner .ht-floor::after{content:none}
.ht-wit.is-talk .ht-dots{display:flex}
.ht-wit.is-talk .ht-wname em{display:block}
.ht-wit.is-hot .ht-bub,.ht-wit.is-hot .ht-bub::after{border-color:#fbf6ed}
/* exit marker */
.ht-exit{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:6px;width:112px;margin:-22px 0 0 -56px;padding:0;border:0;border-radius:4px;background:transparent;color:#efd486;font:inherit;cursor:pointer}
.ht-exit:focus-visible{outline:2px solid #fbf6ed;outline-offset:3px}
.ht-exit-ic{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:999px;background:rgba(13,16,20,.84);box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.75),0 6px 14px rgba(0,0,0,.5);transition:background-color .15s}
.ht-exit-ic svg{width:22px;height:22px}
.ht-exit-lock{position:absolute;right:-5px;bottom:-3px;display:grid;place-items:center;width:19px;height:19px;border-radius:999px;background:#3a1d12;box-shadow:0 0 0 1.5px #c98a63;color:#f2c9a9}
.ht-exit-lock svg{width:11px;height:11px;stroke-width:2.2}
.ht-exit-lbl{padding:3px 7px 4px;background:rgba(13,16,20,.84);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;line-height:1.35;text-align:center;color:#efd486}
.ht-exit:hover .ht-exit-ic,.ht-exit.is-hot .ht-exit-ic{background:#1d1a14}
.ht-exit:hover .g-tag,.ht-exit:focus-visible .g-tag,.ht-exit.is-hot .g-tag{opacity:1}
/* exit unlocked: the lock badge pops off, the door ring starts pulsing */
.ht-exit.is-open .ht-exit-ic{box-shadow:inset 0 0 0 2px #efd486,0 0 16px rgba(239,212,134,.5),0 6px 14px rgba(0,0,0,.5)}
.ht-exit.is-open .ht-exit-ic::after{content:"";position:absolute;inset:0;border-radius:999px;box-shadow:0 0 0 2px rgba(239,212,134,.8);animation:gPing 2.2s ease-out infinite}
.ht-exit.is-open:not(.is-unlock) .ht-exit-lock{display:none}
.ht-exit.is-unlock .ht-exit-lock{animation:htLockOff .75s cubic-bezier(.3,0,.6,1) both}
.ht-exit.is-unlock .ht-exit-ic::before{content:"";position:absolute;inset:0;border-radius:999px;box-shadow:0 0 0 3px #fbf6ed,0 0 18px rgba(239,212,134,.9);animation:htBurst .7s ease-out both}
/* phone: pan the cropped stage */
.ht-pan{position:absolute;z-index:4;top:40%;display:none;align-items:center;justify-content:center;width:44px;height:64px;margin-top:-32px;padding:0;border:0;background:rgba(10,12,15,.86);box-shadow:inset 0 0 0 1px rgba(239,212,134,.35),0 10px 22px rgba(0,0,0,.5);color:#efd486;cursor:pointer}
.ht-pan svg{width:22px;height:22px;stroke-width:2.2}
.ht-pan.l{left:0;border-radius:0 4px 4px 0}
.ht-pan.r{right:0;border-radius:4px 0 0 4px}
.ht-pan:focus-visible{outline:2px solid #fbf6ed;outline-offset:-4px}
/* counter prop (pixel sprite on the image grid) */
.ht-props{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* team rows */
.ht-row{display:flex;align-items:center;gap:10px}
.ht-row-txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.ht-row-txt b{font-size:16px;font-weight:600;color:#fbf6ed}
.ht-row-txt i{font-size:15px;color:#b3a794}
/* partner ping */
.ht-ping{position:absolute;z-index:6;top:152px;right:20px;display:flex;align-items:center;gap:10px;width:344px;box-sizing:border-box;padding:10px 6px 10px 12px;border-left:3px solid #c98a63;animation:htSlide .5s 1.15s cubic-bezier(.2,.8,.2,1) both}
.ht-ping-txt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.ht-ping-txt span:last-child{font-size:17px;line-height:1.15;color:#fbf6ed}
.ht-x{display:grid;place-items:center;flex:none;width:44px;height:44px;padding:0;border:0;border-radius:2px;background:transparent;color:#b3a794;cursor:pointer;transition:color .15s,background-color .15s}
.ht-x svg{width:18px;height:18px}
.ht-x:hover{color:#efd486;background:rgba(239,212,134,.1)}
.ht-x:focus-visible{outline:2px solid #efd486;outline-offset:-2px}
.ht-x.ink{color:#5b5248}
.ht-x.ink:hover{color:#07111f;background:rgba(7,17,31,.07)}
.ht-x.ink:focus-visible{outline-color:#07111f}
/* system toast */
.ht-toastwrap{position:absolute;z-index:7;top:72px;left:50%;width:0;height:0}
.ht-toast{position:absolute;top:0;left:0;display:flex;align-items:center;gap:10px;width:max-content;max-width:min(540px,calc(100vw - 40px));box-sizing:border-box;padding:10px 16px 10px 12px;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(239,212,134,.35),inset 0 2px 0 #c7a24b,0 16px 32px rgba(0,0,0,.6);color:#fbf6ed;font-size:17px;line-height:1.25;transform:translateX(-50%)}
.ht-toast svg{flex:none;width:20px;height:20px;color:#efd486}
.ht-toast.anim-a{animation:htToastA .38s cubic-bezier(.2,.8,.2,1) both}
.ht-toast.anim-b{animation:htToastB .38s cubic-bezier(.2,.8,.2,1) both}
/* tray anchors, popovers */
.g-hintbar{transition:opacity .15s}
.ht-main:has(.ht-pop) .g-hintbar,.ht-main:has(.ht-called) .g-hintbar,.ht-main:has(.g-tool.is-locked:hover) .g-hintbar,.ht-main:has(.g-tool.is-locked:focus-visible) .g-hintbar,.ht-main:has(.g-tool.is-tip) .g-hintbar{opacity:0}
.ht-anchor{position:relative;display:flex}
.ht-pop{position:absolute;z-index:8;bottom:calc(100% + 12px);left:0;width:290px;box-sizing:border-box;padding:12px 14px 12px;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(239,212,134,.35),inset 0 2px 0 #c7a24b,0 18px 36px rgba(0,0,0,.65);color:#eee4d2;transform-origin:20% 100%;animation:htPop .22s cubic-bezier(.2,.8,.2,1) both}
.ht-pop.is-end{left:auto;right:0;transform-origin:85% 100%}
.ht-pop::after{content:"";position:absolute;top:100%;left:30px;border:7px solid transparent;border-top-color:#0d1014}
.ht-pop.is-end::after{left:auto;right:42px}
.ht-pop ul{display:flex;flex-direction:column;gap:2px;margin:8px 0 0;padding:0;list-style:none}
.ht-pop li{display:flex}
.ht-prow{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 8px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;color:#efd486;font:inherit;text-align:left;cursor:pointer;transition:background-color .12s,color .12s}
.ht-prow svg{flex:none;width:18px;height:18px}
.ht-prow .ht-pn{flex:1;font-size:17px;line-height:1.15;color:#fbf6ed}
.ht-st{flex:none;padding:3px 6px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.ht-prow:disabled{cursor:default}
.ht-prow.is-here{background:rgba(239,212,134,.1)}
.ht-prow.is-here .ht-st{background:#efd486;color:#07111f}
.ht-prow.is-locked{color:#b3a794}
.ht-prow.is-locked .ht-pn{color:#cfc4b1}
.ht-prow.is-locked .ht-st{box-shadow:inset 0 0 0 1px rgba(179,167,148,.55);color:#cfc4b1}
.ht-prow.is-open .ht-st{background:#2f6363;color:#fbf6ed}
.ht-prow.is-done{color:#8fd0c4}
.ht-prow.is-done .ht-st{box-shadow:inset 0 0 0 1px rgba(143,208,196,.6);color:#8fd0c4}
.ht-prow:not(:disabled):hover,.ht-prow:not(:disabled):focus-visible{background:#efd486;color:#07111f;outline:none}
.ht-prow:not(:disabled):hover .ht-pn,.ht-prow:not(:disabled):focus-visible .ht-pn{color:#07111f}
.ht-prow:not(:disabled):hover .ht-st,.ht-prow:not(:disabled):focus-visible .ht-st{background:#07111f;color:#efd486;box-shadow:none}
.ht-pop-note{margin:8px 2px 0;padding-top:8px;border-top:1px dashed rgba(239,212,134,.22);font-size:15px;font-style:italic;line-height:1.3;color:#cfc4b1}
.ht-menu{width:250px}
.ht-mi{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 10px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;color:#fbf6ed;font-family:'Crimson Text',Georgia,serif;font-size:18px;text-align:left;cursor:pointer;transition:background-color .12s,color .12s}
.ht-mi svg{flex:none;width:20px;height:20px;color:#efd486}
.ht-mi:hover,.ht-mi:focus-visible{background:#efd486;color:#07111f;outline:none}
.ht-mi:hover svg,.ht-mi:focus-visible svg{color:#07111f}
.ht-calledwrap{position:absolute;right:0;bottom:calc(100% + 12px);width:0;height:0}
.ht-called{position:absolute;right:0;bottom:0;display:flex;align-items:center;gap:8px;padding:8px 12px;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(95,179,168,.5),0 14px 28px rgba(0,0,0,.6);color:#fbf6ed;font-size:16px;white-space:nowrap}
.ht-called svg{width:18px;height:18px;color:#8fd0c4}
.ht-called.anim-a{animation:htPopA .3s cubic-bezier(.2,.8,.2,1) both}
.ht-called.anim-b{animation:htPopB .3s cubic-bezier(.2,.8,.2,1) both}
/* locked tools (Thẩm vấn viên) + new-item dot on the bag */
.ht-lock{position:absolute;top:4px;right:6px;display:none;place-items:center;width:17px;height:17px;border-radius:999px;background:#3a1d12;box-shadow:0 0 0 1px #c98a63;color:#f2c9a9}
.g-tool .ht-lock svg{width:10px;height:10px;stroke-width:2.4}
.ht-tip{position:absolute;z-index:9;left:50%;bottom:calc(100% + 12px);display:none;width:230px;padding:8px 11px 9px;box-sizing:border-box;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(201,138,99,.6),0 14px 28px rgba(0,0,0,.6);color:#fbf6ed;font-family:'Crimson Text',Georgia,serif;font-size:15px;font-weight:400;letter-spacing:0;line-height:1.3;text-align:left;white-space:normal;transform:translateX(-50%);pointer-events:none}
.ht-tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#0d1014}
.g-tool.is-locked .ht-lock{display:grid}
.g-tool.is-locked .g-key{display:none}
.g-tool.is-locked:hover .ht-tip,.g-tool.is-locked:focus-visible .ht-tip,.g-tool.is-tip .ht-tip{display:block}
.g-tool.is-locked > svg{opacity:.7}
.g-tool.has-new::after{content:"";position:absolute;top:8px;left:calc(50% + 8px);width:9px;height:9px;border-radius:999px;background:#5fb3a8;box-shadow:0 0 0 2px #0d1014}
/* the satchel lands back in its button: small thud */
.g-tool.thud-a > svg{animation:htThudA .36s cubic-bezier(.3,1.5,.5,1)}
.g-tool.thud-b > svg{animation:htThudB .36s cubic-bezier(.3,1.5,.5,1)}
/* camera: veil + aimable capture frame */
.g-stage.is-cam{cursor:crosshair;touch-action:none}
.ht-veil{position:absolute;inset:0;z-index:3;background:rgba(196,193,188,.13);pointer-events:none;animation:htFade .3s ease-out both}
.ht-cf{position:absolute;z-index:4;box-sizing:border-box;border:1.5px solid rgba(239,212,134,.9);box-shadow:0 0 0 300vmax rgba(9,9,11,.44),inset 0 0 0 1px rgba(0,0,0,.3);pointer-events:none;transition:left .07s linear,top .07s linear}
.ht-cf-lbl{position:absolute;left:-1.5px;bottom:calc(100% + 7px);padding:3px 7px;background:rgba(13,16,20,.9);box-shadow:inset 0 0 0 1px rgba(239,212,134,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#efd486;white-space:nowrap}
.ht-cf.is-top .ht-cf-lbl{bottom:auto;top:7px;left:7px}
.ht-cb{position:absolute;width:22px;height:22px;border:0 solid #efd486;filter:drop-shadow(0 1px 1px rgba(0,0,0,.65))}
.ht-cb.tl{top:-6px;left:-6px;border-top-width:4px;border-left-width:4px}
.ht-cb.tr{top:-6px;right:-6px;border-top-width:4px;border-right-width:4px}
.ht-cb.bl{bottom:-6px;left:-6px;border-bottom-width:4px;border-left-width:4px}
.ht-cb.br{bottom:-6px;right:-6px;border-bottom-width:4px;border-right-width:4px}
.ht-cf-dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:999px;background:#efd486;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.ht-flash{position:absolute;z-index:9;inset:0;background:#fffaf0;pointer-events:none;animation:htFlash .55s ease-out both}
/* camera open: 6-blade aperture blinks shut and open, letterbox bars slide in, brackets fly in from the
   screen corners and lock onto the frame with a small focus breathe; close plays it back quickly */
.ht-camfx{position:absolute;z-index:3;inset:0;overflow:hidden;pointer-events:none}
.ht-lb{position:absolute;left:0;right:0;height:max(36px,7vh);background:#050403}
.ht-lb.t{top:0;transform-origin:50% 0;box-shadow:inset 0 -1px 0 rgba(239,212,134,.28)}
.ht-lb.b{bottom:0;transform-origin:50% 100%;box-shadow:inset 0 1px 0 rgba(239,212,134,.28)}
.ht-ap{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%)}
.ht-bl{transform:translateY(160px)}
.ht-bl path{fill:url(#ht-blg);stroke:#4a3e31;stroke-width:.5}
.ht-bl path.e{fill:none;stroke:#b08a3c;stroke-width:.8;opacity:.75}
.ht-main.cam-in .ht-bl{animation:htApIn .54s cubic-bezier(.5,0,.3,1) both}
.ht-main.cam-out .ht-bl{animation:htApOut .32s cubic-bezier(.5,0,.3,1) both}
.ht-main.cam-in .ht-lb{animation:htLbIn .4s cubic-bezier(.2,.8,.2,1) .2s both}
.ht-main.cam-out .ht-lb{animation:htLbOut .2s ease-in both}
.ht-main.cam-in .ht-veil{animation:htFade .3s ease-out .24s both}
.ht-main.cam-out .ht-veil{animation:htFadeOut .2s ease-in both}
.ht-main.cam-in .ht-cf{animation:htCfIn 1.1s ease-out both}
.ht-main.cam-out .ht-cf{animation:htCfOut .2s ease-in both}
.ht-main.cam-in .ht-cf-lbl,.ht-main.cam-in .ht-cf-dot{animation:htFade .25s ease-out .62s both}
.ht-main.cam-out .ht-cf-lbl,.ht-main.cam-out .ht-cf-dot{animation:htFadeOut .12s ease-in both}
.ht-main.cam-in .ht-cb{animation:.5s cubic-bezier(.15,.85,.3,1) .22s both}
.ht-main.cam-in .ht-cb.tl{animation-name:htCbTL}
.ht-main.cam-in .ht-cb.tr{animation-name:htCbTR}
.ht-main.cam-in .ht-cb.bl{animation-name:htCbBL}
.ht-main.cam-in .ht-cb.br{animation-name:htCbBR}
.ht-main.cam-out .ht-cb{animation:.22s cubic-bezier(.55,0,.9,.4) both}
.ht-main.cam-out .ht-cb.tl{animation-name:htCbTLo}
.ht-main.cam-out .ht-cb.tr{animation-name:htCbTRo}
.ht-main.cam-out .ht-cb.bl{animation-name:htCbBLo}
.ht-main.cam-out .ht-cb.br{animation-name:htCbBRo}
.ht-main.cam-in .ht-modebar{animation-delay:.3s}
.ht-main.cam-out .ht-modewrap{animation:htBarOut .2s ease-in both}
/* slim mode bars above the tool tray (camera, using an item) */
.ht-modewrap{position:absolute;z-index:5;left:50%;bottom:92px;width:max-content;max-width:calc(100% - 40px);transform:translateX(-50%)}
.ht-modebar{position:relative;z-index:1;display:flex;align-items:center;gap:14px;min-height:56px;padding:6px 8px 6px 10px;box-sizing:border-box;border-top:2px solid #c7a24b;animation:htBar .3s cubic-bezier(.2,.8,.2,1) both}
.ht-mb-ic{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:999px;background:#efd486;color:#07111f}
.ht-mb-ic svg{width:20px;height:20px}
.ht-mb-item{display:grid;place-items:center;flex:none;width:44px;height:44px;background:#15110e;box-shadow:inset 0 0 0 1px rgba(239,212,134,.45)}
.ht-mb-item svg{width:36px;height:36px}
.ht-mb-txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.ht-mb-main{font-size:17px;line-height:1.15;color:#fbf6ed}
.ht-mb-main b{font-weight:600;color:#efd486}
.ht-mb-help{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.04em;color:#e2d8c6}
.ht-coarse{display:none}
.ht-mb-sep{flex:none;width:1px;align-self:stretch;margin:4px 0;background:rgba(239,212,134,.22)}
.ht-mb-count{display:flex;flex-direction:column;gap:3px}
.ht-mb-nums{display:flex;gap:14px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b3a794}
.ht-mb-nums span{display:inline-flex;align-items:baseline;gap:6px}
.ht-mb-nums b{font-size:16px;letter-spacing:0;color:#fbf6ed;font-variant-numeric:tabular-nums}
.ht-mb-nums .is-miss b{color:#f0a48f}
.ht-mb-note{font-size:15px;font-style:italic;line-height:1.1;color:#cfc4b1}
.ht-mb-act{display:flex;align-items:center;gap:8px;margin-left:4px}
.ht-shut{display:grid;place-items:center;flex:none;width:46px;height:46px;padding:0;border:0;border-radius:999px;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 48%,#5e4a1c 100%);box-shadow:0 3px 0 #3a2e12,0 8px 16px rgba(0,0,0,.5);cursor:pointer;transition:transform .1s,box-shadow .1s}
.ht-shut span{width:30px;height:30px;border-radius:999px;background:radial-gradient(circle at 38% 32%,#d2604a 0%,#9e3f2a 50%,#6b2a1c 100%);box-shadow:inset 0 0 0 2px rgba(13,16,20,.55)}
.ht-shut:hover:not(:disabled) span{background:radial-gradient(circle at 38% 32%,#e07058 0%,#b2472f 50%,#6b2a1c 100%)}
.ht-shut:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #3a2e12,0 4px 10px rgba(0,0,0,.5)}
.ht-shut:focus-visible{outline:2px solid #fbf6ed;outline-offset:3px}
.ht-shut:disabled{cursor:default;filter:saturate(.35) brightness(.8)}
/* the print slides up from behind the camera bar and shows the framed crop */
.ht-print{position:absolute;z-index:0;left:14px;bottom:calc(100% - 18px);width:168px;padding:8px 8px 0;box-sizing:border-box;background:#fffdf7;box-shadow:0 2px 0 rgba(0,0,0,.25),0 18px 36px rgba(0,0,0,.6);transform:rotate(-4deg);transform-origin:50% 100%}
.ht-print svg{display:block;width:152px;height:118px;background:#0b0806}
.ht-print.is-near svg{filter:blur(2.4px) saturate(.75)}
.ht-print-cap{display:block;padding:6px 2px 24px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#3b3328;text-align:center}
.ht-print-stamp{position:absolute;right:10px;top:78px;padding:3px 7px;border:3px double currentColor;background:rgba(255,253,247,.9);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;transform:rotate(-9deg)}
.ht-print.is-near .ht-print-stamp{color:#9a4b2f}
.ht-print.is-miss .ht-print-stamp{color:#9e3f2a}
.ht-print.anim-a{animation:htPrintA .6s cubic-bezier(.2,.8,.2,1) both}
.ht-print.anim-b{animation:htPrintB .6s cubic-bezier(.2,.8,.2,1) both}
.ht-print.is-out{animation:htPrintOut .45s ease-in both}
/* item held while choosing a target */
.ht-held{position:absolute;z-index:5;display:flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;background:rgba(13,16,20,.92);box-shadow:inset 0 0 0 1px rgba(239,212,134,.5),0 8px 18px rgba(0,0,0,.5);color:#fbf6ed;font-size:15px;white-space:nowrap;pointer-events:none;transform:translate(16px,14px);animation:htHeldIn .34s cubic-bezier(.3,1.45,.5,1) both}
.ht-held svg{width:32px;height:32px}
/* Túi đồ: leather evidence satchel with brass trim. It rises out of its tool button, the flap swings open,
   the brass studs catch the light and the items drop into their slots; closing plays it back into the button */
.ht-bag{position:absolute;z-index:6;left:50%;bottom:92px;width:min(584px,calc(100% - 40px));box-sizing:border-box;padding:14px 18px 16px;color:#eee4d2;transform:translateX(-50%);transform-origin:calc(50% - 188px) calc(100% + 40px);perspective:900px;animation:htBagIn .45s cubic-bezier(.22,.8,.3,1) both}
.ht-bag.is-closing{pointer-events:none;animation:htBagOut .3s cubic-bezier(.5,0,.8,.3) both}
.ht-bag.is-closing.is-lift{animation-duration:.4s}
.ht-bag.is-closing.is-lift .ht-flap{animation-delay:.1s}
.ht-bag-face{position:absolute;z-index:-1;inset:0;overflow:hidden;background:radial-gradient(rgba(255,232,190,.045) 1px,transparent 1.4px) 0 0/4px 4px,linear-gradient(180deg,#30211a 0%,#23170f 58%,#1b120b 100%);box-shadow:inset 0 3px 0 #c7a24b,inset 0 4px 0 rgba(94,74,28,.9),inset 0 0 0 1px rgba(239,212,134,.2),0 26px 50px rgba(0,0,0,.66)}
.ht-bag-face::before{content:"";position:absolute;inset:10px 8px 8px;border:1px dashed rgba(214,170,98,.32)}
.ht-bag-face::after{content:"";position:absolute;left:0;top:0;width:34%;height:4px;background:linear-gradient(90deg,rgba(255,248,222,0),rgba(255,248,222,.95),rgba(255,248,222,0));opacity:0;animation:htShine .55s ease-out .2s both}
.ht-flap{position:absolute;z-index:3;left:-3px;right:-3px;top:-1px;height:60%;border-radius:0 0 36px 36px/0 0 26px 26px;background:radial-gradient(rgba(255,232,190,.05) 1px,transparent 1.4px) 0 0/4px 4px,linear-gradient(180deg,#46301f 0%,#33221a 55%,#271910 100%);box-shadow:inset 0 3px 0 #c7a24b,inset 0 4px 0 rgba(94,74,28,.9),inset 0 0 0 1px rgba(239,212,134,.24),inset 0 -12px 18px rgba(0,0,0,.35),0 14px 22px rgba(0,0,0,.5);transform-origin:50% 0;pointer-events:none;opacity:0;animation:htFlap .45s cubic-bezier(.45,0,.25,1) both}
.ht-flap::before{content:"";position:absolute;inset:10px 11px 9px;border:1px dashed rgba(214,170,98,.4);border-radius:0 0 30px 30px/0 0 20px 20px}
.ht-flap i{position:absolute;left:50%;bottom:10px;width:46px;height:28px;margin-left:-23px;border-radius:4px;background:linear-gradient(180deg,#f3dd95 0%,#c7a24b 45%,#8c6d2c 100%);box-shadow:inset 0 0 0 2px #5e4a1c,0 3px 6px rgba(0,0,0,.5)}
.ht-flap i::after{content:"";position:absolute;left:50%;top:8px;width:18px;height:9px;margin-left:-9px;border-radius:2px;background:#271910;box-shadow:inset 0 1px 0 rgba(0,0,0,.6)}
.ht-bag.is-closing .ht-flap{animation:htFlapShut .3s cubic-bezier(.3,0,.5,1) both}
.ht-grab{display:none}
.ht-rivet{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 1px 2px rgba(0,0,0,.6)}
.ht-rivet::after{content:"";position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,rgba(255,253,240,.98) 0,rgba(255,236,180,.5) 18%,rgba(255,236,180,0) 56%);opacity:0;pointer-events:none;animation:htGlint .5s ease-out .26s both}
.ht-rivet.b::after{animation-delay:.31s}.ht-rivet.c::after{animation-delay:.36s}.ht-rivet.d::after{animation-delay:.41s}
.ht-rivet.a{top:14px;left:12px}.ht-rivet.b{top:14px;right:12px}.ht-rivet.c{bottom:12px;left:12px}.ht-rivet.d{bottom:12px;right:12px}
.ht-bag-hd{position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:2px 6px 10px 18px;border-bottom:1px solid rgba(239,212,134,.18)}
.ht-bag-ttl{display:flex;align-items:baseline;gap:10px;min-width:0}
.ht-bag-ttl svg{width:22px;height:22px;align-self:center;color:#efd486}
.ht-bag-ttl h2{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:22px;font-weight:700;line-height:1.1;color:#fbf6ed}
.ht-bag-act{display:flex;align-items:center;gap:8px;margin-left:auto}
.ht-bbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 13px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.55);color:#efd486;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;transition:background-color .12s,color .12s}
.ht-bbtn svg{width:18px;height:18px}
.ht-bbtn:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.ht-bbtn[aria-pressed="true"]{background:#efd486;color:#07111f;box-shadow:none}
.ht-bbtn.is-go{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c}
.ht-bbtn.is-go:hover:not(:disabled){background:#b2472f}
.ht-bbtn:disabled,.ht-bbtn.is-go:disabled{cursor:not-allowed;background:transparent;color:#a3998b;box-shadow:inset 0 0 0 1.5px rgba(163,153,139,.45)}
.ht-bbtn:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.ht-bag-note{margin:10px 18px 0;font-size:15px;font-style:italic;line-height:1.25;color:#cfc4b1}
.ht-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:10px 8px 0;padding:0;list-style:none}
.ht-grid li{display:flex;min-width:0}
.ht-slot{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;min-height:110px;padding:7px 3px 8px;box-sizing:border-box;border:0;border-radius:2px;background:#15110e;box-shadow:inset 0 0 0 1px rgba(239,212,134,.2);color:#e9dfcc;font-family:'Crimson Text',Georgia,serif;font-size:15px;line-height:1.1;text-align:center;cursor:pointer;transition:box-shadow .15s,transform .15s}
.ht-slot svg{flex:none;width:58px;height:58px}
.ht-slot > span:last-child{text-wrap:balance}
.ht-slot:hover{box-shadow:inset 0 0 0 1.5px #efd486;transform:translateY(-2px)}
.ht-slot[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #efd486,0 0 0 3px rgba(239,212,134,.25)}
.ht-slot:focus-visible{outline:2px solid #fbf6ed;outline-offset:2px}
.ht-slot.is-empty{cursor:default;background:rgba(10,8,6,.5);box-shadow:inset 0 0 0 1px rgba(239,212,134,.08),inset 0 8px 14px rgba(0,0,0,.45)}
.ht-slot.is-empty:hover{transform:none}
.ht-slot-ck{position:absolute;top:5px;right:5px;display:none;place-items:center;width:18px;height:18px;border-radius:999px;background:#efd486;color:#07111f}
.ht-slot-ck svg{width:12px;height:12px;stroke-width:2.6}
.ht-slot[aria-pressed="true"] .ht-slot-ck{display:grid}
.ht-slot-new{position:absolute;top:5px;left:5px;display:none;padding:2px 4px;border-radius:2px;background:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#fbf6ed}
.ht-slot.is-new .ht-slot-new{display:block}
.ht-combining .ht-slot:not(.is-empty){box-shadow:inset 0 0 0 1px rgba(239,212,134,.45)}
.ht-combining .ht-slot[aria-pressed="true"]{box-shadow:inset 0 0 0 2px #efd486,0 0 0 3px rgba(239,212,134,.25)}
/* items drop into their slots one by one; on close they sink; the item taken for use lifts out */
.ht-grid li > button.ht-slot{animation:htTileIn .26s cubic-bezier(.3,1.55,.55,1) .22s backwards}
.ht-grid li:nth-child(2) > button.ht-slot{animation-delay:.25s}
.ht-grid li:nth-child(3) > button.ht-slot{animation-delay:.28s}
.ht-grid li:nth-child(4) > button.ht-slot{animation-delay:.31s}
.ht-grid li:nth-child(5) > button.ht-slot{animation-delay:.34s}
.ht-bag.is-closing .ht-grid li > button.ht-slot:not(.is-lift){animation:htTileOut .14s ease-in both}
.ht-slot.is-lift{background:rgba(10,8,6,.5);box-shadow:inset 0 0 0 1px rgba(239,212,134,.08),inset 0 8px 14px rgba(0,0,0,.45)}
.ht-slot.is-lift > span{visibility:hidden}
.ht-slot.is-lift svg{position:relative;z-index:4;animation:htLift .32s cubic-bezier(.3,0,.5,1) both}
.ht-slot.is-out{box-shadow:inset 0 0 0 2px #efd486,0 0 0 3px rgba(239,212,134,.22)}
.ht-slot.is-out svg{opacity:.4}

.ht-d-txt{min-width:0}

.ht-d-k{display:block;margin-top:10px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.18em;color:#9e3f2a}
.ht-d-insp{margin:3px 0 0;font-size:16px;line-height:1.36;color:#2a2318}
.ht-d-clue{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;color:#2f6363}

.ht-d-clue b{font-family:'Crimson Text',Georgia,serif;font-size:16px;font-weight:600;letter-spacing:0;color:#07111f}
.ht-d-act{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
/* Hộp đối soát khóa số: compact 4-dial code lock */
.ht-lk{position:absolute;z-index:6;left:50%;bottom:92px;width:min(410px,calc(100% - 40px));box-sizing:border-box;padding:14px 16px;background:radial-gradient(rgba(255,255,255,.03) 1px,transparent 1.4px) 0 0/4px 4px,linear-gradient(180deg,#2a2620 0%,#191612 60%,#12100d 100%);box-shadow:inset 0 3px 0 #c7a24b,inset 0 4px 0 rgba(94,74,28,.9),inset 0 0 0 1px rgba(239,212,134,.22),0 26px 50px rgba(0,0,0,.66);color:#eee4d2;transform:translateX(-50%);transform-origin:50% 100%;animation:htLkIn .32s cubic-bezier(.2,.8,.2,1) both}
.ht-lk .ht-rivet::after{content:none}
.ht-lk .ht-rivet.a{top:8px;left:7px}.ht-lk .ht-rivet.b{top:8px;right:7px}.ht-lk .ht-rivet.c{bottom:6px;left:7px}.ht-lk .ht-rivet.d{bottom:6px;right:7px}
.ht-lk-hd{display:flex;align-items:center;gap:12px;padding:0 0 10px 12px;border-bottom:1px solid rgba(239,212,134,.18)}
.ht-lk-ic{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:999px;background:#efd486;color:#07111f}
.ht-lk-ic svg{width:20px;height:20px}
.ht-lk-ttl{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.ht-lk-ttl h2{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.1;color:#fbf6ed}
.ht-lk-p{margin:10px 8px 0 12px;font-size:16px;font-style:italic;line-height:1.3;color:#cfc4b1}
.ht-dials{display:flex;justify-content:center;gap:12px;margin:8px 0 0}
.ht-dials.err-a{animation:htShakeA .42s cubic-bezier(.36,.07,.19,.97) both}
.ht-dials.err-b{animation:htShakeB .42s cubic-bezier(.36,.07,.19,.97) both}
.ht-dial{display:flex;flex-direction:column;align-items:center;gap:2px}
.ht-dial-b{display:grid;place-items:center;width:52px;height:44px;padding:0;border:0;border-radius:2px;background:transparent;color:#efd486;cursor:pointer;transition:background-color .12s}
.ht-dial-b svg{width:22px;height:22px;stroke-width:2.2}
.ht-dial-b:hover:not(:disabled){background:rgba(239,212,134,.12)}
.ht-dial-b:disabled{cursor:default;color:#8f8577}
.ht-dial-w{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:52px;height:80px;box-sizing:border-box;overflow:hidden;border-radius:3px;background:linear-gradient(180deg,#4a3a16 0%,#b8933f 18%,#f0d898 50%,#b8933f 82%,#4a3a16 100%);box-shadow:inset 0 0 0 2px #3a2e12,inset 0 12px 10px -8px rgba(0,0,0,.55),inset 0 -12px 10px -8px rgba(0,0,0,.55),0 4px 8px rgba(0,0,0,.5);color:#1d140a;font-family:'Source Code Pro',ui-monospace,monospace;cursor:pointer;outline:none}
.ht-dial-w i{font-size:13px;font-style:normal;font-weight:600;line-height:1;color:rgba(29,20,10,.5)}
.ht-dial-w b{font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ht-dial-w.is-cur{box-shadow:inset 0 0 0 2px #3a2e12,inset 0 12px 10px -8px rgba(0,0,0,.55),inset 0 -12px 10px -8px rgba(0,0,0,.55),0 0 0 2px #efd486,0 4px 8px rgba(0,0,0,.5)}
.ht-dial-w:focus-visible{box-shadow:inset 0 0 0 2px #3a2e12,0 0 0 3px #fbf6ed,0 4px 8px rgba(0,0,0,.5)}
.ht-dial-w.up-a b{animation:htRollUpA .2s ease-out}
.ht-dial-w.up-b b{animation:htRollUpB .2s ease-out}
.ht-dial-w.dn-a b{animation:htRollDnA .2s ease-out}
.ht-dial-w.dn-b b{animation:htRollDnB .2s ease-out}
.ht-dials.is-ok .ht-dial-w{box-shadow:inset 0 0 0 2px #2f6363,0 0 0 2px #8fd0c4,0 0 16px rgba(143,208,196,.55)}
.ht-lk-msg{min-height:21px;margin:8px 0 0;font-size:16px;line-height:1.3;text-align:center;color:#cfc4b1}

.ht-lk-msg.is-ok{color:#8fd0c4}
.ht-lk-act{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
/* scene rig: pushes into the doorway, then settles on the next room */
.ht-rig{position:absolute;inset:0}
.ht-rig.is-push{animation:htPush .85s cubic-bezier(.55,0,.85,.3) both}
.ht-rig.is-pre{transform:scale(1.08)}
.ht-rig.is-settle{animation:htSettle .68s cubic-bezier(.2,.7,.25,1) both}
/* room transition: iris to black on the door, case-board title card, iris opens on the next room */
.ht-tr{position:absolute;z-index:15;inset:0;overflow:hidden;cursor:progress}
.ht-tr-iris{position:absolute;border-radius:50%;box-shadow:inset 0 0 90px 46px #070504,0 0 0 150vmax #070504;transform:translate(-50%,-50%);pointer-events:none}
.ht-tr.is-push .ht-tr-iris{animation:htIrisShut .64s cubic-bezier(.5,0,.6,1) .21s both}
.ht-tr.is-card .ht-tr-iris{width:0 !important;height:0 !important}
.ht-tr.is-open .ht-tr-iris{animation:htIrisOpen .65s cubic-bezier(.3,0,.25,1) both}
.ht-tc{position:absolute;left:50%;top:50%;width:min(600px,calc(100% - 32px));box-sizing:border-box;padding:30px 28px 22px;background:radial-gradient(rgba(0,0,0,.28) 1px,transparent 1.6px) 0 0/5px 5px,radial-gradient(rgba(255,214,150,.1) 1px,transparent 1.8px) 2px 3px/7px 7px,linear-gradient(160deg,#5c4128,#3b2817);box-shadow:inset 0 0 0 3px #5e4a1c,inset 0 0 0 5px #c7a24b,inset 0 0 46px rgba(0,0,0,.55),0 30px 60px rgba(0,0,0,.75);transform:translate(-50%,-50%);opacity:0;pointer-events:none}
.ht-tr.is-card .ht-tc{animation:htTcIn .42s cubic-bezier(.2,.8,.2,1) both}
.ht-tr.is-open .ht-tc{animation:htTcOut .3s ease-in both}
.ht-tc-card{position:relative;display:block;padding:20px 22px 16px 46px;background:#fbf6ed;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 14px 26px rgba(0,0,0,.45);transform:rotate(-1.2deg)}
.ht-tc-card::before{content:"";position:absolute;top:0;bottom:0;left:26px;width:1.5px;background:rgba(182,64,48,.5)}
.ht-tc-kick{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;line-height:1.5;color:#9e3f2a;text-wrap:balance}
.ht-tc-ttl{display:block;min-height:1.15em;margin-top:6px;font-family:'Playfair Display',Georgia,serif;font-size:42px;font-weight:700;line-height:1.15;color:#07111f}
.ht-tc-caret{display:inline-block;width:3px;height:.86em;margin-left:4px;vertical-align:-.06em;background:#9e3f2a;animation:htCaret .8s steps(1) infinite}
.ht-tc-route{position:relative;margin:16px 6px 0}
.ht-tc-route svg{display:block;width:100%;height:auto;overflow:visible}
.ht-tc-route path{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.ht-tc-route path.sh{stroke:rgba(0,0,0,.45);stroke-width:2.8}
.ht-tc-route path.st{stroke:#bf3b2c;stroke-width:2.1}
.ht-tr.is-card .ht-tc-route path,.ht-tr.is-open .ht-tc-route path{animation:htStr .5s cubic-bezier(.4,0,.2,1) .2s both}
.ht-tc-tag{position:absolute;top:calc(21.875% - 3px);padding:13px 10px 6px;background:#e9dcc0;box-shadow:0 1px 0 rgba(0,0,0,.2),0 8px 14px rgba(0,0,0,.4);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;color:#3b3328;white-space:nowrap;transform:translateX(-50%) rotate(-3deg)}
.ht-tc-tag.a{left:10%}
.ht-tc-tag.b{left:90%;transform:translateX(-50%) rotate(3deg)}
.ht-tc-tag .s-pin{top:-6px;left:50%;margin-left:-9px}
.ht-tr.is-card .ht-tc-tag.a .s-pin{animation:htPinIn .3s cubic-bezier(.3,1.6,.5,1) .12s both}
.ht-tr.is-card .ht-tc-tag.b{animation:htFade .2s ease-out .58s both}
.ht-tr.is-card .ht-tc-tag.b .s-pin{animation:htPinIn .3s cubic-bezier(.3,1.6,.5,1) .64s both}
/* discovery card */
.ht-disc{position:absolute;z-index:6;top:150px;right:22px;width:372px;box-sizing:border-box;padding:16px 16px 16px 42px;background:#fbf6ed;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55);transform:rotate(1.2deg);animation:htCard .7s cubic-bezier(.2,.8,.2,1) both}
.ht-disc-margin{position:absolute;top:0;bottom:0;left:26px;width:1.5px;background:rgba(182,64,48,.5)}
.ht-disc-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-6px -6px 6px 0;padding-bottom:4px;border-bottom:1.5px solid rgba(182,64,48,.55)}
.ht-disc-kick{font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.24em;color:#9e3f2a}
.ht-disc-top{display:flex;align-items:flex-start;gap:15px;margin-top:12px}
.ht-photo{position:relative;flex:none;margin:4px 0 0;padding:7px 7px 0;background:#fffdf8;box-shadow:0 1px 0 rgba(0,0,0,.15),0 10px 18px rgba(30,20,10,.35);transform:rotate(-4deg)}
.ht-photo svg{display:block;width:120px;height:94px;background:#0b0806}
.ht-photo.is-obj svg{background:#e9dcc0}
.ht-photo figcaption{padding:6px 0 7px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;text-align:center;color:#3b3328}

.ht-disc-meta{display:flex;flex-direction:column;gap:7px;min-width:0;padding-top:2px}
.ht-tagp{align-self:flex-start;padding:3px 7px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.ht-tagp.mine{background:rgba(79,154,154,.16);color:#2f6363;box-shadow:inset 0 0 0 1px rgba(47,99,99,.45)}
.ht-tagp.theirs{background:rgba(182,107,77,.14);color:#7a3f27;box-shadow:inset 0 0 0 1px rgba(122,63,39,.45)}
.ht-disc-h{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.14;color:#07111f}
.ht-disc-sub{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.16em;color:#5b5248}
.ht-disc-p{margin:12px 0 0;font-size:17px;line-height:1.36;color:#2a2318}
.ht-disc-count{display:flex;align-items:center;gap:8px;margin:12px 0 0;padding-top:10px;border-top:1px solid rgba(79,154,154,.4);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#2f6363}
.ht-disc-count b{display:grid;place-items:center;min-width:26px;height:22px;padding:0 5px;box-sizing:border-box;border-radius:2px;background:#2f6363;color:#fbf6ed;letter-spacing:.04em}
.ht-disc-btn{width:100%;margin-top:14px;text-transform:uppercase}
.ht-disc-btn svg{width:18px;height:18px}
.ht-sealed{position:relative;flex:none;width:112px;height:124px;margin-top:4px;background:linear-gradient(160deg,#e3cfa3,#d2b884);box-shadow:0 1px 0 rgba(0,0,0,.15),0 10px 18px rgba(30,20,10,.3);transform:rotate(-3deg);overflow:hidden}
.ht-sealed::before{content:"";position:absolute;left:0;right:0;top:0;height:58px;background:linear-gradient(to bottom right,rgba(0,0,0,0) 49.4%,rgba(94,74,28,.4) 50%,rgba(0,0,0,0) 50.8%),linear-gradient(to bottom left,rgba(0,0,0,0) 49.4%,rgba(94,74,28,.4) 50%,rgba(0,0,0,0) 50.8%)}
.ht-sealed i{position:absolute;left:50%;top:44px;width:26px;height:26px;margin-left:-13px;border-radius:999px;background:radial-gradient(circle at 38% 32%,#d2604a,#9e2a1c 55%,#5e170e);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.ht-sealed .s-stamp{position:absolute;left:12px;bottom:14px;padding:4px 8px;border-width:3px;font-size:10px;color:#7a3f27}
/* dialogue */
.ht-shade{position:absolute;z-index:6;inset:0;background:linear-gradient(180deg,rgba(8,6,4,0) 35%,rgba(8,6,4,.72) 100%);pointer-events:none;animation:htFade .35s ease-out both}
.ht-dlg{position:absolute;z-index:7;left:50%;bottom:18px;display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:end;width:min(1100px,calc(100% - 40px));transform:translateX(-50%);animation:htRise .45s cubic-bezier(.2,.8,.2,1) both}
.ht-plate{position:relative;padding:10px 10px 0;background:#e9dcc0;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55);transform:rotate(-2deg)}
.ht-plate svg{display:block;width:100%;height:auto}
.ht-plate .g-mono{position:absolute;left:18px;top:154px;width:46px;height:46px;font-size:18px;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 3px #e9dcc0}
.ht-plate-name{display:block;margin:0 -10px;padding:22px 12px 10px;background:#0d1014;font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;line-height:1.15;color:#fbf6ed}
.ht-card{position:relative;min-width:0;padding:14px 22px 12px 46px;background:#fbf6ed;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55)}
.ht-card::before{content:"";position:absolute;top:0;bottom:0;left:26px;width:1.5px;background:rgba(182,64,48,.5)}
.ht-card-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;padding-bottom:8px;border-bottom:1.5px solid rgba(182,64,48,.55)}
.ht-card-act .s-btn[aria-pressed="true"]{background:#07111f;color:#fbf6ed}
.ht-card-who{display:none;align-items:center;gap:10px}
.ht-card-who b{font-family:'Playfair Display',Georgia,serif;font-size:18px;line-height:1.1}
.ht-card-kick{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.ht-card-act{display:flex;gap:8px;margin-left:auto}
.ht-say{padding:6px 0 0;cursor:pointer}
.ht-q{display:flex;align-items:baseline;gap:10px;margin:2px 0 4px;font-size:18px;font-style:italic;line-height:1.3;color:#3b3328}
.ht-q span{flex:none;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-style:normal;font-weight:700;letter-spacing:.18em;color:#7a3f27}
.ht-line{min-height:90px;margin:0;padding:1px 0 0;background:repeating-linear-gradient(180deg,rgba(79,154,154,0) 0 29px,rgba(79,154,154,.4) 29px 30px);font-family:'Source Code Pro',ui-monospace,monospace;font-size:17px;font-weight:500;line-height:30px;letter-spacing:-.01em;color:#07111f}
.ht-caret{display:inline-block;width:9px;height:19px;margin-left:3px;vertical-align:-3px;background:#9e3f2a;animation:htCaret 1s steps(1) infinite}
.ht-choose{display:flex;align-items:center;gap:8px;margin:10px 0 8px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#5b5248}
.ht-choose .g-mono{width:24px;height:24px;font-size:11px}
.ht-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ht-choice{display:flex;align-items:center;gap:12px;min-height:50px;padding:8px 12px;box-sizing:border-box;border:0;border-radius:2px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1.5px #07111f;color:#07111f;font-family:'Crimson Text',Georgia,serif;font-size:18px;line-height:1.2;text-align:left;cursor:pointer;transition:background-color .12s,color .12s,box-shadow .12s}
.ht-choice kbd{flex:none;background:#07111f;box-shadow:none;color:#fbf6ed}
.ht-choice span{flex:1;min-width:0}
.ht-choice em{flex:none;padding:3px 6px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-style:normal;font-weight:700;letter-spacing:.12em;background:rgba(79,154,154,.16);color:#2f6363;box-shadow:inset 0 0 0 1px rgba(47,99,99,.4)}
.ht-choice em:empty{display:none}
.ht-choice:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.ht-choice:hover:not(:disabled) kbd{background:#efd486;color:#07111f}
.ht-choice:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.ht-choice.is-asked em{background:transparent;color:#5b5248;box-shadow:inset 0 0 0 1px rgba(91,82,72,.4)}
.ht-choice:disabled{cursor:not-allowed;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.4);color:#4f463c}
.ht-choice:disabled kbd{background:transparent;box-shadow:inset 0 0 0 1px rgba(91,82,72,.5);color:#5b5248}
.ht-card-ft{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:8px}
.ht-next{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 4px 0 10px;border:0;background:transparent;color:#3b3328;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;cursor:pointer}
.ht-next kbd{background:#07111f;box-shadow:none;color:#fbf6ed;font-style:normal}
.ht-next svg{width:18px;height:18px;color:#9e3f2a;animation:htNudge 1.4s ease-in-out infinite}
.ht-next:hover{color:#07111f}
.ht-next:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.ht-hist{max-height:214px;margin-top:6px;padding-bottom:14px;overflow:auto;-webkit-mask:linear-gradient(180deg,#000 calc(100% - 26px),transparent);mask:linear-gradient(180deg,#000 calc(100% - 26px),transparent)}
.ht-hist h3{margin:4px 0 6px;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700}
.ht-hist ol{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ht-hist li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;padding:6px 0;border-bottom:1px solid rgba(79,154,154,.4);font-size:16px;line-height:1.35;color:#2a2318}
.ht-hist li b{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;line-height:2;color:#5b5248}
.ht-hist li.is-q{font-style:italic;color:#3b3328}
.ht-hist li.is-q b{color:#7a3f27;font-style:normal}
/* motion */
@keyframes htFloor{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(1.7);opacity:0}}
@keyframes htDot{0%,80%,100%{opacity:.3}40%{opacity:1}}
