<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Phòng điều tra</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.s-brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:#fbf6ed;text-decoration:none}
.s-brand:hover{color:#fbf6ed}
.s-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.s-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-decoration:none;transition:color .15s}
.s-nav a:hover{color:#efd486}
.s-nav a[aria-current="page"]{color:#efd486}
.s-nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#bf3b2c;box-shadow:0 2px 2px rgba(0,0,0,.6)}
.s-nav a[aria-current="page"]::before{content:"";position:absolute;right:8px;bottom:3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-nav a:focus-visible,.s-brand:focus-visible,.s-topbtn:focus-visible{outline:2px solid #efd486;outline-offset:-3px}
.s-topbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid rgba(239,212,134,.28);border-radius:2px;background:rgba(255,255,255,.02);color:#eee4d2;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s}
.s-topbtn:hover{border-color:#efd486;color:#efd486}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #07111f;outline-offset:3px}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
@keyframes sFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:6;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
.s-lamp{animation:sFlicker 7s linear infinite}
.rm-cols{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.rm-seg{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#3b3328;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer;transition:background-color .12s,color .12s}
.rm-seg:hover{box-shadow:inset 0 0 0 1.5px #07111f;color:#07111f}
.rm-seg[aria-pressed="true"]{background:#07111f;color:#fbf6ed;box-shadow:inset 0 0 0 1px #07111f}
.rm-seg:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.rm-mode{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:92px;padding:14px;box-sizing:border-box;border:0;border-radius:2px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#3b3328;text-align:left;font-family:'Crimson Text',Georgia,serif;font-size:15px;line-height:1.25;cursor:pointer;transition:background-color .15s,box-shadow .15s,color .15s}
.rm-mode:hover{box-shadow:inset 0 0 0 1.5px #07111f}
.rm-mode[aria-pressed="true"]{background:#07111f;color:#e9dfcc;box-shadow:inset 0 0 0 1px #07111f}
.rm-mode[aria-pressed="true"] strong{color:#efd486 !important}
.rm-mode[aria-pressed="true"] svg{stroke:#efd486}
.rm-mode:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.rm-input{width:100%;box-sizing:border-box;min-height:46px;padding:8px 36px 8px 4px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);border-radius:0;background:transparent;color:#07111f;font-family:'Crimson Text',Georgia,serif;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.rm-input:focus{border-bottom-color:#07111f;background-color:rgba(239,212,134,.3)}
.rm-code{width:100%;box-sizing:border-box;min-height:56px;padding:8px 12px;border:0;border-radius:2px;background:#fbf6ed;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.5);color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:26px;font-weight:700;letter-spacing:.42em;text-transform:uppercase;text-align:center;outline:none}
.rm-code::placeholder{color:#a0968a;opacity:1}
.rm-code:focus{box-shadow:inset 0 0 0 2px #07111f;background-color:#fff9e8}
.rm-search{width:100%;box-sizing:border-box;min-height:42px;padding:8px 12px 8px 38px;border:0;border-radius:2px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#07111f;font-family:'Crimson Text',Georgia,serif;font-size:16px;outline:none}
.rm-search::placeholder{color:#6b6257;opacity:1}
.rm-search:focus{box-shadow:inset 0 0 0 1.5px #07111f}
.rm-table{width:100%;border-collapse:collapse}
.rm-table th{padding:10px 10px;border-bottom:1.5px solid rgba(182,64,48,.6);text-align:left;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#5b5248;white-space:nowrap}
.rm-table td{padding:9px 10px;border-bottom:1px solid rgba(79,154,154,.4);vertical-align:middle;font-size:16px;color:#2a2318}
.rm-table tbody tr{transition:background-color .15s}
.rm-table tbody tr:hover{background:rgba(239,212,134,.28)}
.rm-codecell{font-family:'Source Code Pro',ui-monospace,monospace;font-size:14px;font-weight:700;letter-spacing:.12em}
.rm-tag{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;white-space:nowrap}
.rm-wait{background:rgba(79,154,154,.16);color:#2f6363;box-shadow:inset 0 0 0 1px rgba(47,99,99,.4)}
.rm-play{background:rgba(182,107,77,.14);color:#7a3f27;box-shadow:inset 0 0 0 1px rgba(122,63,39,.4)}
@keyframes rmStampA{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes rmStampB{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes rmWipeA{from{clip-path:circle(0% at 0% 0%)}to{clip-path:circle(150% at 0% 0%)}}
@keyframes rmWipeB{from{clip-path:circle(0% at 0% 0%)}to{clip-path:circle(150% at 0% 0%)}}
@keyframes rmSpin{to{transform:rotate(360deg)}}
.anim-a .rm-stamp{animation:rmStampA .45s cubic-bezier(.2,.8,.2,1) both}
.anim-b .rm-stamp{animation:rmStampB .45s cubic-bezier(.2,.8,.2,1) both}
.anim-a .rm-swap{animation:rmWipeA .5s cubic-bezier(.4,0,.2,1) both}
.anim-b .rm-swap{animation:rmWipeB .5s cubic-bezier(.4,0,.2,1) both}
.rm-spin{animation:rmSpin 1.4s linear infinite}
@media (max-width:760px){
  .s-nav{order:3;width:100%}
  .rm-hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){
  .s-enter,.s-enter-zoom,.s-rim,.s-lamp,.rm-stamp,.rm-swap,.rm-spin{animation:none !important}
}
</style>
