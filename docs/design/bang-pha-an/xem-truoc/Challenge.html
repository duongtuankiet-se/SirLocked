<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Thử thách tuần</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:#fbf6ed;text-decoration:none}
.s-brand:hover{color:#fbf6ed}
.s-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.s-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-decoration:none;transition:color .15s}
.s-nav a:hover{color:#efd486}
.s-nav a[aria-current="page"]{color:#efd486}
.s-nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#bf3b2c;box-shadow:0 2px 2px rgba(0,0,0,.6)}
.s-nav a[aria-current="page"]::before{content:"";position:absolute;right:8px;bottom:3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-nav a:focus-visible,.s-brand:focus-visible,.s-topbtn:focus-visible{outline:2px solid #efd486;outline-offset:-3px}
.s-topbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid rgba(239,212,134,.28);border-radius:2px;background:rgba(255,255,255,.02);color:#eee4d2;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s}
.s-topbtn:hover{border-color:#efd486;color:#efd486}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-link{display:inline-flex;align-items:center;min-height:44px;color:#5b5248;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.s-link:hover{color:#9e3f2a}
.s-link-gold{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#efd486;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(239,212,134,.4);text-underline-offset:4px}
.s-link-gold:hover{color:#fbf6ed;text-decoration-color:#fbf6ed}
.s-link:focus-visible,.s-link-gold:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
@keyframes sFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:6;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
.s-lamp{animation:sFlicker 7s linear infinite}
/* ---- Thử thách tuần (ch-) ---- */
.ch-up{text-transform:uppercase}
.ch-titlerow{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px}
.ch-intro{flex:1 1 320px;max-width:560px;margin:0;font-size:18px;font-style:italic;line-height:1.4;color:#d9cfbd}
.ch-grid{display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:32px 40px;align-items:start}
.ch-col{display:flex;flex-direction:column;gap:30px;min-width:0}
.ch-kick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.ch-kick.gold{color:#efd486}
.ch-h2{margin:2px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;line-height:1.1;color:#07111f}
/* monograms */
.ch-pair{display:inline-flex;flex:none}
.ch-mono{display:inline-grid;place-items:center;flex:none;width:30px;height:30px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:11px;font-weight:700;font-style:normal;line-height:1;letter-spacing:0}
.ch-pair .ch-mono+.ch-mono{margin-left:-3px;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 2px #f4efe3}
.ch-mono.lg{width:38px;height:38px;font-size:14px}
.ch-pair .ch-mono.lg+.ch-mono.lg{margin-left:-4px;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 2.5px #12151a}
/* newspaper */
.ch-news{position:relative;box-sizing:border-box;padding:18px 28px 24px;background:radial-gradient(ellipse 120% 95% at 50% 32%,#e9e2d1 0%,#e3dbc9 52%,#d6cbb3 100%);color:#15120e;box-shadow:0 1px 0 rgba(0,0,0,.2),0 24px 48px rgba(0,0,0,.55);transform:rotate(-.4deg)}
.ch-mastrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;padding-bottom:10px;border-bottom:3px double rgba(58,52,43,.65)}
.ch-ear{justify-self:start;padding:5px 9px;box-shadow:inset 0 0 0 1px rgba(58,52,43,.55);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;line-height:1.3;color:#3a342b;white-space:nowrap}
.ch-ear.r{justify-self:end;color:#9e3f2a;box-shadow:inset 0 0 0 1px rgba(158,63,42,.6)}
.ch-mast{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:44px;font-weight:700;line-height:1.05;letter-spacing:.07em;color:#15120e;white-space:nowrap}
.ch-dateline{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:7px 0 6px;border-bottom:1px solid rgba(58,52,43,.45);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.18em;color:#3a342b}
.ch-head{margin:14px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:60px;font-weight:700;line-height:1.08;letter-spacing:-.005em;text-align:center;color:#15120e}
.ch-body{display:grid;grid-template-columns:minmax(0,1.24fr) minmax(0,1fr);gap:0 22px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(58,52,43,.45)}
.ch-fig{position:relative;margin:0;min-width:0}
.ch-fig svg{transition:opacity .4s,filter .4s}
.ch-fig.is-old svg{opacity:.4;filter:grayscale(1)}
.ch-fig svg{display:block;width:100%;height:auto;background:#1b1510;box-shadow:0 0 0 1px rgba(21,18,14,.7)}
.ch-cap{margin:7px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#4a4237}
.ch-text{min-width:0;padding-left:22px;border-left:1px solid rgba(58,52,43,.4)}
.ch-lede{margin:0;font-size:19px;line-height:1.42;color:#2a2318}
.ch-lede::first-letter{float:left;margin:6px 8px 0 -1px;font-family:'Playfair Display',Georgia,serif;font-size:62px;font-weight:700;line-height:.8;color:#15120e}
.ch-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ch-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:16px 0 0;padding:12px 0 0;border-top:3px double rgba(58,52,43,.5)}
.ch-facts div{display:flex;flex-direction:column-reverse;justify-content:flex-end;min-width:0}
.ch-facts div+div{padding-left:14px;border-left:1px solid rgba(58,52,43,.35)}
.ch-facts dd{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:36px;font-weight:700;line-height:1;font-variant-numeric:lining-nums tabular-nums;color:#15120e}
.ch-facts dt{margin-top:4px;font-size:15px;font-style:italic;line-height:1.25;color:#4a4237}
.ch-facts .warn dd{color:#9e3f2a}
.ch-endwrap{position:absolute;z-index:4;left:0;right:0;top:0;bottom:28px;display:grid;place-items:center;pointer-events:none}
.ch-end{margin:0;padding:12px 18px 11px;border:6px double currentColor;color:#b0362a;font-family:'Source Code Pro',ui-monospace,monospace;font-size:34px;font-weight:700;letter-spacing:.1em;line-height:1.2;text-align:center;text-transform:uppercase;white-space:nowrap;transform:rotate(-9deg);mix-blend-mode:multiply;filter:url(#ch-ink)}
/* desk: countdown + your team */
.ch-desk{position:relative;display:grid;grid-template-columns:auto 1px minmax(0,1fr);gap:0 26px;box-sizing:border-box;padding:22px 28px 24px;background:linear-gradient(180deg,#161a1f 0%,#0d1014 100%);color:#eee4d2;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(239,212,134,.2),inset 0 0 0 6px #0f1216,inset 0 0 0 7px rgba(199,162,75,.38),0 24px 48px rgba(0,0,0,.6);transform:rotate(.35deg)}
.ch-screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 1px 2px rgba(0,0,0,.7)}
.ch-screw::after{content:"";position:absolute;left:2px;right:2px;top:50%;height:1.5px;margin-top:-.75px;background:#4a3a14;transform:rotate(-35deg)}
.ch-vrule{width:1px;background:linear-gradient(180deg,rgba(239,212,134,0),rgba(239,212,134,.35) 18%,rgba(239,212,134,.35) 82%,rgba(239,212,134,0))}
.ch-dl{display:flex;flex-direction:column;justify-content:center;min-width:378px}
.ch-dr{display:flex;flex-direction:column;min-width:0}
.ch-clock{--fw:74px;--fh:88px;--fz:46px;display:flex;align-items:flex-start;align-self:flex-start;margin-top:12px;padding:12px 14px 9px;border-radius:4px;background:#07090b;box-shadow:inset 0 2px 10px rgba(0,0,0,.9),inset 0 0 0 1px rgba(239,212,134,.1),0 0 0 2px #3a2d12,0 0 0 3.5px rgba(199,162,75,.6),0 10px 18px rgba(0,0,0,.5)}
.ch-unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.ch-colon{display:flex;flex-direction:column;justify-content:center;gap:16px;width:18px;height:var(--fh)}
.ch-colon::before,.ch-colon::after{content:"";display:block;width:5px;height:5px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2,#c7a24b 50%,#5e4a1c)}
.ch-flap{position:relative;width:var(--fw);height:var(--fh);border-radius:5px;background:#121418;box-shadow:0 0 0 1px #000,0 5px 9px rgba(0,0,0,.65)}
.ch-flap::after{content:"";position:absolute;z-index:4;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#050607;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.ch-flap::before{content:"";position:absolute;z-index:5;left:-3px;right:-3px;top:50%;height:10px;margin-top:-5px;border-radius:1px;background:linear-gradient(90deg,#c7a24b 0 4px,transparent 4px calc(100% - 4px),#c7a24b calc(100% - 4px) 100%)}
.ch-half{position:absolute;left:0;right:0;height:50%;overflow:hidden;font-family:'Source Code Pro',ui-monospace,monospace;font-size:var(--fz);font-weight:700;color:#f4ead6;text-align:center;font-variant-numeric:tabular-nums}
.ch-half>span{display:block;height:var(--fh);line-height:var(--fh)}
.ch-top{top:0;border-radius:5px 5px 0 0;background:linear-gradient(180deg,#2c3139 0%,#1e2228 100%)}
.ch-bot{bottom:0;border-radius:0 0 5px 5px;background:linear-gradient(180deg,#1a1d22 0%,#111316 100%)}
.ch-bot>span{margin-top:calc(var(--fh) / -2)}
.ch-leaves{position:absolute;inset:0;z-index:2;display:none;perspective:300px}
.fl-a .ch-leaves,.fl-b .ch-leaves{display:block}
.ch-leaves .ch-half{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.ch-fall{z-index:2;transform-origin:50% 100%}
.ch-land{z-index:2;transform-origin:50% 0;transform:rotateX(90deg)}
.fl-a .ch-fall{animation:chFallA .5s cubic-bezier(.55,0,.85,.45) both}
.fl-b .ch-fall{animation:chFallB .5s cubic-bezier(.55,0,.85,.45) both}
.fl-a .ch-land{animation:chLandA .5s cubic-bezier(.2,.65,.35,1.25) both}
.fl-b .ch-land{animation:chLandB .5s cubic-bezier(.2,.65,.35,1.25) both}
.ch-ul{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.22em;color:#b3a794}
.ch-champ{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;background:#07090b;box-shadow:inset 0 2px 8px rgba(0,0,0,.8),inset 0 0 0 1px rgba(239,212,134,.22)}
.ch-champtxt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.ch-champname{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;line-height:1.2;color:#fbf6ed}
.ch-champ .ch-pair .ch-mono+.ch-mono{box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 2px #07090b}
.ch-champtime{margin-left:auto;padding-left:8px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:30px;font-weight:700;line-height:1;color:#efd486;font-variant-numeric:tabular-nums}
.ch-myteam{display:flex;align-items:center;gap:12px;margin-top:10px}
.ch-myname{min-width:0;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;line-height:1.2;color:#fbf6ed}
.ch-l2{display:block}
.ch-myname i,.ch-champname i{font-style:italic;font-weight:400;color:#c7a24b}
.ch-stand{margin:14px 0 0;padding:2px 14px;background:#07090b;box-shadow:inset 0 0 0 1px rgba(239,212,134,.18)}
.ch-stand div{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:42px;padding:5px 0;box-sizing:border-box}
.ch-stand div+div{border-top:1px dashed rgba(239,212,134,.22)}
.ch-stand dt{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#b3a794;text-transform:uppercase}
.ch-stand dd{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:24px;font-weight:700;line-height:1.1;color:#efd486;font-variant-numeric:tabular-nums}
.ch-cta{width:100%;min-height:56px;margin-top:16px;font-size:14px;letter-spacing:.22em}
/* leaderboard ledger */
.ch-ledger{position:relative;box-sizing:border-box;padding:20px 22px 18px 48px;background:#f4efe3;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55);transform:rotate(.5deg)}
.ch-margin{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(182,64,48,.5)}
.ch-margin.a{left:26px}
.ch-margin.b{left:30px}
.ch-lbstamp{position:absolute;z-index:3;top:24px;right:20px;pointer-events:none}
.ch-stamp{display:inline-block;padding:5px 10px;border:4px double currentColor;color:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;white-space:nowrap;transform:rotate(-9deg);mix-blend-mode:multiply;filter:url(#ch-ink)}
.ch-segs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;margin-top:16px}
.ch-seg{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 12px;box-sizing:border-box;border:0;border-radius:2px;background:transparent;box-shadow:inset 0 0 0 1px rgba(91,82,72,.35);color:#3b3328;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.14em;cursor:pointer;transition:background-color .12s,color .12s}
.ch-seg:hover{box-shadow:inset 0 0 0 1.5px #07111f;color:#07111f}
.ch-seg[aria-pressed="true"]{background:#07111f;color:#fbf6ed;box-shadow:inset 0 0 0 1px #07111f}
.ch-seg:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.ch-rule{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;font-size:15px;font-style:italic;line-height:1.35;color:#5b5248}
.ch-rule svg{flex:none;margin-top:2px}
.ch-lb{margin-top:6px}
.ch-table{width:100%;border-collapse:collapse;table-layout:fixed}
.ch-c1{width:52px}
.ch-c3{width:80px}
.ch-table th{padding:9px 8px;border-bottom:1.5px solid rgba(182,64,48,.6);text-align:left;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#5b5248;text-transform:uppercase;white-space:nowrap}
.ch-table td{height:48px;padding:5px 8px;box-sizing:border-box;border-bottom:1px solid rgba(79,154,154,.4);vertical-align:middle;font-size:16px;line-height:1.2;color:#2a2318}
.ch-table .ch-rk{padding-left:2px;padding-right:2px;text-align:center}
.ch-table .ch-met{text-align:right}
.ch-table td.ch-met{font-family:'Source Code Pro',ui-monospace,monospace;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:#07111f}
.ch-top10 tr{transition:background-color .15s}
.ch-top10 tr:hover{background:rgba(239,212,134,.28)}
.ch-num{font-family:'Source Code Pro',ui-monospace,monospace;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:#3b3328}
.ch-seal{display:block;margin:0 auto;overflow:visible;transform-origin:50% 50%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.ch-team{display:flex;align-items:center;gap:10px;min-width:0}
.ch-names{min-width:0}
.ch-n2{white-space:nowrap}
.ch-names i{padding:0 1px;font-family:'Playfair Display',Georgia,serif;font-style:italic;color:#9e3f2a}
.ch-sep td{height:auto;padding:12px 0 10px;border-bottom:0}
.ch-sepline{display:flex;align-items:center;gap:12px;font-size:15px;font-style:italic;color:#5b5248;white-space:nowrap}
.ch-sepline::before,.ch-sepline::after{content:"";flex:1;border-top:1.5px dashed rgba(91,82,72,.45)}
.ch-me td{height:60px;background:rgba(239,212,134,.4);border-top:1px solid rgba(158,63,42,.35);border-bottom:1px solid rgba(158,63,42,.35)}
.ch-me td:first-child{position:relative;box-shadow:inset 3px 0 0 #9e3f2a}
.ch-me .ch-num{color:#07111f}
.ch-me .ch-names{font-weight:600;color:#07111f}
.ch-me .ch-pair .ch-mono+.ch-mono{box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 2px #f2e5c0}
.ch-youtag{display:block;margin-top:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;font-style:normal;letter-spacing:.16em;color:#9e3f2a}
.ch-mepin{position:absolute;left:-29px;top:50%;width:13px;height:13px;margin-top:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);box-shadow:0 3px 4px rgba(0,0,0,.45)}
/* empty: an almost blank front page */
.ch-blank{width:100%;max-width:900px;margin:0 auto;transform:rotate(.3deg)}
.ch-mastrow.solo{grid-template-columns:minmax(0,1fr);justify-items:center}
.ch-void{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:540px;margin-top:16px}
.ch-ghost{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));pointer-events:none}
.ch-ghost span{border-left:1px solid rgba(58,52,43,.2)}
.ch-ghost span:first-child{border-left:0}
.ch-crease{position:absolute;left:-28px;right:-28px;top:46%;height:14px;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,250,238,.35) 45%,rgba(58,52,43,.12) 52%,rgba(58,52,43,0) 100%);pointer-events:none}
.ch-notice{position:relative;z-index:1;box-sizing:border-box;max-width:520px;padding:30px 36px 28px;background:#e5ddcb;box-shadow:0 0 0 1px rgba(58,52,43,.5),0 0 0 6px #e5ddcb,0 0 0 7px rgba(58,52,43,.3);text-align:center}
.ch-emptymsg{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;line-height:1.2;color:#15120e}
.ch-emptymsg span{display:block;margin-top:8px;font-family:'Crimson Text',Georgia,serif;font-size:21px;font-weight:400;font-style:italic;color:#3a342b}
.ch-notice .s-btn{margin-top:20px}
.ch-mag{position:absolute;z-index:2;right:5%;bottom:3%;transform:rotate(-14deg);pointer-events:none}
/* motion */
@keyframes chFallA{0%{transform:rotateX(0)}50%,100%{transform:rotateX(-90deg)}}
@keyframes chFallB{0%{transform:rotateX(0)}50%,100%{transform:rotateX(-90deg)}}
@keyframes chLandA{0%,50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes chLandB{0%,50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
@keyframes chDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes chPopA{0%{opacity:0;transform:scale(.3) rotate(-28deg)}65%{opacity:1;transform:scale(1.16) rotate(5deg)}100%{opacity:1;transform:none}}
@keyframes chPopB{0%{opacity:0;transform:scale(.3) rotate(-28deg)}65%{opacity:1;transform:scale(1.16) rotate(5deg)}100%{opacity:1;transform:none}}
@keyframes chPopC{0%{opacity:0;transform:scale(.3) rotate(-28deg)}65%{opacity:1;transform:scale(1.16) rotate(5deg)}100%{opacity:1;transform:none}}
@keyframes chWipeL{from{clip-path:circle(0% at 25% 0%)}to{clip-path:circle(150% at 25% 0%)}}
@keyframes chWipeR{from{clip-path:circle(0% at 75% 0%)}to{clip-path:circle(150% at 75% 0%)}}
@keyframes chSlamA{0%{opacity:0;transform:rotate(-17deg) scale(2.3)}60%{opacity:1;transform:rotate(-8deg) scale(.95)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
@keyframes chSlamB{0%{opacity:0;transform:rotate(-17deg) scale(2.3)}60%{opacity:1;transform:rotate(-8deg) scale(.95)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
.ch-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:chDraw 1.1s 1.15s cubic-bezier(.5,0,.3,1) both}
.ch-top10 tr:nth-child(2) .ch-seal{--d:.12s}
.ch-top10 tr:nth-child(3) .ch-seal{--d:.24s}
.ch-lb .ch-seal{animation:chPopA .5s calc(1.15s + var(--d, 0s)) cubic-bezier(.2,.8,.2,1) both}
.ch-lb.ch-wl .ch-seal{animation-name:chPopB;animation-delay:calc(.3s + var(--d, 0s))}
.ch-lb.ch-wr .ch-seal{animation-name:chPopC;animation-delay:calc(.3s + var(--d, 0s))}
.ch-wl{animation:chWipeL .6s cubic-bezier(.4,0,.2,1) both}
.ch-wr{animation:chWipeR .6s cubic-bezier(.4,0,.2,1) both}
.ch-st0 .ch-slam{animation:chSlamA .45s 1.25s cubic-bezier(.2,.8,.2,1) both}
.ch-sta .ch-slam{animation:chSlamA .45s .1s cubic-bezier(.2,.8,.2,1) both}
.ch-stb .ch-slam{animation:chSlamB .45s .1s cubic-bezier(.2,.8,.2,1) both}
.ch-st0 .ch-popx{animation:chPopA .5s 1.45s cubic-bezier(.2,.8,.2,1) both}
.ch-sta .ch-popx{animation:chPopB .5s .35s cubic-bezier(.2,.8,.2,1) both}
.ch-stb .ch-popx{animation:chPopC .5s .35s cubic-bezier(.2,.8,.2,1) both}
@media (max-width:1180px){
  .ch-grid{grid-template-columns:minmax(0,1fr) 420px;gap:30px 30px}
  .ch-head{font-size:52px}
  .ch-desk{gap:0 22px;padding:22px 22px 24px}
  .ch-clock{--fw:62px;--fh:78px;--fz:38px;padding:11px 12px 8px}
  .ch-colon{width:14px}
  .ch-dl{min-width:314px}
  .ch-lbstamp{display:none}
  .ch-n2{display:block}
}

  .ch-n2{display:inline}
}

  .ch-text{margin-top:16px;padding-left:0;border-left:0}

  .ch-desk{grid-template-columns:minmax(0,1fr);padding:20px 18px 22px}
  .ch-dl{min-width:0}
  .ch-vrule{width:auto;height:1px;margin:20px 0 4px;background:linear-gradient(90deg,rgba(239,212,134,0),rgba(239,212,134,.35) 18%,rgba(239,212,134,.35) 82%,rgba(239,212,134,0))}
  .ch-clock{--fw:60px;--fh:74px;--fz:36px;align-self:center;padding:10px 10px 8px}
  .ch-colon{width:12px;gap:14px}
  .ch-champ{gap:12px;padding:12px 14px}
  .ch-champ .ch-seal{width:44px;height:44px}
  .ch-champtime{font-size:26px}
  .ch-lbstamp{display:none}
  .ch-n2{display:block}
  .ch-ledger{padding:18px 12px 14px 40px}
  .ch-margin.a{left:20px}

  .ch-c1{width:44px}

  .ch-table td{padding-left:5px;padding-right:5px}
  .ch-team{gap:8px}
  .ch-seg{gap:6px;padding:0 8px;letter-spacing:.1em}
  .ch-mepin{left:-24px}
  .ch-void{min-height:0;padding:56px 0 8px}
  .ch-ghost{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ch-ghost span:nth-child(3){display:none}
  .ch-crease{left:-18px;right:-18px}
  .ch-notice{padding:24px 18px 22px}
  .ch-emptymsg{font-size:24px}
  .ch-emptymsg span{font-size:19px}
  .ch-mag{position:relative;right:auto;bottom:auto;width:96px;height:96px;margin-top:22px}
}
@media (prefers-reduced-motion:reduce){

  .ch-leaves{display:none !important}
  .ch-seg,.ch-top10 tr,.ch-fig svg{transition:none}
}
