<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Đăng nhập (Bảng phá án)</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
a{color:#07111f}a:hover{color:#9e3f2a}
.b-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.b-mono{font-family:'Source Code Pro',ui-monospace,monospace}
.b-serif{font-family:'Playfair Display',Georgia,serif}
.b-body{font-family:'Crimson Text',Georgia,serif}
.b-lang{min-width:48px;min-height:44px;padding:0 12px;border:0;border-radius:2px;background:transparent;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:color .12s,background-color .12s}
.b-lang:hover{color:#efd486}
.b-lang[aria-pressed="true"]{background:#c7a24b;color:#07111f}
.b-lang:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.b-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1.5px solid rgba(182,64,48,.55);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:500;letter-spacing:.2em;color:#5b5248}
.b-title{margin:14px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;line-height:1.1;color:#07111f}
.b-title:focus{outline:none}
.b-sub{margin:6px 0 0;font-size:18px;font-style:italic;color:#5b5248}
.b-field{display:flex;flex-direction:column;gap:4px}
.b-flabel{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:#5b5248}
.b-hint{font-size:15px;font-style:italic;color:#5b5248}
.b-input{display:block;width:100%;box-sizing:border-box;min-height:46px;padding:10px 4px 8px;border:0;border-bottom:1.5px solid rgba(47,99,99,.55);border-radius:0;background:transparent;color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:16px;letter-spacing:.02em;outline:none;transition:border-color .12s,background-color .12s,box-shadow .12s}
.b-input::placeholder{color:#6b6257;opacity:1}
.b-input:hover{border-bottom-color:#2f6363}
.b-input:focus{border-bottom-color:#07111f;box-shadow:0 1.5px 0 #07111f;background-color:rgba(239,212,134,.35)}
.b-input.has-tool{padding-right:48px}
.b-reveal{position:absolute;right:0;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;border-radius:2px;background:transparent;color:#5b5248;cursor:pointer;transition:color .12s,background-color .12s}
.b-reveal:hover{color:#07111f}
.b-reveal[aria-pressed="true"]{color:#07111f;background:rgba(239,212,134,.5)}
.b-reveal:focus-visible{outline:2px solid #9e3f2a;outline-offset:-2px}
.b-link{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0;padding:0;border:0;background:none;color:#5b5248;font-family:'Crimson Text',Georgia,serif;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px;cursor:pointer}
.b-link:hover{color:#9e3f2a;text-decoration-color:#9e3f2a}
.b-link:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.b-link.is-strong{font-style:normal;font-weight:600;color:#07111f}
.b-link.is-back{gap:6px;text-decoration:none}
.b-link.is-back .u{text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.b-link.is-back:hover .u{text-decoration-color:#9e3f2a}
.b-primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;box-sizing:border-box;min-height:54px;padding:8px 20px;border:0;border-radius:2px;background:#9e3f2a;color:#fbf6ed;font-family:'Source Code Pro',ui-monospace,monospace;font-weight:700;font-size:14px;letter-spacing:.22em;line-height:1.3;text-align:center;cursor:pointer;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3);transition:background-color .12s,transform .12s,box-shadow .12s}
.b-primary svg{flex:none}
.b-primary span{text-wrap:balance}
.b-primary:hover:not(:disabled){background:#b2472f}
a.b-primary,a.b-primary:hover{color:#fbf6ed;text-decoration:none}
.b-primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #6b2a1c,0 4px 10px rgba(158,63,42,.3)}
.b-primary:focus-visible{outline:2px solid #07111f;outline-offset:3px}
.b-primary:disabled{cursor:progress;background:#7d3122;color:#efd486}
.b-google{display:flex;align-items:center;justify-content:center;gap:12px;min-height:48px;padding:0 16px;border:1px solid #c9c0ae;background:#ffffff;color:#1f1f1f;font-family:'Crimson Text',Georgia,serif;font-weight:600;font-size:17px;text-decoration:none;transition:background-color .12s,border-color .12s}
.b-google:hover{background:#f6f2ea;border-color:#8a7d63;color:#1f1f1f}
.b-google:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.b-col{padding-top:max(20px,calc(50vh - 388px))}
.b-col.has-notice{padding-top:max(16px,calc(50vh - 434px))}
.b-tabs{position:relative;z-index:2;display:flex;align-items:flex-end;gap:4px;margin-bottom:-1px;padding-left:30px}
.b-tab{position:relative;min-width:138px;min-height:44px;padding:13px 18px 9px;border:0;border-radius:3px 3px 0 0;background:#d9c49a;color:#3b3328;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;cursor:pointer;box-shadow:inset 0 -8px 8px -8px rgba(40,24,10,.45),0 -2px 10px rgba(0,0,0,.25);transition:background-color .12s,color .12s,min-height .18s,padding .18s}
.b-tab::before{content:"";position:absolute;left:12px;right:12px;top:6px;height:2px;border-radius:1px;background:rgba(122,63,39,.3)}
.b-tab:hover{background:#e7d7b4;color:#07111f}
.b-tab[aria-pressed="true"]{min-height:46px;padding-top:16px;background:#fbf6ed;color:#07111f;box-shadow:0 -2px 10px rgba(0,0,0,.25)}
.b-tab[aria-pressed="true"]::before{background:#bf3b2c}
.b-tab.is-current{cursor:default}
.b-tab:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.b-note{display:flex;align-items:flex-start;gap:10px;margin:12px 0 0;padding:10px 12px;font-size:16px;line-height:1.35;color:#07111f}
.b-note svg{flex:none;margin-top:2px}
.b-note p{margin:0}
.b-note .k{margin:0 0 3px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.16em}
.b-note.invite{border:1px dashed #4f9a9a;background:rgba(79,154,154,.07)}
.b-note.invite .k{color:#2f6363}
.b-note.warn{border:1px solid rgba(182,107,77,.6);background:rgba(182,107,77,.1)}
.b-note.warn .k{color:#7a3f27}
.b-slip{margin:20px 0 0;padding:14px 16px 16px;border:1px solid rgba(90,74,50,.38);border-top:2px dashed rgba(90,74,50,.5);background:#f7f0dc;box-shadow:0 8px 18px rgba(5,10,18,.14);transform:rotate(-.8deg)}
.b-slip .k{margin:0 0 8px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.b-slip p{margin:0}
.b-slip-in{animation:bSlip .5s cubic-bezier(.2,.8,.2,1) both}
.b-stampbox{position:absolute;z-index:4;left:20px;right:0;top:38%;display:flex;justify-content:center;pointer-events:none}
.b-filed .b-field{opacity:.42;transition:opacity .4s}
.b-stamp{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 22px 10px;border:6px double currentColor;white-space:nowrap;transform:rotate(-9deg);mix-blend-mode:multiply;filter:url(#b-ink)}
.b-stamp b{font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;letter-spacing:.1em;line-height:1}
.b-stamp small{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.3em}
.b-stamp-in{animation:bStamp .45s .1s cubic-bezier(.2,.8,.2,1) both}
.b-threads .thread{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:bDraw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.b-threads .shadow{stroke:rgba(0,0,0,.42);stroke-width:2.8}
.b-threads .red{stroke:#bf3b2c;stroke-width:2.1}
.b-threads .d1{animation-delay:.2s}
.b-threads .d2{animation-delay:.32s}
.b-threads .d3{animation-delay:.44s}
.b-threads .d4{animation-delay:.56s}
.b-threads .d5{animation-delay:.68s}
.b-threads .d6{animation-delay:.8s}
.b-threads .d7{animation-delay:1s}
.b-threads.is-solving .red{stroke:#efd486;stroke-width:2.4;stroke-dasharray:.07 .015;stroke-dashoffset:0;filter:url(#b-glow);animation:bRun .7s linear infinite}
.b-threads.is-solving .shadow{opacity:.35}
.b-pin.is-solving{box-shadow:0 0 0 4px rgba(239,212,134,.35),0 0 24px 8px rgba(239,212,134,.45),0 6px 8px rgba(0,0,0,.45) !important}
@keyframes bDraw{to{stroke-dashoffset:0}}
@keyframes bRun{to{stroke-dashoffset:-.085}}
.b-threads.is-solving .red.d1,.b-threads.is-solving .red.d2,.b-threads.is-solving .red.d3,.b-threads.is-solving .red.d4,.b-threads.is-solving .red.d5,.b-threads.is-solving .red.d6,.b-threads.is-solving .red.d7{animation-delay:0s}
@keyframes bRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes bFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
@keyframes bSettleA{0%{transform:translateY(-7px) rotate(-.8deg)}55%{transform:translateY(1px) rotate(.15deg)}100%{transform:none}}
@keyframes bSettleB{0%{transform:translateY(-7px) rotate(-.8deg)}55%{transform:translateY(1px) rotate(.15deg)}100%{transform:none}}
@keyframes bRepinA{0%{transform:translateY(-16px) scale(1.35)}55%{transform:translateY(1px) scale(.92)}100%{transform:none}}
@keyframes bRepinB{0%{transform:translateY(-16px) scale(1.35)}55%{transform:translateY(1px) scale(.92)}100%{transform:none}}
@keyframes bWipeA{from{clip-path:circle(0% at 20% 0%)}to{clip-path:circle(150% at 20% 0%)}}
@keyframes bWipeB{from{clip-path:circle(0% at 20% 0%)}to{clip-path:circle(150% at 20% 0%)}}
@keyframes bStamp{0%{opacity:0;transform:rotate(-17deg) scale(2.2)}60%{opacity:1;transform:rotate(-8deg) scale(.94)}100%{opacity:1;transform:rotate(-9deg) scale(1)}}
@keyframes bSlip{from{opacity:0;transform:translateY(-10px) rotate(-3deg)}to{opacity:1;transform:rotate(-.8deg)}}
.b-rise{animation:bRise .7s cubic-bezier(.2,.8,.2,1) both}
.b-rise-late{animation:bRise .75s .12s cubic-bezier(.2,.8,.2,1) both}
.b-lamp{animation:bFlicker 7s linear infinite}
.b-settle-a{animation:bSettleA .5s cubic-bezier(.2,.8,.2,1) both}
.b-settle-b{animation:bSettleB .5s cubic-bezier(.2,.8,.2,1) both}
.b-repin-a{animation:bRepinA .5s cubic-bezier(.3,1.4,.5,1) both}
.b-repin-b{animation:bRepinB .5s cubic-bezier(.3,1.4,.5,1) both}
.b-wipe-a{animation:bWipeA .5s cubic-bezier(.4,0,.2,1) both}
.b-wipe-b{animation:bWipeB .5s cubic-bezier(.4,0,.2,1) both}
@media (max-width:700px){
  .b-col{padding-top:88px !important}
}
@media (max-width:640px){
  .b-card{padding:24px 20px 22px 42px !important}
  .b-margin{left:28px !important}
  .b-label{padding:14px 26px 12px !important}
  .b-wordmark{font-size:36px !important}
  .b-title{font-size:28px !important}
  .b-tabs{padding-left:16px}
  .b-tab{min-width:124px;padding-left:12px;padding-right:12px;letter-spacing:.14em}
  .b-pinpos{right:28px !important}
  .b-primary{font-size:13px;letter-spacing:.14em;gap:10px}
  .b-stamp{padding:10px 16px 8px;border-width:5px}
  .b-stamp b{font-size:24px}
  .b-stamp small{letter-spacing:.2em}
}
@media (prefers-reduced-motion:reduce){
  .b-threads .thread{animation:none !important;stroke-dashoffset:0 !important}
  .b-threads.is-solving .red{animation:none !important}
  .b-filed .b-field{transition:none}
  .b-rise,.b-rise-late,.b-lamp,.b-settle-a,.b-settle-b,.b-repin-a,.b-repin-b,.b-wipe-a,.b-wipe-b,.b-stamp-in,.b-slip-in{animation:none !important}
  .b-tab{transition:none}
}
</style>
