<html lang="vi">
<head>

<style>
body{margin:0;background:#120d09}
a{color:#07111f}a:hover{color:#9e3f2a}
.ve-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ve-mono{font-family:'Source Code Pro',ui-monospace,monospace}
.ve-serif{font-family:'Playfair Display',Georgia,serif}
.ve-body{font-family:'Crimson Text',Georgia,serif}
.ve-lang{min-width:48px;min-height:44px;padding:0 12px;border:0;border-radius:2px;background:transparent;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.08em;cursor:pointer;transition:color .12s,background-color .12s}
.ve-lang:hover{color:#efd486}
.ve-lang[aria-pressed="true"]{background:#c7a24b;color:#07111f}
.ve-lang:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.ve-title{margin:12px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:30px;font-weight:700;line-height:1.12;color:#07111f;text-wrap:balance}
.ve-text{margin:10px 0 0;font-size:17px;line-height:1.42;color:#2a2318;text-wrap:pretty}
.ve-text + .ve-text{margin-top:6px}
.ve-email{font-family:'Source Code Pro',ui-monospace,monospace;font-size:15.5px;font-weight:600;letter-spacing:.02em;color:#07111f;white-space:nowrap}
.ve-q{font-weight:600;color:#07111f}
.ve-aside{margin:8px 0 0;font-size:16px;font-style:italic;line-height:1.4;color:#5b5248;text-wrap:pretty}
.ve-note{display:flex;align-items:flex-start;gap:10px;margin:14px 0 0;padding:10px 12px;font-size:16px;line-height:1.38;text-wrap:pretty}
.ve-note svg{flex:none;margin-top:1px}
.ve-note.memo{background:rgba(233,220,192,.55);box-shadow:inset 3px 0 0 #c7a24b;color:#2a2318}
.ve-note.memo b{font-weight:600;color:#07111f}
.ve-sent{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 0;font-size:16px;line-height:1.35;color:#2f6363;text-align:left}
.ve-sent svg{flex:none}
.ve-note.invite{border:1px dashed #4f9a9a;background:rgba(251,246,237,.85);color:#07111f}
.ve-note.invite p{margin:0}
.ve-note.invite b{font-weight:600;color:#1f4545}
.ve-btn-ink{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;min-height:50px;margin-top:16px;padding:0 16px;border:0;border-radius:2px;overflow:hidden;background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.16em;font-variant-numeric:tabular-nums;text-align:center;cursor:pointer;transition:background-color .12s,color .12s,transform .12s}
.ve-btn-ink:hover{background:#07111f;color:#fbf6ed}
.ve-btn-ink:active:not([aria-disabled="true"]){transform:translateY(2px)}
.ve-btn-ink:focus-visible{outline:2px solid #07111f;outline-offset:3px}
.ve-btn-ink[aria-disabled="true"],.ve-btn-ink[aria-disabled="true"]:hover{cursor:not-allowed;background:rgba(91,82,72,.07);color:#5b5248;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.42)}
.ve-fuse{position:absolute;left:0;bottom:0;height:3px;background:#9e3f2a;transition:width 1s linear}
.ve-link{display:inline-flex;align-items:center;min-height:44px;margin:-12px 0;color:#5b5248;font-family:'Crimson Text',Georgia,serif;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.ve-link:hover{color:#9e3f2a;text-decoration-color:#9e3f2a}
.ve-link:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.ve-primary{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;box-sizing:border-box;min-height:54px;margin-top:20px;padding:8px 20px;border:0;border-radius:2px;background:#9e3f2a;color:#fbf6ed;font-family:'Source Code Pro',ui-monospace,monospace;font-weight:700;font-size:14px;letter-spacing:.2em;line-height:1.3;text-align:center;cursor:pointer;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3);transition:background-color .12s,transform .12s,box-shadow .12s}
.ve-primary svg{flex:none}
.ve-primary span,.ve-btn-ink span{text-wrap:balance}
a.ve-primary,a.ve-primary:hover{color:#fbf6ed;text-decoration:none}
.ve-primary:hover{background:#b2472f}
.ve-primary:active{transform:translateY(2px);box-shadow:0 1px 0 #6b2a1c,0 4px 10px rgba(158,63,42,.3)}
.ve-primary:focus-visible{outline:2px solid #07111f;outline-offset:3px}
.ve-herobox{position:relative;margin-top:12px;aspect-ratio:360 / 124}
.ve-herobox > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ve-hero .h-post,.ve-hero .h-scan,.ve-hero .h-halo,.ve-hero .h-open,.ve-hero .h-crack{display:none}
.ve-hero.is-check .h-post{display:inline}
.ve-hero.is-scan .h-scan,.ve-hero.is-scan .h-halo{display:inline}
.ve-hero.is-ok .h-open{display:inline}
.ve-hero.is-ok .h-closed{display:none}
.ve-hero.is-bad .h-crack{display:inline}
.ve-scan{transform:translate(150px,82px) rotate(-4deg);animation:veScan 3.4s ease-in-out infinite}
.ve-halo{animation:vePulse 1.3s ease-in-out infinite}
.ve-stampbox{position:absolute;z-index:2;right:-4px;top:30%;pointer-events:none}
.ve-stamp{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 14px 7px;border:5px double currentColor;white-space:nowrap;transform:rotate(-8deg);mix-blend-mode:multiply;filter:url(#ve-ink)}
.ve-stamp b{font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;letter-spacing:.06em;line-height:1}
.ve-stamp small{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.2em}
.ve-stamp-in{animation:veStamp0 .45s .95s cubic-bezier(.2,.8,.2,1) both}
.anim-a .ve-stamp-in{animation:veStampA .45s .32s cubic-bezier(.2,.8,.2,1) both}
.anim-b .ve-stamp-in{animation:veStampB .45s .32s cubic-bezier(.2,.8,.2,1) both}
.anim-a{animation:veWipeA .55s cubic-bezier(.4,0,.2,1) both}
.anim-b{animation:veWipeB .55s cubic-bezier(.4,0,.2,1) both}
.ve-reveal{animation:veReveal .35s cubic-bezier(.2,.8,.2,1) both}
.ve-runline{stroke-dasharray:6 5;animation:veRun .6s linear infinite}
.ve-threads .thread{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:veDraw 1.1s cubic-bezier(.3,.7,.2,1) forwards}
.ve-threads .shadow{stroke:rgba(0,0,0,.42);stroke-width:2.8}
.ve-threads .red{stroke:#bf3b2c;stroke-width:2.1;transition:stroke .4s,opacity .4s}
.ve-threads .d1{animation-delay:.2s}
.ve-threads .d2{animation-delay:.32s}
.ve-threads .d3{animation-delay:.44s}
.ve-threads .d4{animation-delay:.56s}
.ve-threads .d5{animation-delay:.8s}
.ve-threads .d6{animation-delay:.9s}
.ve-threads .d7{animation-delay:1s}
.ve-threads.is-solving .red{stroke:#efd486;stroke-width:2.4;stroke-dasharray:.07 .015;stroke-dashoffset:0;filter:url(#ve-glow);animation:veRunT .7s linear infinite}
.ve-threads.is-solving .shadow{opacity:.35}
.ve-threads.is-solved .red{stroke:#efd486;stroke-width:2.3;filter:url(#ve-glow)}
.ve-threads.is-cold .red{stroke:#8a4436;opacity:.62}
.ve-threads.is-cold .shadow{opacity:.5}
.ve-pin{transition:box-shadow .4s}
.ve-pin.is-lit{box-shadow:0 0 0 4px rgba(239,212,134,.35),0 0 24px 8px rgba(239,212,134,.45),0 6px 8px rgba(0,0,0,.45) !important}
@keyframes veDraw{to{stroke-dashoffset:0}}
@keyframes veRunT{to{stroke-dashoffset:-.085}}
@keyframes veRun{to{stroke-dashoffset:-11}}
.ve-threads.is-solving .red.d1,.ve-threads.is-solving .red.d2,.ve-threads.is-solving .red.d3,.ve-threads.is-solving .red.d4,.ve-threads.is-solving .red.d5,.ve-threads.is-solving .red.d6,.ve-threads.is-solving .red.d7{animation-delay:0s}
@keyframes veRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes veFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
@keyframes veScan{0%,100%{transform:translate(92px,66px) rotate(-8deg)}28%{transform:translate(162px,96px) rotate(4deg)}52%{transform:translate(184px,58px) rotate(10deg)}76%{transform:translate(118px,94px) rotate(-2deg)}}
@keyframes vePulse{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes veStamp0{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes veStampA{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes veStampB{0%{opacity:0;transform:rotate(-16deg) scale(2.2)}60%{opacity:1;transform:rotate(-7deg) scale(.94)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes veWipeA{from{clip-path:circle(0% at 50% 22%)}to{clip-path:circle(150% at 50% 22%)}}
@keyframes veWipeB{from{clip-path:circle(0% at 50% 22%)}to{clip-path:circle(150% at 50% 22%)}}

.ve-rise{animation:veRise .7s cubic-bezier(.2,.8,.2,1) both}

.ve-lamp{animation:veFlicker 7s linear infinite}

  .ve-col{padding-top:88px !important}
  .ve-card{padding:24px 20px 22px 42px !important}
  .ve-margin{left:28px !important}
  .ve-label{padding:14px 26px 12px !important}
  .ve-wordmark{font-size:36px !important}
  .ve-title{font-size:26px}
  .ve-text{font-size:16.5px}
  .ve-primary{font-size:13px;letter-spacing:.12em;gap:10px}
  .ve-btn-ink{font-size:12px;letter-spacing:.12em}
  .ve-stamp{padding:7px 10px 5px;border-width:4px}
  .ve-stamp b{font-size:17px}
  .ve-stamp small{font-size:10px;letter-spacing:.16em}
}
@media (prefers-reduced-motion:reduce){
  .ve-threads .thread{animation:none !important;stroke-dashoffset:0 !important}

  .ve-fuse,.ve-threads .red,.ve-pin{transition:none !important}
}
