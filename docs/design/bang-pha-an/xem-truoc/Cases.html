<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Vụ án</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#120d09}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-brand{display:inline-flex;align-items:center;gap:10px;min-height:44px;color:#fbf6ed;text-decoration:none}
.s-brand:hover{color:#fbf6ed}
.s-nav{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.s-nav a{position:relative;display:inline-flex;align-items:center;min-height:44px;padding:0 14px;color:#b3a794;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:600;letter-spacing:.18em;text-decoration:none;transition:color .15s}
.s-nav a:hover{color:#efd486}
.s-nav a[aria-current="page"]{color:#efd486}
.s-nav a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:6px;height:2px;background:#bf3b2c;box-shadow:0 2px 2px rgba(0,0,0,.6)}
.s-nav a[aria-current="page"]::before{content:"";position:absolute;right:8px;bottom:3px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12);box-shadow:0 2px 3px rgba(0,0,0,.6)}
.s-nav a:focus-visible,.s-brand:focus-visible,.s-topbtn:focus-visible{outline:2px solid #efd486;outline-offset:-3px}
.s-topbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;min-height:44px;padding:0 12px;box-sizing:border-box;border:1px solid rgba(239,212,134,.28);border-radius:2px;background:rgba(255,255,255,.02);color:#eee4d2;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:border-color .15s,color .15s}
.s-topbtn:hover{border-color:#efd486;color:#efd486}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-link{display:inline-flex;align-items:center;min-height:44px;color:#5b5248;font-size:16px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(91,82,72,.45);text-underline-offset:3px}
.s-link:hover{color:#9e3f2a}
.s-link-gold{display:inline-flex;align-items:center;gap:8px;min-height:44px;color:#efd486;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(239,212,134,.4);text-underline-offset:4px}
.s-link-gold:hover{color:#fbf6ed;text-decoration-color:#fbf6ed}
.s-link:focus-visible,.s-link-gold:focus-visible{outline:2px solid #efd486;outline-offset:2px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
@keyframes sFlicker{0%,100%{opacity:1}8%{opacity:.82}10%{opacity:.97}44%{opacity:.9}47%{opacity:1}71%{opacity:.93}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:6;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
.s-lamp{animation:sFlicker 7s linear infinite}
/* ---- Vụ án (cs-) ---- */
[hidden]{display:none !important}
sc-if{display:contents}
.cs-kick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.cs-kick.gold{color:#efd486}
.cs-h2{margin:2px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:700;line-height:1.1;color:#07111f}
.cs-h2.light{color:#fbf6ed}
.cs-up{text-transform:uppercase}
.s-paper .s-link:focus-visible{outline-color:#07111f}
/* top strip: resume + join by code */
.cs-top{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px 40px;align-items:stretch}
.cs-cont{position:relative;display:flex;flex-direction:column;min-width:0;box-sizing:border-box;padding:20px 26px 12px;background:#0d1014;color:#eee4d2;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(239,212,134,.16),0 24px 48px rgba(0,0,0,.6);transform:rotate(-.3deg)}
.cs-swap{flex:1;display:flex;flex-direction:column}
.cs-runs{margin:12px 0 0;padding:0;list-style:none}
.cs-run{display:grid;grid-template-columns:150px minmax(0,1fr) 104px 186px;grid-template-areas:"code case who go";align-items:center;gap:10px 22px;padding:13px 0;border-top:1px solid rgba(239,212,134,.16)}
.cs-rcode{grid-area:code}
.cs-rcase{grid-area:case;min-width:0}
.cs-who{grid-area:who;display:flex;align-items:center;gap:10px}
.cs-rgo{grid-area:go;width:100%}
.cs-codek{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.18em;color:#b3a794}
.cs-codev{display:block;margin-top:3px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:22px;font-weight:700;line-height:1.1;letter-spacing:.16em;color:#fbf6ed}
.cs-rtitle{display:block;overflow:hidden;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;line-height:1.2;color:#fbf6ed;white-space:nowrap;text-overflow:ellipsis}
.cs-rsub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin-top:6px;font-size:15px;font-style:italic;line-height:1.25;color:#cfc4b1}
.cs-tag{display:inline-flex;align-items:center;gap:7px;min-height:22px;padding:0 8px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-style:normal;font-weight:700;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase}
.cs-tag.play{background:rgba(196,98,63,.15);color:#e8a58c;box-shadow:inset 0 0 0 1px rgba(232,165,140,.45)}
.cs-tag.wait{background:rgba(79,154,154,.16);color:#8fd0cf;box-shadow:inset 0 0 0 1px rgba(143,208,207,.4)}
.cs-live{width:7px;height:7px;border-radius:50%;background:#e8a58c;animation:csLive 1.8s ease-out infinite}
.cs-seats{display:inline-flex}
.cs-seat{display:inline-grid;place-items:center;width:32px;height:32px;box-sizing:border-box;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 2px #0d1014;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:12px;font-weight:700;letter-spacing:.02em}
.cs-seat + .cs-seat{margin-left:3px}
.cs-seat.empty{background:#0d1014;box-shadow:0 0 0 2px #0d1014;border:1.5px dashed rgba(239,212,134,.55)}
.cs-n{font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;color:#e9dfcc;font-variant-numeric:tabular-nums}
.cs-empty{position:relative;flex:1;display:flex;align-items:center;gap:20px;min-height:116px;margin:14px 0 8px;padding:16px 150px 16px 20px;box-sizing:border-box;border:1.5px dashed rgba(239,212,134,.28);border-radius:2px}
.cs-empty p{margin:0;max-width:440px;font-size:18px;font-style:italic;line-height:1.4;color:#cfc4b1}
.cs-empty svg{flex:none}
.cs-estampbox{position:absolute;top:50%;right:24px;margin-top:-18px}
.cs-estamp{display:inline-block;padding:4px 12px;border:4px double currentColor;color:#e8a58c;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;transform:rotate(-8deg);opacity:.8}
.cs-join{position:relative;display:flex;flex-direction:column;min-width:0;box-sizing:border-box;padding:20px 24px 16px 50px;background:#f4efe3;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 44px rgba(0,0,0,.55);transform:rotate(.7deg)}
.cs-mline{position:absolute;top:0;bottom:0;width:1.5px;background:rgba(182,64,48,.5)}
.cs-joinp{margin:4px 0 0;font-size:16px;line-height:1.35;color:#3b3328}
.cs-codehead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:14px}
.cs-label{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.16em;color:#5b5248;text-transform:uppercase}
.cs-count{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.12em;color:#5b5248;font-variant-numeric:tabular-nums}
.cs-coderow{display:flex;gap:10px;margin-top:6px}
.cs-code{flex:1;width:100%;min-width:0;box-sizing:border-box;min-height:56px;padding:8px 6px;border:0;border-radius:2px;background:#fbf6ed;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.5);color:#07111f;font-family:'Source Code Pro',ui-monospace,monospace;font-size:24px;font-weight:700;letter-spacing:.38em;text-indent:.38em;text-transform:uppercase;text-align:center;outline:none;transition:box-shadow .15s,background-color .15s}
.cs-code::placeholder{color:#776e60;opacity:1}
.cs-code:focus{box-shadow:inset 0 0 0 2px #07111f;background-color:#fff9e8}
.cs-go{flex:none;min-width:86px;min-height:56px}
.cs-hint{margin:8px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#5b5248}
/* main: filing drawer + open dossier */
.cs-main{position:relative;display:grid;grid-template-columns:680px minmax(0,1fr);gap:44px 56px;align-items:stretch;margin-top:14px}
.cs-drawer{position:relative;display:flex;flex-direction:column;min-width:0;background:#0e0b09;box-shadow:inset 0 0 0 1px rgba(239,212,134,.14),0 24px 48px rgba(0,0,0,.6)}
.cs-dhead{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:10px 16px;height:76px;box-sizing:border-box;padding:0 22px;background:linear-gradient(180deg,#1c2026,#111418);border-bottom:1px solid rgba(239,212,134,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 8px 14px rgba(0,0,0,.55)}
.cs-plate{position:relative;display:inline-flex;flex:none;margin:0 10px;padding:4px;border-radius:2px;background:linear-gradient(180deg,#f3dc98 0%,#c7a24b 46%,#8a6e2e 100%);box-shadow:0 2px 5px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.55)}
.cs-plate::before,.cs-plate::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f6e3a6,#8a6e2e 60%,#4a3a14);box-shadow:0 1px 1px rgba(0,0,0,.6)}
.cs-plate::before{left:-10px}
.cs-plate::after{right:-10px}
.cs-plate span{display:block;padding:5px 12px;background:#f4efe3;box-shadow:inset 0 1px 2px rgba(0,0,0,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;color:#3b3328;white-space:nowrap}
.cs-files{flex:1;display:flex;flex-direction:column;gap:22px;margin:0;padding:30px 16px 24px;list-style:none;background:linear-gradient(90deg,rgba(0,0,0,.45),rgba(0,0,0,0) 14px,rgba(0,0,0,0) calc(100% - 14px),rgba(0,0,0,.45))}
.cs-file{position:relative;height:118px;box-sizing:border-box;padding:14px 22px 14px 18px;background:#e9dcc0;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.25),0 10px 18px rgba(0,0,0,.5);transform:translateX(0) rotate(var(--r,0deg));transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s;cursor:pointer}
.cs-file:nth-child(even){background:#dccb9f}
.cs-file:nth-child(1){--r:-.3deg}.cs-file:nth-child(2){--r:.25deg}.cs-file:nth-child(3){--r:-.2deg}.cs-file:nth-child(4){--r:.3deg}.cs-file:nth-child(5){--r:-.25deg}.cs-file:nth-child(6){--r:.2deg}.cs-file:nth-child(7){--r:-.3deg}
.cs-file:hover,.cs-file:focus-within{transform:translateX(8px) rotate(var(--r,0deg))}
.cs-file.is-open,.cs-file.is-open:hover,.cs-file.is-open:focus-within{z-index:2;transform:translateX(30px) rotate(0deg);box-shadow:inset 4px 0 0 #9e3f2a,0 1px 0 rgba(0,0,0,.25),0 18px 30px rgba(0,0,0,.65)}
.cs-tab{position:absolute;top:-20px;display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 15px;box-sizing:border-box;background:inherit;clip-path:polygon(7px 0,calc(100% - 7px) 0,100% 100%,0 100%);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#4f4536;white-space:nowrap}
.cs-file:nth-child(3n+1) .cs-tab{left:18px}
.cs-file:nth-child(3n+2) .cs-tab{left:176px}
.cs-file:nth-child(3n) .cs-tab{left:334px}
.cs-tabdot{display:none;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291,#c0392b 45%,#6e1a12)}
.cs-file.is-open .cs-tab{color:#9e3f2a}
.cs-file.is-open .cs-tabdot{display:inline-block}
.cs-fbody{display:grid;grid-template-columns:112px minmax(0,1fr) 108px;grid-template-areas:"thumb main acts";align-items:center;gap:0 18px;height:100%}
.cs-thumb{grid-area:thumb;position:relative;display:block;width:112px;height:84px;background:radial-gradient(ellipse at 50% 38%,#2e251d 0%,#15110e 72%);box-shadow:inset 0 0 0 1px rgba(239,212,134,.24),0 3px 6px rgba(0,0,0,.35);transform:rotate(-1.4deg)}
.cs-file:nth-child(even) .cs-thumb{transform:rotate(1.1deg)}
.cs-thumb .cs-art{display:block;width:100%;height:100%}
.cs-clip{position:absolute;top:-12px;left:14px;transform:rotate(-7deg);filter:drop-shadow(0 1px 1px rgba(0,0,0,.55))}
.cs-fmain{grid-area:main;min-width:0}
.cs-trow{display:flex;align-items:center;gap:8px;min-width:0}
.cs-ftitle{min-width:0;margin:0;overflow:hidden;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.15;white-space:nowrap;text-overflow:ellipsis}
.cs-fsum{display:-webkit-box;margin:4px 0 0;overflow:hidden;font-size:16px;line-height:1.3;color:#2a2318;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cs-fstats{margin:7px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.08em;color:#4f4536;text-transform:uppercase;white-space:nowrap}
.cs-fstats b{font-weight:700;color:#07111f}
.cs-fstats b,.cs-fstats span{white-space:nowrap}
.cs-facts{grid-area:acts;display:flex;flex-direction:column;gap:8px}
.cs-facts .s-btn{width:100%;gap:6px;padding:0 4px;letter-spacing:.14em;white-space:nowrap}
.cs-pick[aria-pressed="true"]{background:#07111f;color:#fbf6ed}
/* dossier */
.cs-detail{position:relative;display:flex;flex-direction:column;min-width:0;box-sizing:border-box;padding:12px;background:#d9c49a;box-shadow:inset 0 0 0 1px rgba(94,74,28,.22),0 1px 0 rgba(0,0,0,.2),0 24px 48px rgba(0,0,0,.6);transform:rotate(.25deg)}
.cs-dtab{position:absolute;top:-26px;left:22px;display:inline-flex;align-items:center;gap:8px;height:26px;padding:0 18px;box-sizing:border-box;background:#d9c49a;clip-path:polygon(9px 0,calc(100% - 9px) 0,100% 100%,0 100%);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.18em;color:#3b3328;white-space:nowrap}
.cs-dtab .cs-tabdot{display:inline-block}
.cs-under{position:absolute;top:20px;right:5px;bottom:5px;left:22px;background:#efe6d0;box-shadow:0 2px 6px rgba(0,0,0,.25);transform:rotate(.9deg)}
.cs-page{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;padding:12px 26px 24px 46px;background:#fbf6ed;color:#07111f;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cs-margin{position:absolute;top:0;bottom:0;left:24px;width:1.5px;background:rgba(182,64,48,.5)}
.cs-dc{position:relative;flex:1;display:flex;flex-direction:column;min-width:0}
.cs-o1{--oy:141px}.cs-o2{--oy:281px}.cs-o3{--oy:421px}.cs-o4{--oy:561px}.cs-o5{--oy:701px}.cs-o6{--oy:841px}.cs-o7{--oy:981px}
.cs-dtop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 4px}
.cs-back{display:inline-flex;align-items:center;gap:9px;min-height:44px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.16em;color:#9e3f2a;text-decoration:none;text-transform:uppercase}
.cs-back:hover{color:#07111f}
.cs-back svg{transition:transform .15s}
.cs-back:hover svg{transform:translateX(-3px)}
.cs-back:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.cs-stampbox{flex:none;margin:6px 16px 0 0;pointer-events:none}
.cs-stamp{display:inline-block;padding:4px 10px;border:3px double currentColor;color:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.2em;white-space:nowrap;text-transform:uppercase;transform:rotate(-8deg);mix-blend-mode:multiply}
.cs-dtitle{margin:2px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:34px;font-weight:700;line-height:1.08;color:#07111f;outline:none}
.cs-dtitle:focus-visible{outline:2px solid #07111f;outline-offset:4px}
.cs-dmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:10px}
.cs-dwrong{margin-left:4px;font-size:15px;font-style:italic;color:#7a3f27}
.cs-dsum{margin:12px 0 0;font-size:17px;line-height:1.45;color:#2a2318}
.cs-stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:16px 0 0;padding:0;list-style:none}

.cs-sn{font-family:'Playfair Display',Georgia,serif;font-size:27px;font-weight:700;line-height:1;color:#07111f;font-variant-numeric:lining-nums tabular-nums}

.cs-h3{display:flex;align-items:center;gap:12px;margin:22px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;line-height:1.15;color:#07111f}

.cs-acth span{color:#9e3f2a}

.cs-mono{display:grid;place-items:center;flex:none;width:44px;height:44px;margin-top:2px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 2px #c7a24b,0 0 0 3px #fbf6ed,0 0 0 4px rgba(26,44,66,.35);color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.02em}

.cs-su::before{content:"";position:absolute;z-index:1;top:5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 2px 2px rgba(0,0,0,.45)}

.cs-sealnote{margin:14px 0 0}
.cs-sealk{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#7a3f27;text-transform:uppercase}
