<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Hồ sơ vụ án</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#0b0806}
[hidden]{display:none !important}
sc-if{display:contents}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
/* ---- in-game frame (g-) ---- */
.g-stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%)}
.g-stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.g-glass{background:rgba(10,12,15,.9);box-shadow:inset 0 0 0 1px rgba(239,212,134,.22),0 14px 30px rgba(0,0,0,.55)}
.g-kick{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.2em;color:#efd486}
.g-mute{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.16em;color:#b3a794}
.g-mono{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:999px;background:#1a2c42;box-shadow:inset 0 0 0 1px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700}
.g-mono.rust{background:#3a1d12;box-shadow:inset 0 0 0 1px #c98a63;color:#f2c9a9}
.g-dot{width:8px;height:8px;border-radius:999px;background:#5fb3a8;box-shadow:0 0 0 2px rgba(95,179,168,.25)}
.g-tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:70px;min-height:64px;padding:8px 12px 6px;white-space:nowrap;box-sizing:border-box;border:0;border-radius:2px;background:transparent;color:#e9dfcc;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1.15;text-align:center;cursor:pointer;transition:background-color .15s,color .15s}
.g-tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.g-tool:hover:not(:disabled){background:rgba(239,212,134,.1);color:#efd486}
.g-tool[aria-pressed="true"]{background:#efd486 !important;color:#07111f !important}
.g-tool:disabled{cursor:not-allowed;color:#6f665a}
.g-tool:focus-visible{outline:2px solid #efd486;outline-offset:-2px}
.g-key{position:absolute;top:5px;right:7px;min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:2px;box-shadow:inset 0 0 0 1px currentColor;font-size:9px;line-height:15px;opacity:.75}
.g-sep{width:1px;align-self:stretch;margin:8px 4px;background:rgba(239,212,134,.22)}
.g-spot{position:absolute;z-index:2;display:grid;place-items:center;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
.g-spot::before{content:"";position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 2px #efd486,0 0 12px rgba(239,212,134,.7),inset 0 0 8px rgba(239,212,134,.45)}
.g-spot::after{content:"";position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 2px rgba(239,212,134,.8);animation:gPing 2.2s ease-out infinite}
.g-spot:focus-visible{outline:2px solid #fbf6ed;outline-offset:2px}
.g-tag{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);padding:5px 9px;white-space:nowrap;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(239,212,134,.4);color:#fbf6ed;font-family:'Crimson Text',Georgia,serif;font-size:15px;line-height:1.1;pointer-events:none;opacity:0;transition:opacity .15s}
.g-tag b{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:9px;font-weight:700;letter-spacing:.18em;color:#efd486}
.g-spot:hover .g-tag,.g-spot:focus-visible .g-tag,.g-spot.is-hot .g-tag{opacity:1}
.g-wit{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:9px;transform:translate(-50%,-100%)}
.g-bub{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 2px #c7a24b,0 8px 14px rgba(0,0,0,.55);color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:700}
.g-bub::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;box-sizing:border-box;background:#1a2c42;border-right:2px solid #c7a24b;border-bottom:2px solid #c7a24b;transform:rotate(45deg)}
.g-name{padding:3px 8px;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(239,212,134,.4);color:#fbf6ed;font-family:'Crimson Text',Georgia,serif;font-size:15px;line-height:1.1;white-space:nowrap}
@keyframes gPing{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(1.9);opacity:0}}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:20;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}

@media (max-width:900px){
  .g-obj{max-width:none !important}
  .g-team,.g-timer{display:none !important}
  .g-tools{left:8px !important;right:8px;transform:none !important;justify-content:space-between}
  .g-tool{flex:1 1 0;min-width:0;padding:8px 2px 6px}
  .g-tool .g-lbl{display:none}
  .g-sep{margin:8px 0}
  .g-hintbar{display:none !important}
}
/* ---- Hồ sơ vụ án overlay (cf-) ---- */
.cf-veil{position:absolute;inset:0;z-index:8;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:32px;box-sizing:border-box;background:rgba(8,6,4,.74);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);animation:cfFade .3s .75s ease-out both}
.cf-sheet{position:relative;width:100%;min-width:0;max-width:1240px;height:calc(100vh - 64px);min-height:556px;box-sizing:border-box;border-radius:3px;background:linear-gradient(180deg,#dcc8a0 0%,#d9c49a 26%,#d2bb8f 100%);color:#07111f;box-shadow:inset 0 0 0 1px rgba(94,74,28,.5),inset 0 2px 0 rgba(255,246,220,.4),0 2px 0 rgba(0,0,0,.3),0 34px 70px rgba(0,0,0,.7);animation:cfOpen .55s .85s cubic-bezier(.4,0,.2,1) backwards}
.cf-ftab{position:absolute;left:34px;top:-26px;display:flex;align-items:center;gap:12px;height:30px;padding:0 18px 4px 16px;box-sizing:border-box;border-radius:8px 8px 0 0;background:#dcc8a0;box-shadow:inset 0 1px 0 rgba(255,246,220,.55),inset 1px 0 0 rgba(94,74,28,.4),inset -1px 0 0 rgba(94,74,28,.4),0 -6px 12px -4px rgba(0,0,0,.3)}
.cf-ftname{font-family:'Playfair Display',Georgia,serif;font-size:17px;font-style:italic;line-height:1;color:#07111f}
.cf-ftcode{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#8c3624}
.cf-scroll{display:flex;flex-direction:column;height:100%;min-height:0}
/* header */
.cf-head{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px;padding:20px 22px 16px 30px;border-bottom:1px solid rgba(94,74,28,.3);box-shadow:0 1px 0 rgba(255,246,220,.35)}
.cf-head .s-btn:focus-visible{outline-color:#07111f}
.cf-label{position:relative;flex:none;padding:10px 24px 12px 26px;background:#0d1014;box-shadow:0 12px 24px rgba(0,0,0,.4);transform:rotate(-1deg)}
.cf-labkick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.24em;color:#efd486}
.cf-h1{margin:3px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:32px;font-weight:700;line-height:1.08;color:#fbf6ed}
.cf-prog{flex:1 1 300px;min-width:0}
.cf-mini{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#4f4536;text-transform:uppercase}
.cf-progline{margin:2px 0 0;font-size:19px;line-height:1.25;color:#07111f}
.cf-progline b{font-weight:600;color:#8c3624}
.cf-path{display:flex;max-width:460px;margin:9px 0 0;padding:0;list-style:none}
.cf-path li{position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;color:#4f4536;text-transform:uppercase;white-space:nowrap}
.cf-path li:last-child{flex:none}
.cf-path li::after{content:"";position:absolute;left:18px;right:6px;top:6px;border-top:2px dashed rgba(122,63,39,.45)}
.cf-path li.is-done::after{border-top:2px solid #bf3b2c;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.2))}
.cf-path li:last-child::after{display:none}
.cf-path li.is-now{color:#8c3624}
.cf-node{position:relative;z-index:1;width:14px;height:14px;box-sizing:border-box;border-radius:50%}
.is-done .cf-node{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 2px 3px rgba(0,0,0,.4)}
.is-now .cf-node{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);box-shadow:0 2px 3px rgba(0,0,0,.4);animation:cfPulse 1.8s ease-in-out infinite}
.is-lock .cf-node{border:1.5px dashed rgba(79,69,54,.75);background:rgba(251,246,237,.35)}
.cf-acc{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:7px;max-width:290px}
.cf-accbtn{flex:none;min-height:44px;padding:0 18px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.cf-accbtn svg,.cf-finbtn svg{width:17px;height:17px;flex:none}
.s-btn-red.cf-accbtn[aria-disabled="true"],.s-btn-red.cf-accbtn[aria-disabled="true"]:hover{cursor:not-allowed;background:#5a4a3e;color:#ddd3c2;box-shadow:0 3px 0 #3a3029}
.s-btn.cf-accbtn[aria-disabled="true"]:active{transform:none}
.cf-accwhy{display:flex;align-items:center;gap:6px;margin:0;font-size:15px;font-style:italic;line-height:1.25;color:#4a3826;text-align:right}
.cf-accwhy svg{flex:none;width:14px;height:14px;color:#6b4a2c}
.cf-close{flex:none;align-self:flex-start;padding:7px;background:#0d1014;box-shadow:0 10px 20px rgba(0,0,0,.35);transform:rotate(.8deg)}
.cf-close .s-btn:focus-visible{outline-color:#efd486}
.cf-closebtn{gap:10px;text-transform:uppercase}
.cf-esc{display:inline-grid;place-items:center;min-width:30px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:3px;box-shadow:inset 0 0 0 1px currentColor,inset 0 -2px 0 rgba(239,212,134,.3);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:none}
/* gold banner (final ready) */
.cf-finwrap{position:relative;flex:1 1 520px;min-width:0;margin:0 18px}
.cf-tail{position:absolute;top:12px;bottom:-12px;width:36px;background:linear-gradient(180deg,#c9a24a 0%,#9c7a30 100%)}
.cf-tail.l{left:-24px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,34% 50%)}
.cf-tail.r{right:-24px;clip-path:polygon(0 0,100% 0,66% 50%,100% 100%,0 100%)}
.cf-finface{position:relative;display:flex;align-items:center;gap:16px;min-height:72px;padding:10px 12px 10px 16px;box-sizing:border-box;overflow:hidden;background:linear-gradient(180deg,#f8e8b3 0%,#ebcd78 48%,#cfa851 100%);box-shadow:inset 0 1px 0 rgba(255,251,230,.9),inset 0 0 0 1px #8a6420,inset 0 -3px 0 rgba(94,74,28,.22),0 0 0 3px rgba(239,212,134,.3),0 14px 28px rgba(60,40,10,.4);color:#2a1f0b}
.cf-shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,rgba(255,255,255,0) 35%,rgba(255,255,255,.6) 50%,rgba(255,255,255,0) 65%);transform:translateX(-110%);animation:cfShine 1.3s .3s cubic-bezier(.4,0,.2,1) both}
.cf-medal{position:relative;display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c9 0%,#d9b85d 45%,#7a5d22 100%);box-shadow:inset 0 0 0 2px #5e4a1c,0 3px 6px rgba(60,40,10,.45);color:#3b2a0c}
.cf-medal svg{width:24px;height:24px}
.cf-fintext{position:relative;flex:1;min-width:0}
.cf-finkick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.2em;color:#5e4a1c}
.cf-fintitle{margin:1px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:23px;font-weight:700;line-height:1.1;color:#2a1f0b}
.cf-finsub{margin:2px 0 0;font-size:15px;font-style:italic;line-height:1.25;color:#3d2e10}
.cf-finbtn{position:relative;flex:none;min-height:48px;padding:0 20px;text-transform:uppercase}
.cf-f0{animation:cfFinIn .55s 1.3s cubic-bezier(.2,.8,.2,1) backwards}
.cf-f0 .cf-shine{animation-delay:1.7s}
.cf-f1{animation:cfFinIn .5s cubic-bezier(.2,.8,.2,1) backwards}
/* body: index tabs + page */
.cf-body{position:relative;display:flex;flex:1;min-height:0;padding:14px 22px 22px 16px}
.cf-side{display:flex;flex-direction:column;flex:none;width:232px;margin-right:-16px;padding-top:14px}
.cf-tabs{display:flex;flex-direction:column;gap:5px}
.cf-tab{position:relative;z-index:1;display:grid;grid-template-columns:22px minmax(0,1fr) 16px;align-items:center;column-gap:8px;min-height:58px;margin:0 10px 0 12px;padding:7px 12px;box-sizing:border-box;border:0;border-radius:9px 0 0 9px;background:#e9dcc0;color:#2a2318;font-family:'Crimson Text',Georgia,serif;text-align:left;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,250,235,.6),0 2px 0 rgba(94,74,28,.22),0 6px 12px rgba(60,40,10,.16);transition:margin .2s cubic-bezier(.4,0,.2,1),background-color .15s}
.cf-tab:hover{margin-left:6px;background:#efe4cb}
.cf-tab[aria-selected="true"]{z-index:3;margin:0 -6px 0 0;background:#fbf6ed;cursor:default;box-shadow:inset 0 1px 0 #fff,-4px 6px 14px rgba(60,40,10,.2)}
.cf-tab:focus-visible{outline:2px solid #9e3f2a;outline-offset:-5px}
.cf-tabno{align-self:start;margin-top:4px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.04em;color:#8c3624}
.cf-tabtxt{min-width:0}
.cf-tabname{display:block;font-size:17px;font-weight:600;line-height:1.15;color:#07111f;white-space:nowrap}
.cf-tabsub{display:block;margin-top:3px;overflow:hidden;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.1em;line-height:1.2;color:#4f4536;text-overflow:ellipsis;white-space:nowrap}
.cf-tabst{display:grid;place-items:center;width:16px;height:16px;color:#4f4536}
.cf-tabst svg{width:15px;height:15px}
.cf-tabst .cf-tabok{color:#2f6363}
.cf-dot{display:block;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);animation:cfPulse 1.8s ease-in-out infinite}
.cf-team{margin:auto 14px 0 12px;padding:12px 12px 12px;background:rgba(251,246,237,.4);box-shadow:inset 0 0 0 1px rgba(94,74,28,.3)}
.cf-member{display:flex;align-items:center;gap:10px;margin-top:9px}
.cf-mtxt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.cf-mtxt b{font-size:16px;font-weight:600;color:#07111f}
.cf-mtxt span{font-size:15px;font-style:italic;color:#3b3328}
.cf-sw{align-self:stretch;width:4px;margin-left:auto;border-radius:2px}
.cf-sw.teal{background:#2f6363}
.cf-sw.rust{background:#7a3f27}
.cf-legend{display:flex;flex-direction:column;gap:7px;margin:12px 0 0;padding-top:10px;border-top:1px dashed rgba(79,69,54,.45)}
.cf-lrow{display:flex;align-items:center;gap:8px;font-size:15px;line-height:1.2;color:#2a2318}
.cf-pagewrap{position:relative;z-index:2;display:flex;flex:1;min-width:0}
.cf-pagewrap::before,.cf-pagewrap::after{content:"";position:absolute;inset:0;z-index:-1;box-shadow:0 1px 0 rgba(0,0,0,.18),0 10px 20px rgba(0,0,0,.2)}
.cf-pagewrap::before{background:#e6dac0;transform:translate(10px,9px) rotate(.8deg)}
.cf-pagewrap::after{background:#f1e8d6;transform:translate(5px,5px) rotate(.35deg)}
.cf-clip{position:absolute;z-index:4;top:-20px;right:64px;width:20px;height:58px;overflow:visible;transform:rotate(9deg);filter:drop-shadow(1px 3px 2px rgba(0,0,0,.35));pointer-events:none}
.cf-page{position:relative;flex:1;min-width:0;overflow-y:auto;overscroll-behavior:contain;box-sizing:border-box;padding:20px 30px 32px 56px;background:linear-gradient(90deg,transparent 30px,rgba(182,64,48,.5) 30px,rgba(182,64,48,.5) 31.5px,transparent 31.5px),#fbf6ed;box-shadow:-3px 0 8px rgba(60,40,10,.26),0 1px 0 rgba(0,0,0,.2),0 16px 32px rgba(0,0,0,.3);scrollbar-width:thin;scrollbar-color:rgba(91,82,72,.45) transparent}
.cf-page:focus-visible{outline:2px solid #9e3f2a;outline-offset:-4px}
.cf-inner{min-width:0}
/* page heading (per tab) */
.cf-ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin:0 0 16px;padding-bottom:10px;border-bottom:1.5px solid rgba(182,64,48,.55)}
.cf-kick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.cf-h2{margin:3px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;line-height:1.08;color:#07111f}
.cf-h3{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.15;color:#07111f}
.cf-phnote{display:flex;align-items:center;gap:7px;margin:0;font-size:16px;font-style:italic;line-height:1.3;color:#3b3328}
.cf-phnote svg{flex:none;width:16px;height:16px;color:#5b5248}
.cf-phstate{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
/* chips / tags */
.cf-tag,.cf-mark{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:0 7px;box-sizing:border-box;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1;white-space:nowrap}
.cf-tag svg,.cf-mark svg{flex:none;width:12px;height:12px}
.cf-tag.mine{color:#2f6363;box-shadow:inset 0 0 0 1px rgba(47,99,99,.7)}
.cf-tag.mine.shared{background:#2f6363;color:#fbf6ed;box-shadow:none}
.cf-tag.partner{color:#7a3f27;box-shadow:inset 0 0 0 1px rgba(122,63,39,.7)}
.cf-tag.partner.shared{background:#7a3f27;color:#fbf6ed;box-shadow:none}
.cf-mark.key{background:#9e3f2a;color:#fbf6ed}
.cf-mark.photo{background:#0d1014;color:#efd486}
.cf-go{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;color:#8c3624;text-decoration:none;text-transform:uppercase}
.cf-go:hover{color:#07111f}
.cf-go svg{flex:none;width:15px;height:15px;transition:transform .15s}
.cf-go:hover svg{transform:translateX(3px)}
.cf-go:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.cf-up{text-transform:uppercase}
.cf-live{margin:0;font-size:15px;line-height:1.3}
.cf-live.is-ok{color:#1f4545}
.cf-live.is-err{color:#8c3624}
/* tab 1 · evidence */
.cf-evgrid{display:grid;grid-template-columns:minmax(0,.74fr) minmax(0,1fr);gap:26px;align-items:start}
.cf-evlist{margin:0;padding:0;list-style:none;border-top:1px solid rgba(79,154,154,.4)}
.cf-ev{display:grid;grid-template-columns:46px minmax(0,1fr) 16px;align-items:center;gap:12px;width:100%;min-height:58px;padding:6px 6px 6px 6px;box-sizing:border-box;border:0;border-bottom:1px solid rgba(79,154,154,.4);background:transparent;color:#2a2318;font-family:'Crimson Text',Georgia,serif;text-align:left;cursor:pointer;transition:background-color .15s}
.cf-ev:hover{background:rgba(239,212,134,.26)}
.cf-ev[aria-pressed="true"]{background:rgba(239,212,134,.42);box-shadow:inset 3px 0 0 #9e3f2a}
.cf-ev:focus-visible{outline:2px solid #9e3f2a;outline-offset:-2px}
.cf-evtile{position:relative;display:grid;place-items:center;flex:none;width:46px;height:46px;background:radial-gradient(ellipse at 50% 40%,#2e231c 0%,#15110e 75%);box-shadow:inset 0 0 0 1px rgba(239,212,134,.2)}
.cf-evtile svg{width:38px;height:38px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.cf-evtile.is-key{box-shadow:inset 0 0 0 1.5px #c7a24b}
.cf-evtile.is-key::after{content:"";position:absolute;top:-5px;right:-5px;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);box-shadow:0 2px 3px rgba(0,0,0,.45)}
.cf-evtile.sm{width:34px;height:34px}
.cf-evtile.sm svg{width:28px;height:28px}
.cf-evtxt{min-width:0}
.cf-evname{display:block;font-size:17px;font-weight:600;line-height:1.2;color:#07111f}
.cf-evtags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px}
.cf-evgo{width:16px;height:16px;color:#9e3f2a;opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s}
.cf-ev:hover .cf-evgo,.cf-ev[aria-pressed="true"] .cf-evgo{opacity:1;transform:none}
.cf-seen{display:flex;gap:11px;align-items:flex-start;margin:14px 0 0;padding:10px 13px;background:rgba(79,154,154,.12);box-shadow:inset 3px 0 0 #2f6363;font-size:15px;line-height:1.35;color:#1f3a3a}
.cf-seen svg{flex:none;width:20px;height:20px;margin-top:1px;color:#2f6363}
.cf-seen strong{display:block;margin-bottom:1px;font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:#173535}
.cf-seen q{font-style:italic}
.cf-detwrap{position:relative;min-width:0;scroll-margin-top:84px}
.cf-det{position:relative;padding:16px 18px 18px;background:#e9dcc0;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 16px 32px rgba(60,40,10,.3);transform:rotate(.5deg)}
.cf-plate{position:relative;display:grid;place-items:center;height:172px;margin-bottom:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#3b2c23 0%,#1a1412 72%);box-shadow:inset 0 0 0 1px rgba(239,212,134,.25),inset 0 0 30px rgba(0,0,0,.5)}
.cf-plno{position:absolute;top:9px;left:9px;z-index:3;padding:3px 7px;background:rgba(13,16,20,.85);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#efd486}
.cf-bag{position:relative;width:226px;height:144px;border-radius:5px;transform:rotate(-3deg);background:linear-gradient(155deg,rgba(236,244,247,.34) 0%,rgba(205,222,230,.16) 42%,rgba(236,244,247,.3) 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.42),inset 0 0 22px rgba(255,255,255,.12),0 12px 20px rgba(0,0,0,.5)}
.cf-bag::before{content:"";position:absolute;left:6px;right:6px;top:31px;height:3px;border-radius:2px;background:rgba(255,255,255,.5);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.cf-bag::after{content:"";position:absolute;inset:0;border-radius:5px;background:linear-gradient(115deg,rgba(255,255,255,0) 50%,rgba(255,255,255,.2) 58%,rgba(255,255,255,0) 68%);pointer-events:none}
.cf-bagtop{position:absolute;left:8px;right:8px;top:6px;display:flex;align-items:center;justify-content:space-between;height:20px;padding:0 7px;background:rgba(251,246,237,.94);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;color:#9e3f2a}
.cf-bagobj{position:absolute;left:50%;top:33px;width:110px;height:110px;margin-left:-55px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.45))}
.cf-polar{position:relative;width:214px;margin:0;padding:8px 8px 0;box-sizing:border-box;background:#fbf6ed;box-shadow:0 1px 0 rgba(0,0,0,.25),0 14px 24px rgba(0,0,0,.55);transform:rotate(-2.5deg)}
.cf-crop{position:relative;height:114px;overflow:hidden;background:#1a1d22}
.cf-crop img{position:absolute;left:50%;top:50%;width:800%;max-width:none;height:auto;transform:translate(-27.9%,-41.3%);image-rendering:pixelated}
.cf-ring{position:absolute;left:50%;top:50%;width:64px;height:92px;margin:-46px 0 0 -32px;overflow:visible}
.cf-polar figcaption{padding:6px 2px 8px;font-size:15px;font-style:italic;line-height:1.2;color:#2a2318;text-align:center}
.cf-tape{position:absolute;z-index:2;width:58px;height:18px;background:rgba(233,220,192,.78);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.cf-tape.a{top:-7px;left:-18px;transform:rotate(-30deg)}
.cf-tape.b{top:-7px;right:-18px;transform:rotate(28deg)}
.cf-keystamp{position:absolute;right:12px;bottom:14px;z-index:3;padding:4px 9px;border:3px double #e0735e;background:rgba(158,63,42,.16);color:#f0a08e;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;white-space:nowrap;transform:rotate(var(--sr,-9deg))}
.cf-postmark{position:absolute;left:14px;bottom:12px;z-index:3;display:grid;place-items:center;width:66px;height:66px;box-sizing:border-box;border:2px solid #8fd0cf;border-radius:50%;box-shadow:inset 0 0 0 3px rgba(13,16,20,.4),inset 0 0 0 4px #8fd0cf;color:#8fd0cf;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;line-height:1.25;text-align:center;transform:rotate(var(--sr,-12deg))}
.cf-dettitle{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;line-height:1.12;color:#07111f}
.cf-det .cf-evtags{margin-top:8px}
.cf-detdesc{margin:9px 0 0;font-size:17px;line-height:1.4;color:#2a2318}
.cf-meta{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0 0;padding-top:8px;border-top:1px dashed rgba(79,69,54,.45)}
.cf-meta div{display:flex;align-items:center;gap:6px;min-width:0}
.cf-meta dt{display:flex;color:#4f4536}
.cf-meta dt svg{width:16px;height:16px}
.cf-meta dd{margin:0;font-size:16px;color:#2a2318}
.cf-meta dd.num{font-family:'Source Code Pro',ui-monospace,monospace;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.cf-insp{margin:10px 0 0;padding:8px 12px 9px;background:rgba(251,246,237,.62);box-shadow:inset 3px 0 0 #2f6363;font-size:16px;font-style:italic;line-height:1.35;color:#2a2318}
.cf-insp b{display:block;margin-bottom:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-style:normal;font-weight:700;letter-spacing:.14em;color:#2f6363}
.cf-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.cf-acts .s-btn{flex:1 1 auto;gap:8px;min-height:44px;padding:0 12px;font-size:11px;letter-spacing:.1em}
.cf-acts .s-btn svg{flex:none;width:16px;height:16px}
.cf-sharedline{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:16px;line-height:1.3;color:#1f4545;outline:none}
.cf-sharedline svg{flex:none;width:18px;height:18px}
.cf-confirm{margin-top:10px;padding:11px 12px;background:#fbf6ed;box-shadow:inset 0 0 0 1.5px rgba(47,99,99,.55);animation:cfDrop .3s cubic-bezier(.2,.8,.2,1) both}
.cf-confirm p{margin:0;font-size:16px;line-height:1.35;color:#2a2318}
.cf-confbtns{display:flex;gap:8px;margin-top:9px}
.cf-back{display:none}
/* tab 2 · testimony */
.cf-wgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 30px;align-items:start}
.cf-wcol{display:flex;flex-direction:column;gap:26px;min-width:0}
.cf-wit{display:flex;flex-direction:column;gap:12px;min-width:0}
.cf-who{display:flex;align-items:center;gap:13px}
.cf-mono{display:grid;place-items:center;flex:none;width:46px;height:46px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 3px #fbf6ed,0 0 0 4px rgba(26,44,66,.4),0 6px 10px rgba(7,17,31,.2);color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700}
.cf-whoname{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.1;color:#07111f}
.cf-whorole{margin:3px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#5b5248}
.cf-whonote{margin:0;font-size:15px;font-style:italic;line-height:1.35;color:#3b3328}
.cf-slip{position:relative;margin:0;padding:13px 16px 11px 20px;background:#fffaf0;box-shadow:inset 3px 0 0 #7a3f27,0 1px 0 rgba(0,0,0,.12),0 8px 18px rgba(60,40,10,.13);transform:rotate(-.35deg)}
.cf-slip.tilt{transform:rotate(.35deg)}
.cf-quote{position:relative;margin:0;padding-left:18px;font-size:19px;font-style:italic;line-height:1.35;color:#1d1a14}
.cf-quote::before{content:"“";position:absolute;left:-2px;top:-7px;font-family:'Playfair Display',Georgia,serif;font-size:38px;font-style:normal;line-height:1;color:rgba(122,63,39,.55)}
.cf-slip.is-broken .cf-qt{text-decoration:line-through;text-decoration-color:rgba(158,63,42,.9);text-decoration-thickness:2px}
.cf-slipmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:9px}
.cf-sliptime{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.06em;color:#5b5248}
.cf-slipstamp{position:absolute;right:-8px;top:-15px;z-index:2;padding:3px 9px;border:3px double #9e3f2a;background:rgba(251,246,237,.35);color:#9e3f2a;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;white-space:nowrap;transform:rotate(var(--sr,-7deg));mix-blend-mode:multiply}
.cf-refute{display:flex;align-items:center;gap:6px;margin:7px 0 0;font-size:15px;line-height:1.3;color:#6b2a1c}
.cf-refute svg{flex:none;width:15px;height:15px}
.cf-empty{margin:0;padding:12px 14px;border-radius:2px;background:repeating-linear-gradient(135deg,rgba(91,82,72,.06) 0 6px,rgba(91,82,72,0) 6px 12px);box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.3);font-size:16px;font-style:italic;color:#5b5248}
.cf-pnote{display:flex;gap:12px;align-items:flex-start;margin:26px 0 0;padding:12px 14px;background:rgba(182,107,77,.12);box-shadow:inset 3px 0 0 #7a3f27;font-size:16px;line-height:1.35;color:#3b2418}
.cf-pnote svg{flex:none;width:20px;height:20px;margin-top:1px;color:#7a3f27}
.cf-pnote strong{display:block;margin-bottom:2px;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;color:#5c2c18}
/* cork inset boards */
.cf-cork{position:relative;isolation:isolate;overflow:hidden;border-radius:2px;box-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 14px rgba(60,40,10,.2)}
.cf-cork::after{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 0 3px #4a3020,inset 0 0 0 4px #20150d,inset 0 8px 22px rgba(0,0,0,.55)}
.cf-corkbg{position:absolute;inset:0;z-index:-1;display:block;width:100%;height:100%}
.cf-bpin{position:absolute;z-index:4;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.cf-bpin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.cf-bpin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.cf-bpin.dull{background:radial-gradient(circle at 35% 30%,#d9d2c6 0%,#8a8277 45%,#3b3631 100%)}
/* tab 3 · contradictions */
.cf-board{padding:34px 26px 26px}
.cf-rstr{position:absolute;left:0;top:0;z-index:3;width:100%;height:70px;pointer-events:none;overflow:visible}
.cf-rounds{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px;align-items:start}
.cf-round{position:relative;padding:22px 18px 16px 36px;background:#fbf6ed;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 18px 34px rgba(0,0,0,.55);transform:rotate(var(--r,0deg))}
.cf-round::before{content:"";position:absolute;top:0;bottom:0;left:22px;width:1.5px;background:rgba(182,64,48,.5)}
.cf-cpin{display:none}
.cf-rhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cf-rno{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.22em;color:#5b5248}
.cf-rstamp{display:inline-block;padding:3px 10px;border:3px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.18em;white-space:nowrap;transform:rotate(var(--sr,-7deg));mix-blend-mode:multiply}
.cf-rstamp.ok{color:#2f6363}
.cf-rstamp.ready{color:#8a6420}
.cf-rq{margin:9px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;line-height:1.25;color:#07111f}
.cf-pair{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(0,1fr);align-items:stretch;margin-top:12px}
.cf-slot{min-width:0;padding:8px 10px 9px;background:rgba(255,255,255,.66);box-shadow:inset 0 0 0 1px rgba(91,82,72,.28)}
.cf-slot.t{box-shadow:inset 3px 0 0 #7a3f27,inset 0 0 0 1px rgba(91,82,72,.28)}
.cf-slot.e{box-shadow:inset 3px 0 0 #2f6363,inset 0 0 0 1px rgba(91,82,72,.28)}
.cf-slot.wait{background:transparent;box-shadow:none;outline:1.5px dashed rgba(91,82,72,.5);outline-offset:-1.5px}
.cf-slotk{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#5b5248}
.cf-slot.t .cf-slotk{color:#7a3f27}
.cf-slot.e .cf-slotk{color:#2f6363}
.cf-slotq{margin:4px 0 0;font-size:16px;font-style:italic;line-height:1.3;color:#1d1a14}
.cf-slote{display:flex;align-items:center;gap:8px;margin:6px 0 0;font-size:16px;font-weight:600;line-height:1.2;color:#07111f}
.cf-slotw{display:flex;align-items:center;gap:7px;margin:6px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#5b5248}
.cf-break{position:relative;display:grid;place-items:center;min-height:40px}
.cf-break.q b{position:absolute;left:50%;top:50%;display:grid;place-items:center;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fbf6ed;box-shadow:inset 0 0 0 1.6px #8a6420;color:#8a6420;font-family:'Playfair Display',Georgia,serif;font-size:12px;font-weight:700;line-height:1}
.cf-break svg{width:26px;height:40px;overflow:visible}
.cf-reveal{display:inline-block;margin:13px 0 0;padding:6px 12px;background:#0d1014;color:#efd486;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.16em;transform:rotate(-1deg);box-shadow:0 6px 12px rgba(0,0,0,.25)}
.cf-result{display:flex;align-items:flex-start;gap:8px;margin:10px 0 0;font-size:16px;line-height:1.3;color:#2a2318}
.cf-result svg{flex:none;width:16px;height:16px;margin-top:2px;color:#2f6363}
.cf-result b{font-weight:600;color:#1f4545}
.cf-sign{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-top:12px;padding-top:10px;border-top:1px dashed rgba(91,82,72,.45)}
.cf-signer{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:#2a2318}
.cf-okc{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#2f6363;color:#fbf6ed}
.cf-okc svg{width:12px;height:12px}
.cf-signtime{margin-left:auto;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.06em;color:#5b5248}
.cf-mm{display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:11px;font-weight:700}
.cf-mm.rust{background:#3a1d12;box-shadow:inset 0 0 0 1px #c98a63;color:#f2c9a9}
.cf-mm+.cf-mm{margin-left:-9px}
.cf-hidden{margin:10px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#5b5248}
.cf-rbtn{width:100%;margin-top:12px;text-transform:uppercase}
.cf-rbtn svg{flex:none;width:17px;height:17px}
.cf-facts{position:relative;margin-top:22px;padding:14px 18px 6px 46px;background:#f4efe3;box-shadow:inset 0 0 0 1px rgba(91,82,72,.22)}
.cf-facts::before{content:"";position:absolute;top:0;bottom:0;left:26px;width:1.5px;background:rgba(182,64,48,.5);box-shadow:4px 0 0 rgba(182,64,48,.5)}
.cf-factlist{margin:8px 0 0;padding:0;list-style:none}
.cf-fact{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:11px 0;border-top:1px solid rgba(79,154,154,.4)}
.cf-factseal{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#2f6363;color:#fbf6ed}
.cf-factseal svg{width:15px;height:15px}
.cf-factname{margin:0;font-size:18px;font-weight:600;line-height:1.2;color:#07111f}
.cf-factdesc{margin:3px 0 0;font-size:16px;line-height:1.35;color:#3b3328}
.cf-facttag{padding-top:3px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;color:#5b5248;white-space:nowrap}
.cf-cont{display:flex;align-items:center;gap:10px;margin:16px 0 0;font-size:16px;font-style:italic;line-height:1.35;color:#3b3328}
.cf-cont svg{flex:none;width:18px;height:18px;color:#8c3624}
/* tab 4 · deduction */
.cf-pstamp{display:inline-block;padding:4px 11px;border:3px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.18em;white-space:nowrap;transform:rotate(var(--sr,-6deg));mix-blend-mode:multiply}
.cf-pstamp.lock{color:#5f574b}
.cf-pstamp.ok{color:#2f6363}
.cf-q{margin:0;max-width:780px;font-family:'Playfair Display',Georgia,serif;font-size:22px;font-style:italic;font-weight:400;line-height:1.3;color:#07111f}
.cf-tl{margin-top:16px;padding:0 10px 18px}
.cf-tlstr{position:absolute;left:0;top:0;z-index:1;width:100%;height:60px;pointer-events:none;overflow:visible}
.cf-tlitems{position:relative;z-index:2;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin:0;padding:0;list-style:none}
.cf-tli{position:relative;display:flex;flex-direction:column;align-items:center;min-width:0;padding-top:24px}
.cf-tlpin{position:relative;z-index:2;flex:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);box-shadow:0 3px 4px rgba(0,0,0,.55)}
.cf-twine{flex:none;display:block;width:2px;height:20px;margin:-2px 0 -6px;background:#cdb98d;box-shadow:1px 1px 0 rgba(0,0,0,.35)}
.cf-tltag{position:relative;display:flex;flex-direction:column;align-items:center;width:calc(100% - 14px);max-width:132px;padding:18px 9px 10px;box-sizing:border-box;text-align:center;background:linear-gradient(135deg,transparent 9px,#e9dcc0 9.5px) left top/51% 100% no-repeat,linear-gradient(225deg,transparent 9px,#e9dcc0 9.5px) right top/51% 100% no-repeat;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)) drop-shadow(0 8px 8px rgba(0,0,0,.45));transform:rotate(var(--r,0deg));transform-origin:50% 0}
.cf-tlhole{position:absolute;top:6px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1d1510;box-shadow:0 0 0 2px #c7a24b}
.cf-tltime{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:17px;font-weight:700;line-height:1.1;color:#07111f;font-variant-numeric:tabular-nums}
.cf-tlsrc{display:inline-block;margin-top:4px;padding:2px 5px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;line-height:1.1}
.cf-tlsrc.t{color:#7a3f27;box-shadow:inset 0 0 0 1px rgba(122,63,39,.6)}
.cf-tlsrc.e{color:#2f6363;box-shadow:inset 0 0 0 1px rgba(47,99,99,.6)}
.cf-tlcap{display:block;margin-top:6px;font-size:15px;line-height:1.2;color:#2a2318}
.cf-optblock{margin-top:18px}
.cf-opts{display:flex;flex-direction:column;gap:8px;margin:8px 0 0;padding:0;list-style:none}
.cf-opt{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr) 22px;align-items:center;gap:12px;min-height:54px;padding:8px 14px 8px 12px;box-sizing:border-box;border-radius:2px;font-size:17px;line-height:1.3}
.cf-opt.is-locked{background:repeating-linear-gradient(135deg,rgba(91,82,72,.06) 0 6px,rgba(91,82,72,0) 6px 12px),rgba(244,239,227,.75);box-shadow:inset 0 0 0 1px rgba(91,82,72,.3);color:#4f4536}
.cf-opt.is-picked{background:rgba(79,154,154,.14);box-shadow:inset 0 0 0 2px #2f6363;color:#07111f}
.cf-opt.is-out{background:rgba(244,239,227,.5);box-shadow:inset 0 0 0 1px rgba(91,82,72,.22);color:#5b5248}
.cf-optltr{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;font-family:'Playfair Display',Georgia,serif;font-size:15px;font-weight:700}
.cf-opt.is-picked .cf-optltr{background:#2f6363;color:#fbf6ed;box-shadow:none}
.cf-optic{width:18px;height:18px}
.cf-optic.ok{display:none;color:#2f6363}

.cf-opt.is-picked .cf-optic.lk,.cf-opt.is-out .cf-optic{display:none}
.cf-lockline{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#4f4536}
.cf-lockline svg{flex:none;width:16px;height:16px}
.cf-hint{display:flex;gap:12px;align-items:flex-start;margin-top:18px;padding:12px 14px;background:rgba(239,212,134,.32);box-shadow:inset 3px 0 0 #8a6420}
.cf-hint svg{flex:none;width:22px;height:22px;color:#6b4e16}
.cf-hint .cf-mini{color:#5e4a1c}
.cf-hint p.t{margin:3px 0 0;font-size:16px;line-height:1.35;color:#2a2318}
/* tab 5 · map */
.cf-mapboard{padding:18px 18px 16px}
.cf-mapin{position:relative;aspect-ratio:1000/610}
.cf-mapstr{position:absolute;inset:0;z-index:2;width:100%;height:100%;pointer-events:none;overflow:visible}
.cf-place{position:absolute;z-index:1;margin:0}
.cf-place.p1{left:2%;top:7%;width:37%}
.cf-place.p2{left:41%;top:28%;width:36%}
.cf-place.p3{left:79.5%;top:9%;width:19%}
.cf-photo{position:relative;padding:7px;background:#fbf6ed;box-shadow:0 1px 0 rgba(0,0,0,.25),0 16px 28px rgba(0,0,0,.6)}
.cf-photo img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated}
.p1 .cf-photo{transform:rotate(-2.2deg)}
.p2 .cf-photo{transform:rotate(1.6deg)}
.p3 .cf-photo{transform:rotate(2.4deg)}
.cf-unknown{display:grid;place-items:center;aspect-ratio:4/3;box-sizing:border-box;border:2px dashed rgba(91,82,72,.55);background:repeating-linear-gradient(135deg,rgba(91,82,72,.07) 0 7px,rgba(91,82,72,0) 7px 14px),#efe7d6;color:#5b5248}
.cf-unknown span{font-family:'Playfair Display',Georgia,serif;font-size:48px;font-weight:700;line-height:1}
.cf-plabel{position:relative;margin:10px 8px 0;padding:9px 11px 10px;background:#e9dcc0;box-shadow:0 1px 0 rgba(0,0,0,.2),0 8px 14px rgba(0,0,0,.45)}
.p1 .cf-plabel{transform:rotate(.8deg)}
.p2 .cf-plabel{transform:rotate(-.6deg)}
.p3 .cf-plabel{transform:rotate(-1deg)}
.cf-plname{margin:0;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;color:#07111f}
.cf-plact{margin:3px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.12em;line-height:1.3;color:#4f4536}
.cf-plrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:7px}
.cf-pst{display:inline-flex;align-items:center;min-height:22px;padding:0 7px;box-sizing:border-box;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.cf-pst.done{background:#2f6363;color:#fbf6ed}
.cf-pst.now{background:#9e3f2a;color:#fbf6ed}
.cf-pst.open{color:#2f6363;box-shadow:inset 0 0 0 1px rgba(47,99,99,.7)}
.cf-pst.lock{color:#4f4536;box-shadow:inset 0 0 0 1px rgba(79,69,54,.6)}
.cf-plline{margin:6px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#2a2318}
.cf-plwho{display:inline-flex;align-items:center;gap:7px;font-size:15px;color:#2a2318}
.cf-exit{position:absolute;z-index:3;display:flex;flex-direction:column;align-items:flex-start;padding:4px 9px 5px;background:#0d1014;box-shadow:0 6px 12px rgba(0,0,0,.45);white-space:nowrap;transform:translate(-50%,-50%) rotate(-4deg)}
.cf-exit b{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#efd486}
.cf-exit span{font-size:15px;font-style:italic;line-height:1.15;color:#fbf6ed}
.cf-mapkey{position:absolute;left:2%;bottom:2.5%;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:36%;margin:0;padding:7px 8px;box-sizing:border-box;list-style:none;background:rgba(13,16,20,.86);box-shadow:inset 0 0 0 1px rgba(239,212,134,.2),0 8px 16px rgba(0,0,0,.4)}
.cf-mapkeyk{margin-right:4px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#efd486}
.cf-mapkey .cf-pst.open{color:#8fd0cf;box-shadow:inset 0 0 0 1px rgba(143,208,207,.7)}
.cf-mapkey .cf-pst.lock{color:#cfc4b1;box-shadow:inset 0 0 0 1px rgba(207,196,177,.6)}
/* tab 6 · coordination log */
.cf-loggrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:28px;align-items:start}
.cf-logwrap{position:relative;min-width:0}
.cf-logline{position:absolute;left:82px;top:28px;bottom:16px;width:2px;background:#bf3b2c;box-shadow:2px 4px 0 rgba(0,0,0,.12);transform-origin:50% 0;animation:cfGrow .9s .15s cubic-bezier(.5,0,.3,1) both}
.cf-log{position:relative;margin:0;padding:0;list-style:none}
.cf-logsep{margin:16px 0 2px;padding:0 0 4px 108px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.16em;color:#8c3624}
.cf-logsep.first{margin-top:0}
.cf-logrow{display:grid;grid-template-columns:66px 32px 54px minmax(0,1fr);align-items:center;min-height:46px;padding:3px 0;border-bottom:1px solid rgba(79,154,154,.32)}
.cf-logrow.is-new{background:linear-gradient(90deg,rgba(239,212,134,0),rgba(239,212,134,.34) 30%,rgba(239,212,134,.34))}
.cf-logt{padding-right:4px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:#07111f;text-align:right}
.cf-logpin{justify-self:center;position:relative;z-index:1;width:12px;height:12px;border-radius:50%;box-shadow:0 2px 3px rgba(0,0,0,.4)}
.cf-logpin.me{background:radial-gradient(circle at 35% 30%,#bfe6e2 0%,#2f6363 50%,#173535 100%)}
.cf-logpin.tv{background:radial-gradient(circle at 35% 30%,#f1c3a6 0%,#7a3f27 50%,#3d1d10 100%)}
.cf-logpin.team{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.cf-logwho{display:flex;align-items:center}
.cf-logtxt{display:flex;align-items:flex-start;gap:8px;min-width:0;font-size:16px;line-height:1.3;color:#2a2318}
.cf-logtxt svg{flex:none;width:16px;height:16px;margin-top:2px;color:#5b5248}
.cf-logtxt b{font-weight:600;color:#07111f}
.cf-logrow.is-key .cf-logtxt{color:#07111f}
.cf-logrow.is-key .cf-logtxt svg{color:#8c3624}
.cf-logstats{position:relative;padding:18px 16px 14px;background:#0d1014;color:#eee4d2;box-shadow:inset 0 0 0 1px rgba(239,212,134,.18),0 14px 28px rgba(0,0,0,.35);transform:rotate(.6deg)}
.cf-logstats .cf-mini{color:#efd486}
.cf-stats{margin:8px 0 0}
.cf-stat{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(239,212,134,.16)}
.cf-stat dt{font-size:16px;color:#cfc4b1}
.cf-stat dd{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:22px;font-weight:700;color:#efd486;font-variant-numeric:tabular-nums}
.cf-whokey{display:flex;flex-direction:column;gap:9px;margin:14px 0 0;padding:0;list-style:none}
.cf-whokey li{display:flex;align-items:center;gap:9px;font-size:15px;line-height:1.2;color:#cfc4b1}
.cf-whokey .cf-logpin{flex:none}
/* tab 7 · private notebook */
.cf-nbgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;align-items:start}
.cf-nb{position:relative;padding:16px 18px 14px 0;background:#fffaf0;box-shadow:0 1px 0 rgba(0,0,0,.18),0 14px 28px rgba(60,40,10,.22);transform:rotate(-.4deg)}
.cf-nb::before{content:"";position:absolute;top:0;bottom:0;left:46px;z-index:1;width:1.5px;background:rgba(182,64,48,.55);pointer-events:none}
.cf-nb:focus-within{box-shadow:0 0 0 2px #07111f,0 14px 28px rgba(60,40,10,.22)}
.cf-nbhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:0 0 10px 62px;border-bottom:1.5px solid rgba(182,64,48,.5)}
.cf-nbkick{font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.18em;color:#8c3624}
.cf-nbarea{display:block;width:100%;min-height:302px;box-sizing:border-box;margin:0;padding:4px 14px 0 62px;border:0;border-radius:0;resize:vertical;background-color:transparent;background-image:repeating-linear-gradient(180deg,rgba(79,154,154,0) 0,rgba(79,154,154,0) 29px,rgba(79,154,154,.42) 29px,rgba(79,154,154,.42) 30px);background-attachment:local;background-position:0 -4px;font-family:'Crimson Text',Georgia,serif;font-size:19px;font-style:italic;line-height:30px;color:#1d2a3a;outline:none}
.cf-nbarea:focus{background-color:rgba(239,212,134,.14)}
.cf-nbfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 14px;padding:12px 0 0 62px;border-top:1px solid rgba(79,154,154,.42)}
.cf-nbfoot .s-btn{gap:8px;min-height:44px;padding:0 14px;font-size:11px;letter-spacing:.1em}
.cf-nbfoot .s-btn svg{flex:none;width:17px;height:17px}
.s-btn-red[aria-disabled="true"],.s-btn-red[aria-disabled="true"]:hover{cursor:default;background:#2f6363;color:#fbf6ed;box-shadow:0 3px 0 #173535}
.cf-nb .cf-live{padding:8px 0 0 62px}
.cf-nbstamp{position:absolute;right:30px;bottom:118px;z-index:2;padding:4px 11px;border:3px double #2f6363;color:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.18em;white-space:nowrap;transform:rotate(var(--sr,-10deg));mix-blend-mode:multiply;pointer-events:none}
.cf-nbside{display:flex;flex-direction:column;gap:14px;min-width:0}
.cf-priv{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:rgba(79,154,154,.12);box-shadow:inset 3px 0 0 #2f6363;font-size:16px;line-height:1.35;color:#1f3a3a}
.cf-priv svg{flex:none;width:18px;height:18px;margin-top:2px;color:#2f6363}
.cf-priv strong{display:block;margin-bottom:1px;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:700;color:#173535}
.cf-role{padding:11px 14px 12px;background:#f4efe3;box-shadow:inset 0 0 0 1px rgba(91,82,72,.25)}
.cf-role.me{box-shadow:inset 3px 0 0 #2f6363,inset 0 0 0 1px rgba(91,82,72,.25)}
.cf-role.tv{box-shadow:inset 3px 0 0 #7a3f27,inset 0 0 0 1px rgba(91,82,72,.25)}
.cf-rolename{margin:2px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:700;line-height:1.15;color:#07111f}
.cf-roledesc{margin:3px 0 0;font-size:16px;line-height:1.35;color:#3b3328}
.cf-tip{padding:2px 0 0;font-size:16px;line-height:1.35;color:#3b3328}
.cf-tip .cf-mini{color:#5b5248}
.cf-tip p.t{margin:4px 0 0}
/* motion */
@keyframes cfFade{from{opacity:0}to{opacity:1}}
@keyframes cfOpen{from{clip-path:circle(0% at 50% 100%)}to{clip-path:circle(150% at 50% 100%)}}
@keyframes cfWipeA{from{clip-path:circle(0% at -60px var(--oy,40px))}to{clip-path:circle(150% at -60px var(--oy,40px))}}
@keyframes cfWipeB{from{clip-path:circle(0% at -60px var(--oy,40px))}to{clip-path:circle(150% at -60px var(--oy,40px))}}
@keyframes cfWipeMA{from{clip-path:circle(0% at 50% -40px)}to{clip-path:circle(150% at 50% -40px)}}
@keyframes cfWipeMB{from{clip-path:circle(0% at 50% -40px)}to{clip-path:circle(150% at 50% -40px)}}
@keyframes cfPopA{from{clip-path:circle(0% at 50% 20%);transform:translateY(8px)}to{clip-path:circle(150% at 50% 20%);transform:none}}
@keyframes cfPopB{from{clip-path:circle(0% at 50% 20%);transform:translateY(8px)}to{clip-path:circle(150% at 50% 20%);transform:none}}
@keyframes cfSlam{0%{opacity:0;transform:rotate(var(--sr,-8deg)) scale(2.2)}60%{opacity:1;transform:rotate(var(--sr,-8deg)) scale(.94)}100%{opacity:1;transform:rotate(var(--sr,-8deg)) scale(1)}}
@keyframes cfDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cfGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes cfPulse{0%,100%{box-shadow:0 0 0 2px rgba(192,57,43,.28)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}
@keyframes cfShine{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
@keyframes cfFinIn{from{opacity:0;transform:translateY(-10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes cfDrop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.cf-wa{animation:cfWipeA .55s cubic-bezier(.4,0,.2,1) backwards}
.cf-wb{animation:cfWipeB .55s cubic-bezier(.4,0,.2,1) backwards}
.cf-pa{animation:cfPopA .5s cubic-bezier(.4,0,.2,1) backwards}
.cf-pb{animation:cfPopB .5s cubic-bezier(.4,0,.2,1) backwards}
.cf-slam{animation:cfSlam .45s .2s cubic-bezier(.2,.8,.2,1) both}
.cf-draw{stroke-dasharray:1;stroke-dashoffset:0;animation:cfDraw .9s .15s cubic-bezier(.5,0,.3,1) both}
.cf-first .cf-slam{animation-delay:1.6s}
.cf-first .cf-draw{animation-delay:1.45s}
.cf-first .cf-logline{animation-delay:1.45s}
@media (max-width:1279px),(max-height:879px){
  .cf-legend{display:none}
}
@media (max-height:760px){
  .cf-team{display:none}
}
@media (max-width:1180px){
  .cf-head{gap:12px 22px}
  .cf-tabsub{letter-spacing:.05em}
  .cf-side{width:218px}
  .cf-tabname{font-size:16px}
  .cf-page{padding-right:24px}
  .cf-evgrid{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px}
  .cf-loggrid{grid-template-columns:minmax(0,1fr) 222px;gap:22px}
  .cf-nbgrid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}
  .cf-board{padding:34px 18px 22px}
  .cf-rounds{gap:26px}
  .cf-round{padding:22px 14px 14px 32px}

@media (max-width:1100px) and (min-width:761px){

  .cf-close{position:absolute;top:18px;right:20px}
  .cf-acc{flex:1 1 100%;flex-direction:row;align-items:center;gap:14px;max-width:none}
  .cf-accwhy{text-align:left}
  .cf-team{display:none}
}
@media (max-width:960px){
  .cf-evgrid,.cf-wgrid,.cf-loggrid,.cf-nbgrid{grid-template-columns:minmax(0,1fr)}
  .cf-rounds{grid-template-columns:minmax(0,1fr);gap:30px}
  .cf-rstr,.cf-bpin.rs{display:none}
  .cf-cpin{display:block;top:-8px;left:50%;margin:0 0 0 -9px}
  .cf-tlstr{display:none}
  .cf-tl{padding:20px 14px 18px}
  .cf-tlitems{display:flex;flex-direction:column;gap:12px}
  .cf-tlitems::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:#bf3b2c;box-shadow:2px 4px 0 rgba(0,0,0,.35)}
  .cf-tli{flex-direction:row;align-items:center;padding-top:0}
  .cf-twine{width:16px;height:2px;margin:0}
  .cf-tltag{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:4px 10px;flex:1;width:auto;max-width:none;padding:9px 12px 9px 24px;text-align:left;background:#e9dcc0;transform:none}
  .cf-tlhole{top:50%;left:9px;margin:-4px 0 0}
  .cf-tlsrc,.cf-tlcap{margin-top:0}
  .cf-mapin{display:flex;flex-direction:column;gap:22px;aspect-ratio:auto}
  .cf-place{position:relative;left:auto !important;top:auto !important;width:auto !important}
  .cf-place.p3 .cf-unknown{aspect-ratio:16/7}
  .cf-mapstr,.cf-mpin,.cf-exit{display:none}
  .cf-mapkey{position:relative;left:auto;bottom:auto;align-self:flex-start;max-width:none}
  .cf-logstats{transform:none}
}
@media (max-width:760px){
  .cf-veil{padding:34px 8px 8px}
  .cf-sheet{height:calc(100vh - 42px);min-height:0}
