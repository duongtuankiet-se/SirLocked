<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sir Locked — Cùng xem xét</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
body{margin:0;background:#0b0806}
[hidden]{display:none !important}
.s-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:#07111f}a:hover{color:#9e3f2a}
.s-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:0 20px;box-sizing:border-box;border:0;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.18em;text-decoration:none;cursor:pointer;transition:background-color .12s,color .12s,transform .12s,box-shadow .12s}
.s-btn:active:not(:disabled){transform:translateY(2px)}
.s-btn:focus-visible{outline:2px solid #efd486;outline-offset:3px}
.s-paper .s-btn:focus-visible{outline-color:#07111f}
.s-btn-red{background:#9e3f2a;color:#fbf6ed;box-shadow:0 3px 0 #6b2a1c,0 10px 20px rgba(158,63,42,.3)}
.s-btn-red:hover:not(:disabled){background:#b2472f;color:#fbf6ed}
.s-btn-red:disabled{cursor:not-allowed;background:#5a4a3e;color:#c9bfae;box-shadow:0 3px 0 #3a3029}
.s-btn-ink{background:transparent;color:#07111f;box-shadow:inset 0 0 0 1.5px #07111f}
.s-btn-ink:hover:not(:disabled){background:#07111f;color:#fbf6ed}
.s-btn-ink:disabled{cursor:not-allowed;color:#6b6257;box-shadow:inset 0 0 0 1.5px rgba(91,82,72,.35)}
.s-btn-gold{background:transparent;color:#efd486;box-shadow:inset 0 0 0 1.5px rgba(239,212,134,.6)}
.s-btn-gold:hover:not(:disabled){background:rgba(239,212,134,.12);color:#fbf6ed}
.s-btn-sm{min-height:36px;padding:0 14px;font-size:11px}
.s-pin{position:absolute;z-index:3;width:18px;height:18px;border-radius:50%;box-shadow:0 4px 5px rgba(0,0,0,.55)}
.s-pin.red{background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%)}
.s-pin.gold{background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%)}
.s-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 8px;border-radius:2px;background:rgba(251,246,237,.7);box-shadow:inset 0 0 0 1px rgba(79,69,54,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#3b3328;white-space:nowrap}
.s-chip.dark{background:#0d1014;color:#efd486;box-shadow:none}
.s-stamp{display:inline-block;padding:6px 12px;border:4px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:12px;font-weight:700;letter-spacing:.2em;transform:rotate(-8deg);mix-blend-mode:multiply}
/* ---- in-game frame (g-) ---- */
.g-stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%)}
.g-stage img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.g-glass{background:rgba(10,12,15,.9);box-shadow:inset 0 0 0 1px rgba(239,212,134,.22),0 14px 30px rgba(0,0,0,.55)}
.g-kick{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.2em;color:#efd486}
.g-mute{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:600;letter-spacing:.16em;color:#b3a794}
.g-mono{display:grid;place-items:center;flex:none;width:34px;height:34px;border-radius:999px;background:#1a2c42;box-shadow:inset 0 0 0 1px #c7a24b;color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:14px;font-weight:700}
.g-mono.rust{background:#3a1d12;box-shadow:inset 0 0 0 1px #c98a63;color:#f2c9a9}
.g-dot{width:8px;height:8px;border-radius:999px;background:#5fb3a8;box-shadow:0 0 0 2px rgba(95,179,168,.25)}
.g-tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:70px;min-height:64px;padding:8px 12px 6px;white-space:nowrap;box-sizing:border-box;border:0;border-radius:2px;background:transparent;color:#e9dfcc;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;line-height:1.15;text-align:center;cursor:pointer;transition:background-color .15s,color .15s}
.g-tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.g-tool:hover:not(:disabled){background:rgba(239,212,134,.1);color:#efd486}
.g-tool[aria-pressed="true"]{background:#efd486 !important;color:#07111f !important}
.g-tool:disabled{cursor:not-allowed;color:#6f665a}
.g-tool:focus-visible{outline:2px solid #efd486;outline-offset:-2px}
.g-key{position:absolute;top:5px;right:7px;min-width:15px;height:15px;padding:0 3px;box-sizing:border-box;border-radius:2px;box-shadow:inset 0 0 0 1px currentColor;font-size:9px;line-height:15px;opacity:.75}
.g-sep{width:1px;align-self:stretch;margin:8px 4px;background:rgba(239,212,134,.22)}
.g-spot{position:absolute;z-index:2;display:grid;place-items:center;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;border:0;border-radius:999px;background:transparent;cursor:pointer}
.g-spot::before{content:"";position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 2px #efd486,0 0 12px rgba(239,212,134,.7),inset 0 0 8px rgba(239,212,134,.45)}
.g-spot::after{content:"";position:absolute;inset:8px;border-radius:999px;box-shadow:0 0 0 2px rgba(239,212,134,.8);animation:gPing 2.2s ease-out infinite}
.g-spot:focus-visible{outline:2px solid #fbf6ed;outline-offset:2px}
.g-tag{position:absolute;left:50%;bottom:calc(100% + 4px);transform:translateX(-50%);padding:5px 9px;white-space:nowrap;background:#0d1014;box-shadow:inset 0 0 0 1px rgba(239,212,134,.4);color:#fbf6ed;font-family:'Crimson Text',Georgia,serif;font-size:15px;line-height:1.1;pointer-events:none;opacity:0;transition:opacity .15s}
.g-tag b{display:block;font-family:'Source Code Pro',ui-monospace,monospace;font-size:9px;font-weight:700;letter-spacing:.18em;color:#efd486}
.g-spot:hover .g-tag,.g-spot:focus-visible .g-tag,.g-spot.is-hot .g-tag{opacity:1}
.g-wit{position:absolute;z-index:2;display:grid;place-items:center;width:44px;height:48px;margin:-48px 0 0 -22px;padding:0;border:0;background:transparent;cursor:pointer}
.g-wit svg{display:block;width:40px;height:44px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.g-wit:focus-visible{outline:2px solid #fbf6ed;outline-offset:2px}
.g-wit:hover .g-tag,.g-wit:focus-visible .g-tag{opacity:1}
@keyframes gPing{0%{transform:scale(1);opacity:.9}80%,100%{transform:scale(1.9);opacity:0}}
@keyframes sLens{0%{clip-path:circle(0px at 50% 46%)}16%{clip-path:circle(66px at 50% 46%)}34%{clip-path:circle(66px at 50% 46%)}100%{clip-path:circle(150% at 50% 46%)}}
@keyframes sZoom{0%,34%{transform:scale(1.14)}100%{transform:none}}
@keyframes sRim{0%{width:0;height:0;opacity:0}16%{width:132px;height:132px;opacity:1}34%{width:132px;height:132px;opacity:1}100%{width:3200px;height:3200px;opacity:0}}
.s-enter{animation:sLens 1.15s cubic-bezier(.7,0,.2,1) both}
.s-enter-zoom{transform-origin:50% 46%;animation:sZoom 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim{position:absolute;left:50%;top:46%;z-index:20;width:0;height:0;opacity:0;box-sizing:border-box;border-radius:50%;transform:translate(-50%,-50%);border:8px solid #c7a24b;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.14),rgba(255,255,255,0) 42%);box-shadow:inset 0 0 0 2px #5e4a1c,0 0 0 2px #5e4a1c,0 14px 30px rgba(0,0,0,.6);pointer-events:none;animation:sRim 1.15s cubic-bezier(.7,0,.2,1) both}
.s-rim::after{content:"";position:absolute;left:85%;top:85%;width:18px;height:90px;margin-left:-9px;border-radius:6px;background:linear-gradient(90deg,#2a1b10,#5a3b22 45%,#2a1b10);box-shadow:0 0 0 2px #5e4a1c;transform-origin:50% 0;transform:rotate(-45deg)}
/* ---- Cùng xem xét overlay (cx-) ---- */
.cx-ov{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:32px 24px;background:rgba(8,6,4,.74);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.cx-sheet{position:relative;display:flex;flex-direction:column;width:100%;max-width:1240px;height:calc(100vh - 64px);animation:cxOpen .55s .95s cubic-bezier(.4,0,.2,1) both}
.cx-tabrow{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex:none;height:42px}
.cx-tab{display:flex;align-items:center;gap:12px;min-width:0;height:36px;margin-left:22px;padding:0 24px 0 20px;box-sizing:border-box;overflow:hidden;border-radius:6px 6px 0 0;background:linear-gradient(180deg,#f1e6cc,#e9dcc0);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 1px 0 0 rgba(94,74,28,.2),inset -1px 0 0 rgba(94,74,28,.2);font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:700;letter-spacing:.2em;color:#3b3328;white-space:nowrap}
.cx-tab i{flex:none;width:1px;height:14px;background:rgba(59,51,40,.35)}
.cx-close{flex:none;align-self:center;gap:10px;margin-bottom:2px}
.cx-key{display:inline-grid;place-items:center;min-width:32px;height:19px;padding:0 4px;box-sizing:border-box;border-radius:2px;box-shadow:inset 0 0 0 1px currentColor;font-size:10px;letter-spacing:.08em;opacity:.85}
.cx-foldbg{position:absolute;left:0;right:0;top:42px;bottom:0;overflow:hidden;border-radius:0 4px 4px 4px;background:#d9c49a;box-shadow:0 1px 0 rgba(0,0,0,.2),0 30px 70px rgba(0,0,0,.65),inset 0 0 0 1px rgba(94,74,28,.3)}
.cx-foldbg svg{position:absolute;inset:0;width:100%;height:100%}
.cx-fold{position:relative;z-index:1;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;border-radius:0 4px 4px 4px}
.cx-leaf{position:relative;display:flex;flex-direction:column;gap:16px;min-width:0;padding:20px 30px 26px;background:radial-gradient(ellipse 70% 55% at 45% 38%,rgba(255,246,222,.32),rgba(255,246,222,0) 72%)}
.cx-side{position:relative;display:flex;flex-direction:column;gap:30px;min-width:0;padding:26px 24px 28px 28px;background:linear-gradient(90deg,rgba(70,48,18,.3),rgba(70,48,18,0) 30px),rgba(190,163,112,.3);box-shadow:inset 1px 0 0 rgba(94,74,28,.55)}
.cx-kick{margin:0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:11px;font-weight:600;letter-spacing:.2em;color:#5b5248}
.cx-kick.gold{color:#efd486}
.cx-mini{font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;color:#5b5248;white-space:nowrap}
.cx-up{text-transform:uppercase}
/* header */
.cx-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px 28px}
.cx-label{position:relative;flex:none;padding:10px 24px 11px 28px;background:#0d1014;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 12px 24px rgba(0,0,0,.42);transform:rotate(-1.4deg)}
.cx-label .s-pin{top:9px;left:10px;width:11px;height:11px}
.cx-h2{margin:3px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:25px;font-weight:700;line-height:1.05;letter-spacing:.1em;color:#fbf6ed}
.cx-prompt{flex:1 1 360px;min-width:0;margin:0;font-family:'Playfair Display',Georgia,serif;font-size:24px;font-weight:700;line-height:1.22;color:#07111f;text-wrap:pretty}
/* board: testimony | string + magnifier | evidence */
.cx-stage{display:flex;flex-direction:column;gap:22px;min-width:0}
.cx-board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);align-items:stretch;padding-top:14px}
.cx-col{display:flex;flex-direction:column;min-width:0}
.cx-mid{position:relative;z-index:3;align-self:stretch;min-height:262px}
.cx-link{position:absolute;left:-16px;top:0;width:222px;height:262px;overflow:visible;pointer-events:none}
.cx-link-v{display:none}
.cx-thread{fill:none;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0}
.cx-shadow{stroke:rgba(0,0,0,.42);stroke-width:2.8}
.cx-red{stroke:#bf3b2c;stroke-width:2.1}
.cx-magred{stroke:#bf3b2c;stroke-width:3.4}
.cx-pend{fill:none;stroke:rgba(122,63,39,.55);stroke-width:1.6;stroke-dasharray:4 5;stroke-linecap:round}
.cx-g-prop,.cx-g-cut,.cx-socket,.cx-qmark{display:none}
.is-propose .cx-g-taut,.is-propose .cx-pin-r{display:none}
.is-propose .cx-g-prop,.is-propose .cx-socket,.is-propose .cx-qmark{display:inline}
.is-fail .cx-g-taut{display:none}
.is-fail .cx-g-cut{display:inline}
.cx-glint{opacity:0;transform-box:fill-box;transform-origin:center}
.cx-q{position:absolute;left:12px;right:10px;top:194px;margin:0;padding:8px 12px 9px;background:#0d1014;box-shadow:0 10px 20px rgba(0,0,0,.4);color:#fbf6ed;font-size:16px;font-style:italic;line-height:1.25;text-align:center;transform:rotate(1.5deg)}
.cx-q::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1c2 0%,#c7a24b 45%,#5e4a1c 100%);box-shadow:0 2px 3px rgba(0,0,0,.5)}
.cx-bigwrap{position:absolute;z-index:4;left:50%;top:224px;transform:translate(-50%,-50%);pointer-events:none}
.cx-bigstamp{position:relative;display:block;padding:8px 14px 7px;border:5px double #9e3f2a;background:rgba(251,246,237,.32);color:#9e3f2a;font-family:'Source Code Pro',ui-monospace,monospace;font-size:27px;font-weight:700;letter-spacing:.12em;line-height:1.08;text-align:center;white-space:nowrap;transform:rotate(-8deg);mix-blend-mode:multiply}
.cx-bigstamp > span{display:block}
.cx-bigstamp.dull{border-color:#3b3328;color:#3b3328;font-size:22px;transform:rotate(5deg)}
.cx-ring{position:absolute;left:50%;top:50%;width:240px;height:240px;margin:-120px 0 0 -120px;border-radius:50%;box-shadow:0 0 0 3px rgba(239,212,134,.7),0 0 40px 10px rgba(239,212,134,.35);opacity:0}
.is-won .cx-q,.is-fail .cx-q{visibility:hidden}
/* testimony index card (tears in the payoff) */
.cx-tcard{position:relative;z-index:1;flex:1 0 auto;display:flex;flex-direction:column;margin-right:2px;transform:rotate(-1.2deg)}
.cx-tcard > .s-pin{top:-8px;left:42%;margin-left:-9px;z-index:4}
.cx-pc{filter:drop-shadow(0 1px 0 rgba(0,0,0,.2)) drop-shadow(0 18px 18px rgba(0,0,0,.42))}
.cx-pc.a{flex:1 0 auto;display:flex;flex-direction:column}
.cx-pc.b{position:absolute;inset:0;display:none}
.cx-paper{position:relative;box-sizing:border-box;padding:15px 22px 16px 44px;background:#fbf6ed;color:#07111f}
.cx-pc > .cx-paper{flex:1 0 auto;display:flex;flex-direction:column}
.cx-pc.b > .cx-paper{height:100%}
.cx-ruled{flex:1 0 auto;margin-top:12px;background:repeating-linear-gradient(180deg,transparent 0 37px,rgba(79,154,154,.42) 37px 38px)}
.cx-paper::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:1.5px;background:rgba(182,64,48,.5)}
.cx-cardhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;padding-bottom:9px;border-bottom:1.5px solid rgba(182,64,48,.55)}
.cx-tag{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:0 7px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.1em;white-space:nowrap}
.cx-tag svg{flex:none;width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cx-paper > .cx-tag,.cx-ecard > .cx-tag{align-self:flex-start;margin-top:10px}
.cx-tag.mine{background:rgba(79,154,154,.16);color:#245252;box-shadow:inset 0 0 0 1px rgba(47,99,99,.42)}
.cx-tag.mate{background:rgba(182,107,77,.14);color:#7a3f27;box-shadow:inset 0 0 0 1px rgba(122,63,39,.42)}
.cx-tag .ic-eye,.cx-tag.is-shared .ic-lock{display:none}
.cx-tag.is-shared .ic-eye{display:inline}
.cx-name{display:flex;align-items:center;gap:12px;margin-top:12px}
.cx-mono{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:50%;background:#1a2c42;box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 3px #fbf6ed,0 0 0 4px rgba(26,44,66,.35);color:#efd486;font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;letter-spacing:.02em}
.cx-mono.rust{background:#3a1d12;box-shadow:inset 0 0 0 1.5px #c98a63,0 0 0 3px #fbf6ed,0 0 0 4px rgba(122,63,39,.35);color:#f2c9a9}
.cx-mono.sm{width:28px;height:28px;font-size:11px;box-shadow:inset 0 0 0 1.5px #c7a24b}
.cx-mono.sm.rust{box-shadow:inset 0 0 0 1.5px #c98a63}
.cx-nm{display:block;font-size:17px;line-height:1.2;color:#07111f}
.cx-nm b{font-family:'Playfair Display',Georgia,serif;font-weight:700}
.cx-quote{position:relative;margin:0;padding:0 0 0 2px;font-size:27px;font-style:italic;line-height:38px;color:#07111f;text-wrap:pretty}
.cx-quote::before{content:"\201C";position:absolute;left:-30px;top:-6px;font-family:'Playfair Display',Georgia,serif;font-size:56px;font-style:normal;line-height:1;color:#9e3f2a}
.cx-strike{position:absolute;inset:-4px -6px;width:calc(100% + 12px);height:calc(100% + 8px);overflow:visible;pointer-events:none;display:none}
.cx-strike path{fill:none;stroke:#b8382b;stroke-width:3.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;mix-blend-mode:multiply}
.cx-by{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:9px;border-top:1px dashed rgba(91,82,72,.45);font-size:15px;font-style:italic;color:#5b5248}
.cx-fiber{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
.cx-fiber polyline{fill:none;stroke:#fffdf6;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.is-won .cx-pc.a > .cx-paper{clip-path:polygon(0 0,58.4% 0,61.5% 7.1%,56.5% 14.3%,59.6% 21.4%,54.7% 28.6%,57.8% 35.7%,52.8% 42.9%,55.9% 50%,51% 57.1%,54% 64.3%,49.1% 71.4%,52.2% 78.6%,47.3% 85.7%,50.3% 92.9%,45.4% 100%,0 100%)}
.is-won .cx-pc.b{display:block}
.is-won .cx-pc.b > .cx-paper{clip-path:polygon(58.4% 0,100% 0,100% 100%,45.4% 100%,50.3% 92.9%,47.3% 85.7%,52.2% 78.6%,49.1% 71.4%,54% 64.3%,51% 57.1%,55.9% 50%,52.8% 42.9%,57.8% 35.7%,54.7% 28.6%,59.6% 21.4%,56.5% 14.3%,61.5% 7.1%)}
.is-won .cx-strike,.is-won .cx-fiber{display:block}
/* evidence tag */
.cx-ecard{position:relative;z-index:1;flex:1 0 auto;display:flex;flex-direction:column;align-items:flex-start;box-sizing:border-box;margin-left:2px;padding:30px 20px 16px 22px;background:linear-gradient(135deg,transparent 14px,#e9dcc0 14.5px) left top/51% 100% no-repeat,linear-gradient(225deg,transparent 14px,#e9dcc0 14.5px) right top/51% 100% no-repeat;filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)) drop-shadow(0 16px 16px rgba(0,0,0,.42));color:#07111f;transform:rotate(1deg)}
.cx-hole{position:absolute;top:10px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#1d1510;box-shadow:0 0 0 3px #c7a24b,0 0 0 4px #5e4a1c,inset 0 2px 2px rgba(0,0,0,.7)}
.cx-twine{position:absolute;z-index:2;top:-26px;left:50%;width:30px;height:44px;margin-left:-15px;overflow:visible}
.cx-photo{position:relative;margin:12px 4px 0;padding:7px;background:#f7f2e7;box-shadow:0 1px 2px rgba(0,0,0,.28),0 8px 14px rgba(0,0,0,.2);transform:rotate(-1.3deg)}
.cx-photo > svg{display:block;width:100%;height:auto}
.cx-tape{position:absolute;z-index:2;width:62px;height:19px;background:rgba(233,220,192,.74);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.cx-anno{position:absolute;z-index:1;padding:2px 6px;background:rgba(251,246,237,.92);box-shadow:0 1px 2px rgba(0,0,0,.35);font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.08em;color:#07111f;white-space:nowrap}
.cx-etitle{margin:14px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.15;color:#07111f}
.cx-edesc{flex:1 0 auto;margin:5px 0 0;font-size:16px;line-height:1.36;color:#2a2318;text-wrap:pretty}
.cx-ecard > .cx-cardhead,.cx-ecard > .cx-photo,.cx-ecard > .cx-by{align-self:stretch}
.cx-efoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 10px;margin-top:12px;padding-top:9px;border-top:1px dashed rgba(79,69,54,.45)}
/* proposing: sealed envelope + private evidence picker */
.cx-env{position:relative;z-index:1;flex:1 0 auto;min-height:362px;margin-right:2px;background:linear-gradient(180deg,#caa66b,#bb975d);box-shadow:inset 0 0 0 1px rgba(94,64,22,.35),0 1px 0 rgba(0,0,0,.2),0 22px 40px rgba(0,0,0,.45);transform:rotate(-1.2deg)}
.cx-env > .s-pin{top:-8px;left:42%;margin-left:-9px;z-index:4}
.cx-flapwrap{position:absolute;left:0;right:0;top:0;height:116px;filter:drop-shadow(0 5px 4px rgba(60,38,10,.35))}
.cx-flap{position:absolute;inset:0;background:linear-gradient(180deg,#b58c52,#a97f47);clip-path:polygon(0 0,100% 0,50% 100%)}
.cx-tie{position:absolute;left:50%;top:92px;width:40px;height:80px;margin-left:-20px;overflow:visible}
.cx-envlabel{position:absolute;left:20px;right:20px;bottom:18px;padding:12px 14px 13px;background:#fbf6ed;box-shadow:0 1px 2px rgba(0,0,0,.28),0 6px 12px rgba(0,0,0,.14);color:#07111f}
.cx-collect{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-family:'Source Code Pro',ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.2em;color:#07111f}
.cx-collect i{width:8px;height:8px;border-radius:50%;background:#bf3b2c;box-shadow:0 0 0 3px rgba(191,59,44,.2);animation:cxBlink 1.4s ease-in-out infinite}
.cx-pick{position:relative;z-index:1;flex:1 0 auto;margin-left:2px;padding:14px 16px 10px 42px;background:#f4efe3;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 40px rgba(0,0,0,.45);transform:rotate(.7deg)}
.cx-pick > .s-pin{top:-8px;left:50%;margin-left:-9px}
.cx-margin2::before,.cx-margin2::after{content:"";position:absolute;top:0;bottom:0;width:1.5px;background:rgba(182,64,48,.5)}
.cx-margin2::before{left:24px}.cx-margin2::after{left:28px}
.cx-evlist{display:flex;flex-direction:column;margin:8px 0 0;padding:0;list-style:none}
.cx-ev{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:14px;width:100%;min-height:58px;padding:7px 8px 7px 7px;box-sizing:border-box;border:0;border-bottom:1px solid rgba(79,154,154,.4);border-radius:0;background:transparent;color:#07111f;font:inherit;text-align:left;cursor:pointer;transition:background-color .12s,box-shadow .12s}
.cx-ev:hover{background:rgba(239,212,134,.3)}
.cx-ev[aria-pressed="true"]{background:rgba(239,212,134,.48);box-shadow:inset 0 0 0 1.5px #07111f}
.cx-ev:focus-visible{outline:2px solid #9e3f2a;outline-offset:2px}
.cx-thumb{display:block;width:44px;height:44px;box-shadow:0 0 0 3px #fbf8f0,0 2px 6px rgba(0,0,0,.35)}
.cx-evt{display:block;margin-bottom:4px;font-size:16px;font-weight:600;line-height:1.2}
.cx-thumbwrap{position:relative;display:block;width:44px;height:44px}
.cx-thumbwrap::after{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3a291 0%,#c0392b 45%,#6e1a12 100%);box-shadow:0 3px 4px rgba(0,0,0,.45);opacity:0;transform:scale(0);transition:opacity .15s,transform .2s cubic-bezier(.2,.8,.2,1)}
.cx-ev[aria-pressed="true"] .cx-thumbwrap::after{opacity:1;transform:none}
/* bottom: two-player slots + actions */
.cx-bottom{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:center}
.cx-strip{position:relative;padding:12px 18px 10px 46px;background:#f4efe3;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 16px 30px rgba(0,0,0,.36);transform:rotate(-.35deg)}
.cx-striphead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;padding-bottom:7px;border-bottom:1.5px solid rgba(182,64,48,.5)}
.cx-note{font-size:15px;font-style:italic;color:#5b5248}
.cx-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.cx-slot{display:flex;align-items:center;gap:12px;min-width:0;min-height:70px;padding:8px 12px 6px 0}
.cx-slot + .cx-slot{padding-left:18px;border-left:1px dashed rgba(91,82,72,.45)}
.cx-slot .cx-mono{box-shadow:inset 0 0 0 1.5px #c7a24b,0 0 0 3px #f4efe3,0 0 0 4px rgba(26,44,66,.35)}
.cx-slot .cx-mono.rust{box-shadow:inset 0 0 0 1.5px #c98a63,0 0 0 3px #f4efe3,0 0 0 4px rgba(122,63,39,.35)}
.cx-who{display:flex;flex-direction:column;gap:1px;flex:1;min-width:0}
.cx-st{font-size:15px;font-style:italic;line-height:1.25;color:#3b3328}
.cx-ok{display:grid;place-items:center;flex:none;width:46px;height:46px;box-sizing:border-box;border:3px double #2f6363;border-radius:50%;color:#2f6363;transform:rotate(-12deg);mix-blend-mode:multiply;animation:cxStampIn .45s cubic-bezier(.2,.8,.2,1) both}
.cx-ok svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cx-spot{flex:none;width:46px;height:46px;box-sizing:border-box;border:1.5px dashed rgba(91,82,72,.55);border-radius:50%}
.cx-dots{display:inline-flex;gap:3px;margin-left:2px}
.cx-dots i{width:4px;height:4px;border-radius:50%;background:currentColor;animation:cxDots 1.2s ease-in-out infinite}
.cx-dots i:nth-child(2){animation-delay:.2s}.cx-dots i:nth-child(3){animation-delay:.4s}
.cx-status{min-height:22px;margin:4px 0 0;padding-top:6px;border-top:1px solid rgba(79,154,154,.4);font-size:15px;font-style:italic;line-height:1.3;color:#2f6363}
.cx-status:empty{min-height:0;margin:0;padding:0;border:0}
.cx-actions{display:flex;flex-direction:column;gap:10px}
.cx-actions .s-btn{width:100%}
.cx-row2{display:flex;align-items:center;gap:10px}
.cx-row2 .s-btn{flex:1;width:auto}
.cx-cancel{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 10px;border:0;border-radius:2px;background:transparent;color:#3b3328;font-family:'Crimson Text',Georgia,serif;font-size:17px;font-style:italic;text-decoration:underline;text-decoration-color:rgba(59,51,40,.45);text-underline-offset:3px;cursor:pointer}
.cx-cancel:hover{color:#9e3f2a}
.cx-cancel:focus-visible{outline:2px solid #07111f;outline-offset:2px}
.cx-ask{padding:14px 16px 16px;background:#0d1014;color:#fbf6ed;box-shadow:inset 0 0 0 1px rgba(239,212,134,.22),0 14px 28px rgba(0,0,0,.45);animation:cxWipeA .35s cubic-bezier(.4,0,.2,1) both}
.cx-ask p{margin:0 0 12px;font-size:17px;line-height:1.35}
.cx-ask .s-btn{padding:0 12px;font-size:11px}
.s-paper .cx-ask .s-btn:focus-visible{outline-color:#efd486}
/* payoff + fail */
.cx-result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:20px 30px;align-items:end}
.cx-hl{margin:8px 0 0;padding-top:10px;border-top:3px double rgba(58,52,43,.6);font-family:'Playfair Display',Georgia,serif;font-size:27px;font-weight:700;line-height:1.1;color:#07111f;text-wrap:balance}
.cx-endrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 18px;margin-top:14px}
.cx-sub{margin:6px 0 0;font-size:20px;font-style:italic;line-height:1.3;color:#3b3328}
.cx-both{display:flex;align-items:center;gap:8px}
.cx-both .cx-mono{position:relative}
.cx-both .cx-mono::after{content:"✓";position:absolute;right:-5px;bottom:-4px;display:grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#2f6363;color:#fbf6ed;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;line-height:1}
.cx-both .cx-mini{margin-left:6px;color:#1f4a4a}
.cx-fact{position:relative;margin-top:16px;padding:16px 20px 16px 44px;background:#fbf6ed;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 22px 40px rgba(0,0,0,.45);transform:rotate(.8deg)}
.cx-fact::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:1.5px;background:rgba(182,64,48,.5)}
.cx-fact > .s-pin{top:-8px;left:50%;margin-left:-9px}
.cx-ft{margin:0;padding-right:52px;font-family:'Playfair Display',Georgia,serif;font-size:21px;font-weight:700;line-height:1.15;text-wrap:balance}
.cx-fd{margin:6px 0 0;font-size:16px;line-height:1.38;color:#2a2318;text-wrap:pretty}
.cx-factstamp{position:absolute;top:12px;right:14px;padding:3px 8px;border:3px double #2f6363;color:#2f6363;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;transform:rotate(6deg);mix-blend-mode:multiply}
.cx-hint{position:relative;padding:20px 22px 18px;background:linear-gradient(180deg,#ecd68a,#dcc271);color:#2a2318;box-shadow:0 1px 0 rgba(0,0,0,.2),0 18px 30px rgba(0,0,0,.4);transform:rotate(-1deg)}
.cx-hint p{margin:8px 0 0;font-size:18px;font-style:italic;line-height:1.38;text-wrap:pretty}
.cx-hint .cx-tape{top:-10px;left:50%;margin-left:-31px;transform:rotate(-3deg)}
/* side: attempts ledger + rounds */
.cx-log{position:relative;padding:18px 16px 8px 42px;background:#f4efe3;color:#07111f;box-shadow:0 1px 0 rgba(0,0,0,.2),0 20px 36px rgba(0,0,0,.4);transform:rotate(.6deg)}
.cx-log > .s-pin{top:-9px;left:50%;margin-left:-9px}
.cx-h3{margin:3px 0 0;font-family:'Playfair Display',Georgia,serif;font-size:20px;font-weight:700;line-height:1.15;color:#07111f;text-wrap:balance}
.cx-tries{margin:10px 0 0;padding:0;list-style:none}
.cx-try{position:relative;padding:10px 6px 12px 0;border-top:1px solid rgba(79,154,154,.45)}
.cx-try.is-now::before{content:"";position:absolute;left:-12px;right:-8px;top:0;bottom:0;z-index:0;background:rgba(239,212,134,.4)}
.cx-try > *{position:relative}
.cx-tryhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.cx-tryq{margin:6px 0 0;font-size:15px;font-style:italic;line-height:1.3;color:#2a2318}
.cx-trye{display:flex;align-items:baseline;gap:6px;margin:3px 0 0;font-size:15px;font-weight:600;line-height:1.3;color:#07111f}
.cx-trye svg{flex:none;width:14px;height:10px;fill:none;stroke:#9e3f2a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cx-redact{display:flex;flex-direction:column;gap:6px;margin:8px 0 2px}
.cx-redact i{display:block;height:11px;background:#1d1a16;transform:rotate(-.4deg)}
.cx-res{display:inline-block;margin-top:9px;padding:3px 8px;border:3px double currentColor;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;line-height:1.3;white-space:nowrap;transform:rotate(-2deg);mix-blend-mode:multiply}
.cx-res.win{color:#9e3f2a}
.cx-res.bad{color:#3b3328;transform:rotate(1.5deg)}
.cx-res.open{border:0;padding:4px 8px;background:#0d1014;color:#efd486;transform:none;mix-blend-mode:normal}
.cx-rounds{position:relative;padding:18px 18px 14px;background:#0d1014;color:#eee4d2;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 0 1px rgba(239,212,134,.16),0 20px 40px rgba(0,0,0,.5);transform:rotate(-.7deg)}
.cx-rounds > .s-pin{top:-9px;left:50%;margin-left:-9px}
.cx-round{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 10px;padding:11px 0;border-top:1px solid rgba(239,212,134,.18)}
.cx-rq{grid-column:1/-1;margin:0;font-size:15px;line-height:1.32;color:#cfc4b1}
.cx-rstate{display:inline-flex;align-items:center;gap:5px;padding:3px 7px;border-radius:2px;font-family:'Source Code Pro',ui-monospace,monospace;font-size:10px;font-weight:700;letter-spacing:.14em;white-space:nowrap}
.cx-rstate.ready{color:#efd486;box-shadow:inset 0 0 0 1px rgba(239,212,134,.6)}
.cx-rstate.done{background:#8fd0cf;color:#0d1014}
.cx-rstate.lock{color:#b3a794;box-shadow:inset 0 0 0 1px rgba(179,167,148,.45)}
.cx-rnote{margin:8px 0 0;padding-top:10px;border-top:1px solid rgba(239,212,134,.18);font-size:15px;font-style:italic;line-height:1.35;color:#cfc4b1}
/* motion: --d = start of the payoff sequence (later on first load, so it plays after the folder opens) */
.cx-d0{--d:1.65s}.cx-d1{--d:0s}
@keyframes cxOpen{from{clip-path:circle(0% at 50% 100%)}to{clip-path:circle(150% at 50% 100%)}}
@keyframes cxWipeA{from{clip-path:circle(0% at 50% 30%)}to{clip-path:circle(150% at 50% 30%)}}
@keyframes cxWipeB{from{clip-path:circle(0% at 50% 30%)}to{clip-path:circle(150% at 50% 30%)}}
@keyframes cxDrawA{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cxDrawB{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes cxGold{0%{stroke:#bf3b2c;stroke-width:2.1}18%{stroke:#fff6d6;stroke-width:5}100%{stroke:#efd486;stroke-width:2.6}}
@keyframes cxGoldM{0%{stroke:#bf3b2c;stroke-width:3.4}18%{stroke:#fff6d6;stroke-width:7}100%{stroke:#efd486;stroke-width:4.2}}
@keyframes cxGlowIn{0%{opacity:0}18%{opacity:1}100%{opacity:.55}}
@keyframes cxSweep{0%{opacity:0;transform:translateX(-64px) rotate(28deg)}15%,85%{opacity:1}100%{opacity:0;transform:translateX(64px) rotate(28deg)}}
@keyframes cxSlam{0%{opacity:0;transform:rotate(-17deg) scale(2.3)}55%{opacity:1;transform:rotate(-7deg) scale(.93)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes cxSlamD{0%{opacity:0;transform:rotate(14deg) scale(1.9)}60%{opacity:1;transform:rotate(4deg) scale(.95)}100%{opacity:1;transform:rotate(5deg) scale(1)}}
@keyframes cxRing{0%{opacity:0;transform:scale(.3)}8%{opacity:.9}100%{opacity:0;transform:scale(1.2)}}
@keyframes cxThud{0%,100%{transform:none}35%{transform:translateY(3px)}65%{transform:translateY(-1px)}}
@keyframes cxClipA{from{clip-path:polygon(0 0,100% 0,100% 7.1%,100% 14.3%,100% 21.4%,100% 28.6%,100% 35.7%,100% 42.9%,100% 50%,100% 57.1%,100% 64.3%,100% 71.4%,100% 78.6%,100% 85.7%,100% 92.9%,100% 100%,0 100%)}to{clip-path:polygon(0 0,58.4% 0,61.5% 7.1%,56.5% 14.3%,59.6% 21.4%,54.7% 28.6%,57.8% 35.7%,52.8% 42.9%,55.9% 50%,51% 57.1%,54% 64.3%,49.1% 71.4%,52.2% 78.6%,47.3% 85.7%,50.3% 92.9%,45.4% 100%,0 100%)}}
@keyframes cxTear{0%{opacity:0;transform:none;filter:none}1%{opacity:1}100%{opacity:1;transform:translate(4px,8px) rotate(-6deg);filter:drop-shadow(0 1px 0 rgba(0,0,0,.2)) drop-shadow(0 18px 18px rgba(0,0,0,.42))}}
@keyframes cxTearM{0%{opacity:0;transform:none;filter:none}1%{opacity:1}100%{opacity:1;transform:translate(0,12px) rotate(-1.8deg);filter:drop-shadow(0 1px 0 rgba(0,0,0,.2)) drop-shadow(0 18px 18px rgba(0,0,0,.42))}}
@keyframes cxFade{from{opacity:0}to{opacity:1}}
@keyframes cxRise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes cxDrop{0%{opacity:0;transform:translateY(-40px) rotate(-5deg)}60%{opacity:1;transform:translateY(4px) rotate(1.4deg)}100%{opacity:1;transform:rotate(.8deg)}}
@keyframes cxDropH{0%{opacity:0;transform:translateY(-40px) rotate(5deg)}60%{opacity:1;transform:translateY(4px) rotate(-1.8deg)}100%{opacity:1;transform:rotate(-1deg)}}
@keyframes cxShake{0%,100%{transform:rotate(1deg)}20%{transform:translateX(-8px) rotate(1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-4px) rotate(1deg)}80%{transform:translateX(2px) rotate(1deg)}}
@keyframes cxStampIn{0%{opacity:0;transform:rotate(-26deg) scale(2)}60%{opacity:1;transform:rotate(-10deg) scale(.92)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}
@keyframes cxStampR{0%{opacity:0;transform:rotate(18deg) scale(2)}60%{opacity:1;transform:rotate(5deg) scale(.92)}100%{opacity:1;transform:rotate(6deg) scale(1)}}
@keyframes cxPop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes cxPulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes cxDots{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes cxBlink{0%,100%{opacity:1}50%{opacity:.35}}
.cx-wa.cx-stage{animation:cxWipeA .5s cubic-bezier(.4,0,.2,1) both}
.cx-wb.cx-stage{animation:cxWipeB .5s cubic-bezier(.4,0,.2,1) both}
.cx-w0 .cx-draw{animation:cxDrawA .9s 1.4s cubic-bezier(.3,.7,.2,1) both}
.cx-wa .cx-draw{animation:cxDrawA .8s .3s cubic-bezier(.3,.7,.2,1) both}
.cx-wb .cx-draw{animation:cxDrawB .8s .3s cubic-bezier(.3,.7,.2,1) both}
.cx-glowpath{fill:none;stroke:#efd486;stroke-width:7;stroke-linecap:round;opacity:0}
.cx-pinglow{fill:none;stroke:#efd486;stroke-width:3;opacity:0}
.is-won .cx-draw{animation:none}
.is-won .cx-red{stroke:#efd486;stroke-width:2.6;animation:cxGold 1.2s var(--d) ease-out both}
.is-won .cx-magred{stroke:#efd486;stroke-width:4.2;animation:cxGoldM 1.2s var(--d) ease-out both}
.is-won .cx-glowpath{opacity:.55;animation:cxGlowIn 1.2s var(--d) ease-out both}
.is-won .cx-pinglow{opacity:1;animation:cxPulse 1.6s calc(var(--d) + .2s) ease-in-out 2 both}
.is-won .cx-glint{animation:cxSweep .9s calc(var(--d) + .15s) ease-in-out both}
.cx-bigstamp{animation:cxSlam .5s calc(var(--d) + .45s) cubic-bezier(.2,.8,.2,1) both}
.cx-bigstamp.dull{animation:cxSlamD .45s calc(var(--d) + .2s) cubic-bezier(.2,.8,.2,1) both}
.cx-ring{animation:cxRing .7s calc(var(--d) + .68s) ease-out both}
.is-won .cx-board{animation:cxThud .35s calc(var(--d) + .7s) ease-out both}
.is-won .cx-pc.b{transform-origin:100% 106px;transform:translate(4px,8px) rotate(-6deg);animation:cxTear .6s calc(var(--d) + .85s) cubic-bezier(.3,.7,.2,1) both}
.is-won .cx-fiber{animation:cxFade .2s calc(var(--d) + .85s) both}
.is-won .cx-pc.a > .cx-paper{animation:cxClipA .01s calc(var(--d) + .85s) both}
.is-won .cx-strike path{animation:cxDrawA .4s calc(var(--d) + 1.05s) cubic-bezier(.5,0,.3,1) both}
.is-won .cx-strike path + path{animation-delay:calc(var(--d) + 1.25s)}
.cx-lead{animation:cxRise .55s calc(var(--d) + 1.15s) cubic-bezier(.2,.8,.2,1) both}
.cx-endrow{animation:cxRise .5s calc(var(--d) + 1.65s) cubic-bezier(.2,.8,.2,1) both}
.cx-factk{animation:cxFade .4s calc(var(--d) + 1.3s) ease-out both}
.cx-fact{animation:cxDrop .7s calc(var(--d) + 1.35s) cubic-bezier(.2,.8,.2,1) both}
.cx-fact > .s-pin{animation:cxPop .35s calc(var(--d) + 1.85s) cubic-bezier(.2,.8,.2,1) both}
.cx-factstamp{animation:cxStampR .45s calc(var(--d) + 2s) cubic-bezier(.2,.8,.2,1) both}
.cx-rstate.done{animation:cxPop .35s calc(var(--d) + 1.9s) cubic-bezier(.2,.8,.2,1) both}
.is-fail .cx-ecard{animation:cxShake .45s calc(var(--d) + .35s) ease-out both}
.is-fail .cx-lead{animation-delay:calc(var(--d) + .45s)}
.is-fail .cx-endrow{animation-delay:calc(var(--d) + .9s)}
.cx-hint{animation:cxDropH .7s calc(var(--d) + .65s) cubic-bezier(.2,.8,.2,1) both}
.cx-d0 .cx-ok{animation-delay:1.5s}
@media (max-width:1180px){
  .cx-fold{grid-template-columns:minmax(0,1fr) 270px}
  .cx-leaf{gap:12px;padding:16px 24px 18px}
  .cx-stage{gap:16px}
  .cx-side{padding:24px 18px 26px 22px}
